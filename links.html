<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#ebedef;--soft:#b6bec8;--teal:#4cf0e0;--orange:#f59847;--line:#252c35;--card:#161c24;--sys:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0d1117;color:var(--ink);font-family:var(--sys);min-height:100svh;display:flex;flex-direction:column}
#glow{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  conic-gradient(from 118deg at 1.3% -6.9%, transparent 0deg, rgba(254,228,196,.1) 9deg, rgba(254,228,196,.28) 26deg, rgba(254,228,196,.1) 44deg, transparent 52deg),
  radial-gradient(46vmax 82vmax at 110% 55%, rgba(76,240,224,.08), transparent 60%),#0d1117}
#bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font:600 14px 'Archivo',sans-serif}
#bar a{color:var(--soft);text-decoration:none}
#bar .t{color:var(--ink)}
.wrap{flex:1;max-width:480px;width:100%;margin:0 auto;padding:28px 18px 40px}
h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;margin-bottom:6px}
.sub{color:var(--soft);font-size:13px;margin-bottom:22px}
.group{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.link{display:flex;align-items:center;gap:14px;padding:15px 16px;border-bottom:1px solid var(--line);
  text-decoration:none;color:var(--ink);font-size:15px;font-weight:600}
.link:last-child{border-bottom:none}
.link:active{background:rgba(76,240,224,.06)}
.link .ic{flex:none;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
.link .arr{margin-left:auto;color:var(--soft);font-size:14px}
.link .desc{font-size:11px;font-weight:400;color:var(--soft);margin-top:2px}
.ic-gh{background:#24292e;color:#fff}
.ic-li{background:#0a66c2;color:#fff}
.ic-x{background:#1a1a1a;color:#fff}
.ic-em{background:linear-gradient(135deg,#1c414c,#0d2028);color:var(--teal)}
.note{margin-top:18px;text-align:center;font:400 11px 'JetBrains Mono',monospace;color:var(--soft);opacity:.6}
</style>
</head>
