(function(){
var GN={
 g:{addSentHome:function(){},addDice:function(){}},
 friendly:false,
 whoBadge:function(el,name){if(el)el.textContent=name||'';},
 soloStart:function(cb){if(typeof cb==='function')cb('You');},
 matchStart:function(cb,opts){opts=opts||{};
   var P1={name:'Player 1',color:'#d8312b',light:'#f06a60',dark:'#8d1d19'},P2={name:'Player 2',color:'#2f6fd0',light:'#6fa0ec',dark:'#194182'};
   function go(mode){
     var m;
     if(mode==='solo'){var you={name:'You',color:P1.color,light:P1.light,dark:P1.dark};m={a:you,b:null,first:you,solo:true,friendly:false,vsComputer:false};}
     else if(mode==='cpu'){var y={name:'Player 1',color:P1.color,light:P1.light,dark:P1.dark},c={name:'Computer',color:P2.color,light:P2.light,dark:P2.dark};m={a:y,b:c,first:Math.random()<.5?y:c,friendly:false,vsComputer:true,bot:'medium'};}
     else{m={a:P1,b:P2,first:Math.random()<.5?P1:P2,friendly:false,vsComputer:false};}
     if(typeof cb==='function')cb(m);
   }
   var alt=opts.bot?['cpu','Play the computer']:(opts.solo?['solo','Play solo']:null);
   if(!alt){go('pnp');return;}
   var ov=document.createElement('div');
   ov.style.cssText='position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(5,7,10,.82);padding:20px;font-family:inherit';

   ov.innerHTML='<div style="width:100%;max-width:320px;background:#141a21;border:1px solid #2b323b;border-radius:16px;padding:20px 18px 18px;color:#ebedef;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5)">'+
     '<div style="font-size:18px;font-weight:800">Who is playing?</div>'+
     '<button data-m="'+alt[0]+'" style="'+bs+'border:1px solid #2c8c80;background:rgba(76,240,224,.14);color:#4cf0e0">'+alt[1]+'</button>'+
     '<button data-m="pnp" style="'+bs+'border:1px solid #3a434e;background:rgba(255,255,255,.05);color:#ebedef">Pass and play</button>'+
     '<div style="margin-top:12px;font-size:12px;opacity:.6">Two players, one phone.</div></div>';
   ov.addEventListener('click',function(e){var t=e.target.closest('[data-m]');if(!t)return;ov.remove();go(t.getAttribute('data-m'));});
   document.body.appendChild(ov);
 }, sync:function(){}, statsButton:function(){},
 players:function(){return [];},
 recordGame:function(key,rec){try{var k='gnl_'+key,a=JSON.parse(localStorage.getItem(k)||'[]');a.push(rec);if(a.length>200)a=a.slice(-200);localStorage.setItem(k,JSON.stringify(a));}catch(e){}},
 readGames:function(key){try{return JSON.parse(localStorage.getItem('gnl_'+key)||'[]');}catch(e){return [];}},
 confirmEnd:function(msg,onYes,onNo){var ok=window.confirm(msg);if(ok){if(typeof onYes==='function')onYes();}else if(typeof onNo==='function'){onNo();}},
 rulesButton:function(el,spec){
   if(!el)return;var b=document.createElement('button');b.textContent='Rules';
   b.style.cssText='margin:6px;padding:9px 16px;border-radius:10px;border:1px solid #556;background:rgba(255,255,255,.06);color:inherit;font:inherit;cursor:pointer';
   b.addEventListener('click',function(){
     var ov=document.createElement('div');
     ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(5,7,10,.93);overflow:auto;padding:26px 18px 40px;color:#e8e8ea;line-height:1.55;font-family:inherit';
     var h='<div style="max-width:560px;margin:0 auto">';
     h+='<h2 style="font-size:22px;margin:0 0 14px">'+((spec&&spec.title)||'Rules')+'</h2>';
     ((spec&&spec.sections)||[]).forEach(function(s){
       if(typeof s==='string'){h+='<p style="margin:0 0 12px">'+s+'</p>';return;}
       if(s.h)h+='<h3 style="font-size:15px;margin:16px 0 6px;color:#9fe8dd">'+s.h+'</h3>';
       if(s.svg)h+='<div style="margin:8px 0">'+s.svg+'</div>';
       if(s.t)h+='<p style="margin:0 0 8px;font-size:14px">'+s.t+'</p>';
       if(s.ex)h+='<p style="margin:0 0 8px;font-size:13px;font-style:italic;opacity:.8">'+s.ex+'</p>';
     });
     h+='<div><button id="gnRulesClose" style="margin-top:16px;padding:11px 22px;border-radius:10px;border:1px solid #2c8c80;background:rgba(76,240,224,.12);color:#4cf0e0;font:inherit;cursor:pointer">Close</button></div></div>';
     ov.innerHTML=h;document.body.appendChild(ov);
     ov.querySelector('#gnRulesClose').addEventListener('click',function(){ov.remove();});
   });
   el.appendChild(b);
 }

(function(){
// ---- shared 3D cube die ----
const CUBE_RING={1:[2,3],2:[1,4],3:[1,2],4:[1,5],5:[1,3],6:[2,4]};
const CUBE_PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
let _cubeCSS=false;
function cubeCSSOnce(){if(_cubeCSS)return;_cubeCSS=true;
  const st=document.createElement("style");
  st.textContent=
   ".gnCubeWrap{position:relative;perspective:520px;will-change:transform;display:inline-block;}"+
   ".gnCube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;transform:rotateX(-9deg) rotateY(11deg);}"+
   ".gnCf{position:absolute;inset:0;border-radius:11%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11%;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(120,100,60,.25);}"+
   ".gnCfF{background:linear-gradient(150deg,#fbf8ef 0%,#efe9da 65%,#ded6c2 100%);transform:translateZ(var(--dh));}"+
   ".gnCfT{background:linear-gradient(150deg,#ffffff 0%,#f8f4ea 70%,#ece5d4 100%);transform:rotateX(90deg) translateZ(var(--dh));}"+
   ".gnCfR{background:linear-gradient(150deg,#e2dac6 0%,#d2c8b0 70%,#bfb499 100%);transform:rotateY(90deg) translateZ(var(--dh));}"+
   ".gnCf i{border-radius:50%;background:radial-gradient(circle at 38% 32%,#3a4458,#10151f 70%);visibility:hidden;box-shadow:inset 0 1.5px 2px rgba(0,0,0,.55),0 .5px 0 rgba(255,255,255,.35);}"+
   ".gnCubeBust .gnCfF{background:linear-gradient(150deg,#f3b3ac 0%,#e2887e 65%,#cb6a60 100%);}"+
   ".gnCubeBust .gnCfT{background:linear-gradient(150deg,#f8c5bf 0%,#eda49b 70%,#dd9088 100%);}"+
   ".gnCubeBust .gnCf i{background:radial-gradient(circle at 38% 32%,#fff,#f3e0dd 70%);}"+
   ".gnCubeShadow{position:absolute;left:8%;right:8%;bottom:-12%;height:18%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);}";
  document.head.appendChild(st);}
GN.cubeDie=function(size){cubeCSSOnce();
  const wrap=document.createElement("div");wrap.className="gnCubeWrap";
  wrap.style.width=size+"px";wrap.style.height=size+"px";
  wrap.style.setProperty("--dh",(size/2)+"px");
  const shadow=document.createElement("div");shadow.className="gnCubeShadow";wrap.appendChild(shadow);
  const cube=document.createElement("div");cube.className="gnCube";wrap.appendChild(cube);
  const faces={};
  for(const[cls,key]of[["gnCfF","F"],["gnCfT","T"],["gnCfR","R"]]){
    const f=document.createElement("div");f.className="gnCf "+cls;
    for(let i=0;i<9;i++)f.appendChild(document.createElement("i"));
    cube.appendChild(f);faces[key]=f;}
  function faceSet(f,v){const on=CUBE_PIPS[v]||[];
    [...f.children].forEach((p,i)=>{p.style.visibility=on.includes(i)?"visible":"hidden";});}
  function show(v){faceSet(faces.F,v);faceSet(faces.T,CUBE_RING[v][0]);faceSet(faces.R,CUBE_RING[v][1]);}
  let busyT=false;
  function tumble(finalV,opts,done){if(typeof opts==="function"){done=opts;opts={};}opts=opts||{};
    if(busyT)return;busyT=true;
    const dur=opts.duration||640,hop=opts.hop!==undefined?opts.hop:size*0.55;
    const sgn=()=>Math.random()<0.5?-1:1;
    const RX=sgn()*(360+Math.floor(Math.random()*2)*360),RY=sgn()*(360+Math.floor(Math.random()*2)*360);
    const drift=(Math.random()*2-1)*size*0.2;
    if(wrap.animate)wrap.animate([
      {transform:"translate(0,0) scale(1,1)"},
      {transform:"translate(0,"+(size*0.12)+"px) scale(1.1,0.74)",offset:0.12},
      {transform:"translate("+drift+"px,"+(-hop)+"px) scale(0.97,1.03)",offset:0.44,easing:"cubic-bezier(.2,.9,.4,1)"},
      {transform:"translate("+(drift*0.35)+"px,0) scale(1.08,0.88)",offset:0.7,easing:"cubic-bezier(.5,0,.8,.4)"},
      {transform:"translate(0,"+(-hop*0.15)+"px) scale(1,1)",offset:0.85},
      {transform:"translate(0,0) scale(1,1)"}],{duration:dur,easing:"linear"});
    if(cube.animate)cube.animate([
      {transform:"rotateX(-9deg) rotateY(11deg)"},
      {transform:"rotateX("+(-9+RX*0.55)+"deg) rotateY("+(11+RY*0.55)+"deg)",offset:0.45,easing:"cubic-bezier(.25,.8,.5,1)"},
      {transform:"rotateX("+(-9+RX)+"deg) rotateY("+(11+RY)+"deg)",offset:0.86,easing:"cubic-bezier(.3,.7,.4,1)"},
      {transform:"rotateX("+(-9+RX)+"deg) rotateY("+(11+RY)+"deg)"}],{duration:dur,easing:"linear"});
    let n=0;const steps=Math.max(6,Math.floor(dur/64));
    const iv=setInterval(()=>{show(1+Math.floor(Math.random()*6));
      if(++n>=steps){clearInterval(iv);show(finalV);busyT=false;if(done)done();}},Math.floor(dur/(steps+1)));}
  show(1);
  return{el:wrap,show,tumble,setBust:function(b){wrap.classList.toggle("gnCubeBust",!!b);}};};
})();
window.GN=GN;
document.addEventListener('click',function(e){
  var a=e.target&&e.target.closest?e.target.closest('a[href="index.html"]'):null;
  if(a){e.preventDefault();try{if(window.parent!==window){parent.history.back();return;}}catch(err){}try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return;}}catch(err){}window.location.href='index.html';}
},true);
})();
</script>

<script>
const KEY="dots_games",B=5; // 5x5 boxes, 6x6 dots
function S(n,o){window.GNS&&GNS.play(n,0,o);}
let P={A:{name:"Player 1",main:"#d8312b",light:"#f06a60",dark:"#8d1d19"},B:{name:"Player 2",main:"#2f6fd0",light:"#6fa0ec",dark:"#194182"}};
function seatFrom(p){return{name:p.name,main:p.color,light:p.light,dark:p.dark};}
// edges: H[r][c] = horizontal edge above box row r (r 0..B, c 0..B-1); V[r][c] vertical (r 0..B-1, c 0..B)
let H,V,owner,turn="A",phase="over",GS=null,boxes={A:0,B:0},turnBoxes=0,lastEdge=null;
let vsComputer=false,botLevel="medium",cpuSeat=null;
const canvas=document.getElementById("cv"),ctx=canvas.getContext("2d");
let SZ=320,CELL=52,M=26;
function fit(){const w=Math.min(window.innerWidth-14,window.innerHeight-250,440);
  SZ=Math.max(300,w);M=SZ*0.09;CELL=(SZ-2*M)/B;canvas.width=SZ;canvas.height=SZ;render();}
window.addEventListener("resize",fit);
function boxDone(r,c){return H[r][c]&&H[r+1][c]&&V[r][c]&&V[r][c+1];}
function claimAround(kind,r,c){ // returns list of newly completed boxes after setting edge
  const done=[];
  const check=(br,bc)=>{if(br>=0&&br<B&&bc>=0&&bc<B&&!owner[br][bc]&&boxDone(br,bc))done.push([br,bc]);};
  if(kind==="H"){check(r-1,c);check(r,c);}else{check(r,c-1);check(r,c);}
  return done;}
function render(){if(!H)return;
  ctx.clearRect(0,0,SZ,SZ);
  // paper
  const pg=ctx.createLinearGradient(0,0,0,SZ);
  pg.addColorStop(0,"#f3ecd9");pg.addColorStop(1,"#e4d9bd");
  ctx.fillStyle=pg;ctx.fillRect(0,0,SZ,SZ);
  ctx.strokeStyle="rgba(120,140,180,.18)";ctx.lineWidth=1;
  for(let y=M*0.5;y<SZ;y+=CELL*0.5){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(SZ,y);ctx.stroke();}
  // claimed boxes
  for(let r=0;r<B;r++)for(let c=0;c<B;c++){if(!owner[r][c])continue;
    const pc=P[owner[r][c]],x=M+c*CELL,y=M+r*CELL;
    ctx.fillStyle=pc.main+"33";ctx.fillRect(x+3,y+3,CELL-6,CELL-6);
    ctx.fillStyle=pc.main;ctx.font="bold "+Math.round(CELL*0.42)+"px system-ui";
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(pc.name[0],x+CELL/2,y+CELL/2+1);}
  // edges
  function edge(x1,y1,x2,y2,v,isLast){
    if(v){const pc=P[v];
      ctx.strokeStyle=pc.main;ctx.lineWidth=isLast?6:4.5;ctx.lineCap="round";
      if(isLast){ctx.shadowColor=pc.main;ctx.shadowBlur=10;}
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.shadowBlur=0;}
    else{ctx.strokeStyle="rgba(60,70,90,.16)";ctx.lineWidth=3;ctx.lineCap="round";
      ctx.setLineDash([4,5]);
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
      ctx.setLineDash([]);}}
  for(let r=0;r<=B;r++)for(let c=0;c<B;c++)
    edge(M+c*CELL+5,M+r*CELL,M+(c+1)*CELL-5,M+r*CELL,H[r][c],lastEdge&&lastEdge[0]==="H"&&lastEdge[1]===r&&lastEdge[2]===c);
  for(let r=0;r<B;r++)for(let c=0;c<=B;c++)
    edge(M+c*CELL,M+r*CELL+5,M+c*CELL,M+(r+1)*CELL-5,V[r][c],lastEdge&&lastEdge[0]==="V"&&lastEdge[1]===r&&lastEdge[2]===c);
  // dots on top
  for(let r=0;r<=B;r++)for(let c=0;c<=B;c++){
    ctx.fillStyle="#3a3f4d";ctx.beginPath();ctx.arc(M+c*CELL,M+r*CELL,Math.max(3.4,CELL*0.075),0,7);ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.5)";ctx.beginPath();ctx.arc(M+c*CELL-1,M+r*CELL-1,1.3,0,7);ctx.fill();}}
function nearestEdge(x,y){let best=null,bd=1e9;
  for(let r=0;r<=B;r++)for(let c=0;c<B;c++){if(H[r][c])continue;
    const ex=M+(c+0.5)*CELL,ey=M+r*CELL,d=Math.hypot(x-ex,y-ey);
    if(d<bd){bd=d;best=["H",r,c];}}
  for(let r=0;r<B;r++)for(let c=0;c<=B;c++){if(V[r][c])continue;
    const ex=M+c*CELL,ey=M+(r+0.5)*CELL,d=Math.hypot(x-ex,y-ey);
    if(d<bd){bd=d;best=["V",r,c];}}
  return bd<=CELL*0.45?best:null;}
function newGame(){phase="over";lastEdge=null;
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("confetti").innerHTML="";
  GN.matchStart(function(m){P={A:seatFrom(m.a),B:seatFrom(m.b)};
    vsComputer=!!m.vsComputer;botLevel=m.bot||"medium";cpuSeat=vsComputer?"B":null;
    H=Array.from({length:B+1},()=>Array(B).fill(null));
    V=Array.from({length:B},()=>Array(B+1).fill(null));
    owner=Array.from({length:B},()=>Array(B).fill(null));
    boxes={A:0,B:0};turnBoxes=0;lastEdge=null;
    turn=(m.first===m.a)?"A":"B";phase="play";
    GS={start:Date.now(),flipWinner:m.first.name,friendly:m.friendly,bestRun:{}};
    GS.bestRun[m.a.name]=0;GS.bestRun[m.b.name]=0;
    setMessage(m.first.name+" won the flip \u2014 tap between two dots to draw a line.");
    refresh();render();maybeBot();},{bot:true});}
function setMessage(t){document.getElementById("msg").textContent=t;}
function refresh(){const pc=P[turn];
  document.getElementById("turnName").textContent=pc.name+"'s line";
  const d=document.getElementById("dot");
  d.style.background="radial-gradient(circle at 35% 30%,"+pc.light+","+pc.main+" 70%,"+pc.dark+")";
  d.style.boxShadow="0 0 0 3px rgba(255,255,255,.15),0 0 14px "+pc.main;
  const cA=document.getElementById("cntA"),cB=document.getElementById("cntB");
  cA.textContent=P.A.name+" "+boxes.A;cA.style.color=P.A.main;
  cB.textContent=boxes.B+" "+P.B.name;cB.style.color=P.B.main;
  const recs=GN.readGames(KEY);let a=0,b=0;
  for(const r of recs){if(r.winner===P.A.name)a++;else if(r.winner===P.B.name)b++;}
  document.getElementById("score").textContent=P.A.name+" "+a+" \u00b7 "+b+" "+P.B.name+((GS&&GS.friendly)?" \u00b7 friendly":"");}
canvas.addEventListener("click",e=>{if(phase!=="play")return;if(vsComputer&&turn===cpuSeat)return;
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(SZ/rect.width),y=(e.clientY-rect.top)*(SZ/rect.height);
  const ed=nearestEdge(x,y);if(!ed)return;
  const[k,r,c]=ed;
  if(k==="H"?H[r][c]:V[r][c])return;
  applyEdge(ed);});
function applyEdge(ed){const[k,r,c]=ed;
  if(k==="H")H[r][c]=turn;else V[r][c]=turn;
  lastEdge=ed;
  const done=claimAround(k,r,c);
  if(done.length){for(const[br,bc]of done){owner[br][bc]=turn;boxes[turn]++;turnBoxes++;}
    if(turnBoxes>GS.bestRun[P[turn].name])GS.bestRun[P[turn].name]=turnBoxes;
    if(boxes.A+boxes.B>=B*B){render();refresh();finishGame();return;}
    setMessage(P[turn].name+" boxes "+done.length+" \u2014 and goes again!");
    refresh();render();maybeBot();return;}
  turnBoxes=0;
  turn=turn==="A"?"B":"A";
  setMessage(P[turn].name+" \u2014 your line. Careful with the third side\u2026");
  refresh();render();maybeBot();}
function dUndrawn(){const m=[];
  for(let r=0;r<=B;r++)for(let c=0;c<B;c++)if(!H[r][c])m.push(["H",r,c]);
  for(let r=0;r<B;r++)for(let c=0;c<=B;c++)if(!V[r][c])m.push(["V",r,c]);
  return m;}
function dBoxesOf(k,r,c){const bx=[];
  if(k==="H"){if(r-1>=0)bx.push([r-1,c]);if(r<B)bx.push([r,c]);}
  else{if(c-1>=0)bx.push([r,c-1]);if(c<B)bx.push([r,c]);}
  return bx;}
function dSides(h,v,br,bc){return (h[br][bc]?1:0)+(h[br+1][bc]?1:0)+(v[br][bc]?1:0)+(v[br][bc+1]?1:0);}
function dClone(){return{h:H.map(x=>x.slice()),v:V.map(x=>x.slice())};}
function dClassify(mv){const k=mv[0],r=mv[1],c=mv[2],cl=dClone();if(k==="H")cl.h[r][c]=1;else cl.v[r][c]=1;
  let completes=0,makes3=0;for(const b of dBoxesOf(k,r,c)){const s=dSides(cl.h,cl.v,b[0],b[1]);if(s===4)completes++;else if(s===3)makes3++;}
  return{completes,makes3};}
function dEatAll(h,v){const claimed=Array.from({length:B},()=>Array(B).fill(false));
  for(let br=0;br<B;br++)for(let bc=0;bc<B;bc++)if(dSides(h,v,br,bc)===4)claimed[br][bc]=true;
  let total=0,go=true;
  while(go){go=false;
    const moves=[];
    for(let r=0;r<=B;r++)for(let c=0;c<B;c++)if(!h[r][c])moves.push(["H",r,c]);
    for(let r=0;r<B;r++)for(let c=0;c<=B;c++)if(!v[r][c])moves.push(["V",r,c]);
    for(const mv of moves){const k=mv[0],r=mv[1],c=mv[2];
      if(k==="H")h[r][c]=1;else v[r][c]=1;
      let nc=0;for(const b of dBoxesOf(k,r,c))if(!claimed[b[0]][b[1]]&&dSides(h,v,b[0],b[1])===4)nc++;
      if(nc>0){for(const b of dBoxesOf(k,r,c))if(!claimed[b[0]][b[1]]&&dSides(h,v,b[0],b[1])===4)claimed[b[0]][b[1]]=true;total+=nc;go=true;break;}
      else{if(k==="H")h[r][c]=0;else v[r][c]=0;}}}
  return total;}
function dPolicy(state,L){
  const moves=dUndrawn();if(!moves.length)return null;
  const completing=[],safe=[],unsafe=[];
  for(const mv of moves){const cl=dClassify(mv);
    if(cl.completes>0)completing.push(mv);
    else if(cl.makes3===0)safe.push(mv);
    else unsafe.push(mv);}
  const pick=a=>a[(Math.random()*a.length)|0];
  if(completing.length)return pick(completing);     // grab a free box (all levels chain these)
  if(L.depth<=1)return pick(moves);                 // Easy: no safety sense
  if(safe.length)return pick(safe);                 // Medium+: never give the 3rd side if avoidable
  if(L.depth>=6){                                    // Hard: forced -> open the SHORTEST chain
    let best=null,bg=1e9;
    for(const mv of unsafe){const cl=dClone();if(mv[0]==="H")cl.h[mv[1]][mv[2]]=1;else cl.v[mv[1]][mv[2]]=1;
      const g=dEatAll(cl.h,cl.v);if(g<bg){bg=g;best=mv;}}
    return best||pick(unsafe);}
  return pick(unsafe);                               // Medium: forced -> any
}
const DOTS_SPEC={policy:dPolicy};
function maybeBot(){if(!vsComputer||phase!=="play"||turn!==cpuSeat)return;
  if(!(window.GN&&GN.bot&&GN.bot.play)){setMessage("Computer's brain didn't load \u2014 reload the page (or play pass-and-play).");return;}
  GN.bot.play({},DOTS_SPEC,botLevel,function(ed){if(!ed||phase!=="play"||turn!==cpuSeat)return;applyEdge(ed);},600);}
function finishGame(){phase="over";
  const w=boxes.A===boxes.B?null:(boxes.A>boxes.B?"A":"B");
  const rec={start:GS.start,end:Date.now(),durationMs:Date.now()-GS.start,
    winner:w?P[w].name:null,loser:w?P[w==="A"?"B":"A"].name:null,draw:!w,
    flipWinner:GS.flipWinner,
    boxes:(function(){const s={};s[P.A.name]=boxes.A;s[P.B.name]=boxes.B;return s;})(),
    bestRun:GS.bestRun};
  GN.recordGame(KEY,rec);
  document.getElementById("ovTitle").textContent=w?P[w].name+" wins!":"Split right down the middle!";
  document.getElementById("ovText").textContent=boxes.A+" \u2013 "+boxes.B+(w?(" \u00b7 best run "+GS.bestRun[P[w].name]+" boxes"):"");
  if(w){const box=document.getElementById("confetti"),cols=[P[w].main,P[w].light,"#f4c542","#fff"];
    for(let i=0;i<60;i++){const d=document.createElement("div");d.className="cf";d.style.left=Math.random()*100+"%";
      d.style.background=cols[i%cols.length];d.style.animationDuration=(2.2+Math.random()*1.8)+"s";
      d.style.animationDelay=(Math.random()*0.8)+"s";box.appendChild(d);}}
  S("fanfare");document.getElementById("overlay").classList.add("show");refresh();}
document.getElementById("newBtn").addEventListener("click",newGame);
document.getElementById("ovBtn").addEventListener("click",newGame);
GN.rulesButton(document.getElementById("foot"),{title:"Dots & Boxes",sections:[
 {h:"Goal",t:"Claim more boxes than your opponent. A box is yours when you draw its FOURTH side \u2014 it fills with your color."},
 {h:"Your turn",t:"Tap between two neighboring dots to draw one line. Complete a box and you claim it AND move again \u2014 chain completions as long as they last."},
 {h:"Don't give the third side",t:"Early game is a dance of NOT drawing the third side of any box \u2014 the third side is a gift. Count before you draw.",
  ex:"Only \u201csafe\u201d lines remain that all create a third side somewhere. Whoever runs out of safe moves first opens the floodgates."},
 {h:"Chains",t:"Late game, boxes form chains \u2014 open one and your opponent eats the WHOLE chain. The trick is to open the SHORTEST chain available, feeding them little to save the big chains for yourself."},
 {h:"The double-cross",t:"The expert move: when gobbling a long chain, leave the LAST TWO boxes by drawing the closing line instead. You sacrifice two boxes \u2014 but your opponent must open the next chain for you. Whoever controls the chain count usually controls the game.",
  ex:"A 7-chain and a 5-chain remain. Take 5 of the 7, decline the last two \u2014 they get 2, then must hand you the 5-chain. You: 10, them: 2."}]});
GN.statsButton(document.getElementById("foot"),{title:"Dots and Boxes",key:KEY,specials:[
 {label:"Boxes claimed",of:(r,n)=>r.reduce((a,x)=>a+((x.boxes&&x.boxes[n])||0),0)},
 {label:"Best chain run",of:(r,n)=>r.reduce((a,x)=>Math.max(a,(x.bestRun&&x.bestRun[n])||0),0)},
 {label:"Coin flips won",of:(r,n)=>r.filter(x=>x.flipWinner===n).length}]});
if(window.GNS)GNS.button(document.getElementById("foot"));
fit();newGame();
