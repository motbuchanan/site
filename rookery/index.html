<style>
  :root{
    --paper:#f7f3ea; --ink:#2a2620; --muted:#7a7266;
    --forest:#2f5d50; --forest-lite:#e3ece8;
    --card:#b23a3a; --gold:#b8912f; --green:#2f7d4f; --red:#b23a3a;
    --line:#e0d8c8; --shadow:0 1px 3px rgba(40,30,20,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.4;
    padding:0 0 76px 0;
  }
  header{
    background:var(--forest); color:#f7f3ea;
    padding:16px 16px 14px; position:sticky; top:0; z-index:20;
    box-shadow:0 2px 8px rgba(40,30,20,.18);
  }
  .htop{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.2px;}
  .ver{font-size:11px; background:rgba(255,255,255,.15); color:#f7f3ea; padding:3px 8px; border-radius:20px; border:none; cursor:pointer; white-space:nowrap;}
  .sub{font-size:12px; color:#d8e5df; margin-top:5px;}
  .progress{margin-top:11px; background:rgba(255,255,255,.12); border-radius:10px; padding:8px 12px; font-size:13px; display:flex; justify-content:space-between; align-items:center;}
  .progress b{font-size:15px;}
  .bar{height:5px; background:rgba(255,255,255,.18); border-radius:4px; margin-top:8px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--gold); width:0%; transition:width .25s;}

  main{padding:14px 12px 0;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- Collection ---- */
  .section{margin-bottom:14px; background:#fff; border-radius:14px; box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--line);}
  .shead{display:flex; align-items:center; gap:10px; padding:13px 15px; cursor:pointer; background:#fff; border:none; width:100%; text-align:left; color:var(--ink);}
  .shead .stitle{font-size:15px; font-weight:700; flex:1;}

const KEY = "bob_public_v1";
let mem = null;
let state = null;

function blankState(){
  return { v:1, birds:{}, seed:0, purchases:[], listings:[], nextLid:1 };
}
function ensureBird(id){
  if(!state.birds[id]) state.birds[id] = { qty:0, acqQty:0, acqCost:0 };
  return state.birds[id];
}
function loadState(){
  // existing saved state for this browser, else start empty
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ state = JSON.parse(raw); migrate(); return; }
  }catch(e){}
  state = blankState();
  saveState();
}
function migrate(){
  if(!state || typeof state!=="object") state = blankState();
  if(!state.birds) state.birds={};
  if(typeof state.seed!=="number") state.seed=0;
  if(!Array.isArray(state.purchases)) state.purchases=[];
  if(!Array.isArray(state.listings)) state.listings=[];
  if(typeof state.nextLid!=="number") state.nextLid=(state.listings.reduce((m,l)=>Math.max(m,l.lid||0),0)+1);
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); mem=null; }
  catch(e){ mem = state; }
}
function qtyOf(id){ const b=state.birds[id]; return b? (b.qty||0):0; }
function setQty(id, q){
  q = Math.max(0, q);
  const b = ensureBird(id);
  b.qty = q;
  saveState();
}

/* ===================== MONEY ENGINE (pure-ish) ===================== */
function applyPurchase(ids, lotCost, shipping){
  const n = ids.length;
  if(n===0) return;
  const per = (lotCost + shipping) / n;
  ids.forEach(id=>{
    const b = ensureBird(id);
    b.acqCost = (b.acqCost*b.acqQty + per) / (b.acqQty + 1);
    b.acqQty += 1;
    b.qty += 1;
  });
  state.purchases.push({ date: todayISO(), ids: ids.slice(), lotCost: lotCost, shipping: shipping, per: per });
  saveState();
}
function createListing(id, ask){
  const l = { lid: state.nextLid++, id:id, ask:ask, status:"listed", dateListed: todayISO() };
  state.listings.push(l);
  saveState();
  return l;
}
function updateAsk(lid, ask){
  const l = state.listings.find(x=>x.lid===lid);
  if(l){ l.ask = ask; saveState(); }
}
function cancelListing(lid){
  state.listings = state.listings.filter(x=>x.lid!==lid);
  saveState();
}
function markSold(lid, sale, fee, ship){
  const l = state.listings.find(x=>x.lid===lid);
  if(!l) return;
  l.status = "sold";
  l.sale = sale; l.fee = fee; l.shipPaid = ship;
  l.net = sale - fee - ship;
  l.dateSold = todayISO();
  const b = ensureBird(l.id);
  b.qty = Math.max(0, b.qty - 1);
  saveState();
}
function computeWallet(){
  let spent=0, earned=0;
  state.purchases.forEach(p=> spent += (p.lotCost + p.shipping));
  state.listings.forEach(l=>{ if(l.status==="sold") earned += l.net; });
  return { balance: state.seed - spent + earned, spent: spent, earned: earned };
}
function computeStats(){
  let ownedUnique=0, total=0, doubles=0;
  SECTION_ORDER.forEach(k=> DATA[k].birds.forEach(b=>{
    total++; const q=qtyOf(b.id);
    if(q>0) ownedUnique++;
    if(q>1) doubles += (q-1);
  }));
  let listedCount=0, listedValue=0, feesPaid=0, shipPaid=0, birdsBought=0, birdsSold=0;
  state.listings.forEach(l=>{
    if(l.status==="listed"){ listedCount++; listedValue += l.ask; }
    if(l.status==="sold"){ birdsSold++; feesPaid += l.fee; }
  });
  state.purchases.forEach(p=>{ shipPaid += p.shipping; birdsBought += p.ids.length; });
  const w = computeWallet();
  const avgCost = birdsBought ? (w.spent / birdsBought) : 0;
  return { ownedUnique, total, needed: total-ownedUnique, doubles,
    listedCount, listedValue, feesPaid, shipPaid, birdsBought, birdsSold,
    spent: w.spent, earned: w.earned, wallet: w.balance, seed: state.seed, avgCost };
}

function money(n){ const v=Math.round((n+Number.EPSILON)*100)/100; return "$"+v.toFixed(2); }
function searchTerms(b){
  const year = (b.meta.match(/\b(20\d{2})\b/) || [])[1] || "";
  const term = b.name.replace(/\(mini\)/i, "miniature");
  return { term: term, year: year };
}
function lookupURL(b){
  const t = searchTerms(b);
  const q = 'Hallmark "Beauty of Birds" ' + t.term + (t.year ? " " + t.year : "");
  return "https://www.google.com/search?q=" + encodeURIComponent(q);
}
function ebayURL(b){
  const t = searchTerms(b);
  const q = "Hallmark Beauty of Birds " + t.term + (t.year ? " " + t.year : "");
  // active listings (currently for sale) — what's available to buy
  return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(q);
}
function ebaySoldURL(b){
  const t = searchTerms(b);
  const q = "Hallmark Beauty of Birds " + t.term + (t.year ? " " + t.year : "");
  return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(q) + "&LH_Sold=1&LH_Complete=1";
}
function escAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ===================== RENDER: COLLECTION ===================== */
const vCollection = document.getElementById("view-collection");
function renderCollection(){
  vCollection.innerHTML = "";
  SECTION_ORDER.forEach(key=>{
    const sec = DATA[key];
    const el = document.createElement("section");
    el.className = "section";
    const owned = sec.birds.filter(b=>qtyOf(b.id)>0).length;
    const head = document.createElement("button");
    head.className = "shead";
    head.innerHTML = '<span class="stitle">'+sec.title+'</span><span class="scount">'+owned+'/'+sec.birds.length+'</span><span class="chev">▼</span>';
    head.addEventListener("click", ()=> el.classList.toggle("collapsed"));
    el.appendChild(head);
    const note = document.createElement("div");
    note.className = "snote" + (sec.warn?" warn":"");
    note.textContent = sec.note;
    el.appendChild(note);
    const rows = document.createElement("div");
    rows.className = "rows";
    sec.birds.forEach(b=>{
      const q = qtyOf(b.id);
      const row = document.createElement("div");
      row.className = "row" + (q>0?" owned":"");
      const check = document.createElement("div");
      check.className = "check";
      check.innerHTML = q>0 ? "✓" : "";
      check.addEventListener("click", ()=>{ setQty(b.id, q>0?0:1); renderAll(); });
      const info = document.createElement("div");
      info.className = "rinfo";
      const dbl = q>1 ? ' <span class="dbl">'+(q-1)+' double'+(q-1>1?'s':'')+'</span>' : '';
      const bd = state.birds[b.id];
      const costLine = (bd && bd.acqQty>0) ? '<div class="rcost">paid avg '+money(bd.acqCost)+'</div>' : '';
      info.innerHTML = '<a class="rname" href="'+escAttr(lookupURL(b))+'" target="_blank" rel="noopener">'+escHtml(b.name)+'<span class="ext">↗</span></a>'+
        ' <a class="ebaylink" href="'+escAttr(ebayURL(b))+'" target="_blank" rel="noopener">eBay ↗</a>'+
        ' <a class="ebaysold" href="'+escAttr(ebaySoldURL(b))+'" target="_blank" rel="noopener">sold ↗</a>'+
        dbl+'<div class="rmeta">'+escHtml(b.meta)+'</div>'+costLine;
      const step = document.createElement("div");
      step.className = "stepper";
      const minus = document.createElement("div");
      minus.className = "stepbtn" + (q<=0?" dim":"");
      minus.textContent = "−";
      minus.addEventListener("click", ()=>{ setQty(b.id, qtyOf(b.id)-1); renderAll(); });
      const num = document.createElement("div");
      num.className = "qty" + (q<=0?" zero":"");
      num.textContent = q;
      const plus = document.createElement("div");
      plus.className = "stepbtn"; plus.textContent = "+";
      plus.addEventListener("click", ()=>{ setQty(b.id, qtyOf(b.id)+1); renderAll(); });
      step.appendChild(minus); step.appendChild(num); step.appendChild(plus);
      const tile = document.createElement("div"); tile.innerHTML = silTile(b);
      row.appendChild(check); row.appendChild(tile.firstChild); row.appendChild(info); row.appendChild(step);
      rows.appendChild(row);
    });
    el.appendChild(rows);
    vCollection.appendChild(el);
  });
  const foot = document.createElement("div");
  foot.className = "gapfoot";
  foot.innerHTML = 'Spot a bird that is missing, or a year that looks wrong? '+
    '<a href="'+gapMailto()+'">Tell me and I will fix it</a>.';
  vCollection.appendChild(foot);
}
function gapMailto(){
  const subject = "Rookery: a missing bird or a gap";
  const body = "What bird or edition is missing (or what looks wrong):\n\nYear / series if you know it:\n\nAnything else you would want the tracker to do:\n";
  return "mailto:motbuchanan.builds@gmail.com?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);
}

/* ===================== RENDER: MONEY ===================== */
const vMoney = document.getElementById("view-money");
function renderMoney(){
  const s = computeStats();
  const selfFunding = s.earned >= s.spent;
  const afloat = s.wallet >= 0;
  let html = "";

  html += '<div class="wallet">';
  html += '<button class="wedit" id="editSeed">seed '+money(s.seed)+'</button>';
  html += '<div class="wlabel">Wallet</div>';
  html += '<div class="wbig">'+money(s.wallet)+'</div>';
  html += '<div class="wline">Earned '+money(s.earned)+' · spent '+money(s.spent)+'</div>';
  if(s.seed===0 && s.spent===0 && s.earned===0){
    html += '<div class="wstatus ok">Set your seed money to start</div>';
  } else if(afloat && selfFunding){
    html += '<div class="wstatus ok">Self-funding · sales cover buying</div>';
  } else if(afloat){
    html += '<div class="wstatus ok">Afloat · '+money(s.seed - s.wallet)+' of seed used</div>';
  } else {
    html += '<div class="wstatus low">Over budget by '+money(-s.wallet)+'</div>';
  }
  html += '</div>';

  html += '<div class="mbtns">';
  html += '<div class="mbtn" id="btnBuy"><div class="mi">🛒</div><div class="ml">Log a purchase</div></div>';
  html += '<div class="mbtn" id="btnList"><div class="mi">🏷️</div><div class="ml">List a double</div></div>';
  html += '</div>';

  html += '<div class="statgrid">';
  html += stat(s.ownedUnique+" / "+s.total, "Collection");
  html += stat(String(s.needed), "Still needed");
  html += stat(String(s.doubles), "Doubles on hand");
  html += stat(s.listedCount+" · "+money(s.listedValue), "Listed now");
  html += stat(money(s.shipPaid), "Shipping paid");
  html += stat(money(s.feesPaid), "eBay fees paid");
  html += stat(s.birdsBought+" / "+s.birdsSold, "Bought / sold");
  html += stat(money(s.avgCost), "Avg cost / bird");
  html += '</div>';

  // active listings
  const active = state.listings.filter(l=>l.status==="listed");
  html += '<div class="block"><div class="bhead">Listed on eBay <span class="bcount">'+active.length+'</span></div>';
  if(active.length===0){
    html += '<div class="empty">Nothing listed. Tap "List a double" when you post one.</div>';
  } else {
    active.forEach(l=>{
      const b = BY_ID[l.id] || {name:l.id, meta:""};
      html += '<div class="litem"><div class="ln"><div class="lname">'+escHtml(b.name)+'</div><div class="lmeta">listed '+l.dateListed+'</div></div>'+
        '<div class="lask">'+money(l.ask)+'</div>'+
        '<button class="pill edit" data-ask="'+l.lid+'">edit</button>'+
        '<button class="pill sell" data-sold="'+l.lid+'">sold</button></div>';
    });
  }
  html += '</div>';

  // recent activity
  const log = buildLog();
  html += '<div class="block"><div class="bhead">Recent activity <span class="bcount">'+log.length+'</span></div>';
  if(log.length===0){
    html += '<div class="empty">Purchases and sales show up here.</div>';
  } else {
    log.slice(0,20).forEach(e=>{
      html += '<div class="logrow"><div><div>'+escHtml(e.label)+'</div><div class="lgt">'+e.date+'</div></div><div class="'+(e.amt>=0?'amt-pos':'amt-neg')+'">'+(e.amt>=0?'+':'')+money(e.amt)+'</div></div>';
    });
  }
  html += '</div>';

  html += '<div class="mbtns"><div class="mbtn" id="btnBackup"><div class="mi">💾</div><div class="ml">Backup</div></div>'+
          '<div class="mbtn" id="btnShare"><div class="mi">📤</div><div class="ml">Share my list</div></div></div>';

  vMoney.innerHTML = html;

  // wire
  document.getElementById("editSeed").onclick = openSeed;
  document.getElementById("btnBuy").onclick = openBuy;
  document.getElementById("btnList").onclick = openList;
  document.getElementById("btnBackup").onclick = openBackup;
  document.getElementById("btnShare").onclick = openShare;
  vMoney.querySelectorAll("[data-sold]").forEach(btn=> btn.onclick=()=>openSold(parseInt(btn.getAttribute("data-sold"),10)));
  vMoney.querySelectorAll("[data-ask]").forEach(btn=> btn.onclick=()=>openEditAsk(parseInt(btn.getAttribute("data-ask"),10)));
}
function stat(v,l){ return '<div class="stat"><div class="sv">'+v+'</div><div class="sl">'+l+'</div></div>'; }
function buildLog(){
  const out=[];
  state.purchases.forEach(p=>{
    const names = p.ids.map(id=> (BY_ID[id]||{name:id}).name);
    const label = "Bought "+p.ids.length+" ("+names.slice(0,2).join(", ")+(names.length>2?"…":"")+")";
    out.push({ date:p.date, label:label, amt: -(p.lotCost+p.shipping) });
  });
  state.listings.forEach(l=>{ if(l.status==="sold"){
    const b=BY_ID[l.id]||{name:l.id};
    out.push({ date:l.dateSold, label:"Sold "+b.name, amt: l.net });
  }});
  out.sort((a,b)=> a.date<b.date?1:-1);
  return out;
}

function applyIncomingSync(){
  if(!location.hash || location.hash.indexOf("#c=")!==0) return;
  try{
    const map = JSON.parse(atob(decodeURIComponent(location.hash.slice(3))));
    const n = Object.keys(map).length;
    openSheet(
      '<h2>Update your checklist?</h2><p>This link marks '+n+' birds as owned, matching the person who sent it. Your current marks will be replaced.</p>'+
      '<div class="sheetbtns"><button class="btn primary" id="applySync">Yes, update</button><button class="btn ghost" id="cancel">Keep mine</button></div>'
    );
    document.getElementById("cancel").onclick=()=>{ closeSheet(); history.replaceState(null,"",location.pathname+location.search); };
    document.getElementById("applySync").onclick=()=>{
      SECTION_ORDER.forEach(k=>DATA[k].birds.forEach(b=>{ ensureBird(b.id).qty = map[b.id]||0; }));
      saveState(); history.replaceState(null,"",location.pathname+location.search); closeSheet(); renderAll(); toast("Checklist updated");
    };
  }catch(e){}
}

/* ===================== UPDATE CHECK ===================== */
// Looks for a newer Rookery on open, when you come back to the app, when the
// connection returns, and every 30 minutes while it's open. The version on the
// badge (verBtn) is the single source of truth: the live page's badge is compared
// with this one. Updating is a tap, never automatic, so nothing you're typing is lost.
(function(){
  var badge = document.getElementById('verBtn');
  var CUR = ((badge && badge.textContent.match(/v(\d+(?:\.\d+)*)/)) || [])[1] || '0';
  var bar = document.getElementById('updBar'), label = document.getElementById('updLabel');
  var lastCheck = 0, offered = null, snoozedFor = null;
  function newer(a, b){
    var pa = a.split('.').map(Number), pb = b.split('.').map(Number);
    for (var i = 0; i < Math.max(pa.length, pb.length); i++){
      var x = pa[i] || 0, y = pb[i] || 0; if (x !== y) return x > y;
    }
    return false;
  }
  function offer(v){
    if (v === snoozedFor) return;
    offered = v; label.textContent = 'Rookery v' + v + ' is ready. Tap to update'; bar.hidden = false;
  }
  function check(force){
    if (!navigator.onLine) return;
    var now = Date.now(); if (!force && now - lastCheck < 15000) return; lastCheck = now;
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(r){ if (r) r.update().catch(function(){}); }).catch(function(){});
    }
    fetch('./', { cache: 'no-store' }).then(function(res){ return res.ok ? res.text() : ''; }).then(function(t){
      var m = t.match(/id="verBtn">v(\d+(?:\.\d+)*)/);
      if (m && newer(m[1], CUR)) offer(m[1]);
    }).catch(function(){});
  }
  document.getElementById('updBtn').addEventListener('click', function(){
    label.textContent = 'Updating…';
    var go = function(){ location.reload(); };
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(r){ return r ? r.update() : null; }).then(go, go);
    } else go();
  });
  document.getElementById('updX').addEventListener('click', function(){ bar.hidden = true; snoozedFor = offered; });
  window.addEventListener('load', function(){ setTimeout(function(){ check(true); }, 2500); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) check(false); });
  window.addEventListener('online', function(){ check(true); });
  setInterval(function(){ if (!document.hidden) check(true); }, 30 * 60 * 1000);
  window.__rookeryCheckForUpdate = check;
})();


/* ===================== INSTALL PROMPT ===================== */
(function(){
  var bar=document.getElementById("installBar");
  var btn=document.getElementById("installBtn");
  var xb=document.getElementById("installX");
  var deferred=null;
  function standalone(){ try{ return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone===true; }catch(e){ return false; } }
  function dismissed(){ try{ return localStorage.getItem("rookery_install_dismiss")==="1"; }catch(e){ return false; } }
  function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream; }
  function show(label){ if(standalone()||dismissed()) return; bar.querySelector(".ib-label").textContent=label; bar.hidden=false; }
  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); deferred=e; show("Install Rookery on your phone"); });
  if(isIOS() && !standalone() && !dismissed()){ show("Add Rookery to your home screen"); }
  btn.addEventListener("click", function(){
    if(deferred){ deferred.prompt(); deferred.userChoice.then(function(){ deferred=null; bar.hidden=true; }); }
    else if(isIOS()){
      openSheet('<h2>Keep Rookery on your phone</h2>'+
        '<p>Safari does not have an install button, but you can add Rookery to your home screen in two taps:</p>'+
        '<div class="guide">'+
        '<div class="gstep"><b>1.</b> Tap the Share button at the bottom of Safari (the square with an arrow pointing up).</div>'+
        '<div class="gstep"><b>2.</b> Scroll down and tap <b>Add to Home Screen</b>, then Add.</div>'+
        '</div>'+
        '<p style="font-size:11.5px;margin-top:10px;">It opens full screen after that and works offline.</p>'+
        '<div class="sheetbtns"><button class="btn primary" id="iosOk">Got it</button></div>');
      document.getElementById("iosOk").onclick=closeSheet;
    } else {
      openSheet('<h2>Keep Rookery on your phone</h2>'+
        '<p>In your browser menu, choose <b>Install app</b> or <b>Add to Home screen</b>. It opens full screen and works offline.</p>'+
        '<div class="sheetbtns"><button class="btn primary" id="genOk">Got it</button></div>');
      document.getElementById("genOk").onclick=closeSheet;
    }
  });
  xb.addEventListener("click", function(){ bar.hidden=true; try{ localStorage.setItem("rookery_install_dismiss","1"); }catch(e){} });
  window.addEventListener("appinstalled", function(){ bar.hidden=true; });
})();
// First visit: show the guide once (unless a sync link is being applied)
try{
  if(!localStorage.getItem(GUIDE_KEY) && location.hash.indexOf("#c=")!==0){ showGuide(); }
}catch(e){}
