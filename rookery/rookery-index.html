<style>
  :root{
    --paper:#f7f3ea; --ink:#2a2620; --muted:#7a7266;
    --forest:#2f5d50; --forest-lite:#e3ece8;
    --card:#b23a3a; --gold:#b8912f; --green:#2f7d4f; --red:#b23a3a;
    --line:#e0d8c8; --shadow:0 1px 3px rgba(40,30,20,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.4;
    padding:0 0 76px 0;
  }
  header{
    background:var(--forest); color:#f7f3ea;
    padding:16px 16px 14px; position:sticky; top:0; z-index:20;
    box-shadow:0 2px 8px rgba(40,30,20,.18);
  }
  .htop{display:flex; align-items:baseline; justify-content:space-between; gap:10px;}
  h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.2px;}
  .ver{font-size:11px; background:rgba(255,255,255,.15); color:#f7f3ea; padding:3px 8px; border-radius:20px; border:none; cursor:pointer; white-space:nowrap;}
  .sub{font-size:12px; color:#d8e5df; margin-top:5px;}
  .progress{margin-top:11px; background:rgba(255,255,255,.12); border-radius:10px; padding:8px 12px; font-size:13px; display:flex; justify-content:space-between; align-items:center;}
  .progress b{font-size:15px;}
  .bar{height:5px; background:rgba(255,255,255,.18); border-radius:4px; margin-top:8px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:var(--gold); width:0%; transition:width .25s;}

  main{padding:14px 12px 0;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- Collection ---- */
  .section{margin-bottom:14px; background:#fff; border-radius:14px; box-shadow:var(--shadow); overflow:hidden; border:1px solid var(--line);}
  .shead{display:flex; align-items:center; gap:10px; padding:13px 15px; cursor:pointer; background:#fff; border:none; width:100%; text-align:left; color:var(--ink);}
  .shead .stitle{font-size:15px; font-weight:700; flex:1;}
  .shead .scount{font-size:12px; color:var(--muted); background:var(--forest-lite); padding:2px 9px; border-radius:20px; font-weight:600;}
  .shead .chev{font-size:13px; color:var(--muted); transition:transform .2s;}
  .section.collapsed .chev{transform:rotate(-90deg);}
  .section.collapsed .rows{display:none;}
  .snote{font-size:12px; color:var(--muted); padding:0 15px 11px; margin-top:-3px;}
  .snote.warn{color:#9a6a1e;}
  .rows{border-top:1px solid var(--line);}
  .row{display:flex; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid #f0ebe0;}
  .row:last-child{border-bottom:none;}
  .row.owned{background:#fbf6ef;}
  .check{width:30px; height:30px; border-radius:8px; border:2px solid var(--line); background:#fff; flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px; color:#fff; transition:all .12s;}
  .row.owned .check{background:var(--forest); border-color:var(--forest);}
  .rinfo{flex:1; min-width:0;}
  .rname{font-size:14.5px; font-weight:600; line-height:1.25; color:var(--forest); text-decoration:none; border-bottom:1px dotted #bcd0c9; display:inline;}
  .rname:active{opacity:.6;}
  .ext{font-size:10px; color:var(--muted); margin-left:3px; border:none;}
  .ebaylink{font-size:11.5px; font-weight:700; color:#0b57d0; text-decoration:none; border:none; margin-left:9px; white-space:nowrap;}
  .ebaylink:active{opacity:.6;}
  .rmeta{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .rcost{font-size:11px; color:var(--gold); margin-top:1px; font-weight:600;}
  .stepper{display:flex; align-items:center; gap:2px; flex:none;}
  .stepbtn{width:34px; height:34px; border-radius:9px; border:1.5px solid var(--line); background:#fff; font-size:19px; font-weight:600; color:var(--forest); display:flex; align-items:center; justify-content:center; cursor:pointer; user-select:none;}
  .stepbtn:active{background:var(--forest-lite);}
  .stepbtn.dim{color:#cfc7b8; border-color:#eee;}
  .qty{width:30px; text-align:center; font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;}
  .qty.zero{color:#cfc7b8;}
  .dbl{font-size:10px; color:var(--card); font-weight:700; margin-left:5px;}

  /* ---- Money ---- */
  .wallet{background:var(--forest); color:#fff; border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:var(--shadow);}
  .wallet .wlabel{font-size:12px; color:#cfe0d9; letter-spacing:.3px; text-transform:uppercase;}
  .wallet .wbig{font-size:34px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums;}
  .wallet .wline{font-size:12.5px; color:#d8e5df; margin-top:7px;}
  .wallet .wstatus{display:inline-block; margin-top:9px; font-size:12px; font-weight:700; padding:4px 11px; border-radius:20px;}
  .wstatus.ok{background:rgba(126,217,160,.25); color:#d6f5e2;}
  .wstatus.low{background:rgba(230,150,150,.25); color:#ffdede;}
  .wallet .wedit{float:right; font-size:11px; background:rgba(255,255,255,.15); color:#fff; border:none; padding:4px 10px; border-radius:16px; cursor:pointer;}

  .mbtns{display:flex; gap:9px; margin-bottom:14px;}

  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>

<script>
"use strict";

/* ===================== MASTER DATA (Hallmark Beauty of Birds) ===================== */
const DATA = {
  main: {

    warn: false,
    birds: [

  },

      {id:"mini-2014-oriole", name:"Baltimore Oriole (mini)", meta:"2014 · QXM8513"},
      {id:"mini-2015-bluebunting", name:"Blue Bunting (mini)", meta:"2015 · QXM8527"},
      {id:"mini-2016-hummingbird", name:"Hummingbird (mini)", meta:"2016"},

      {id:"mini-2022-btbwarbler", name:"Black-Throated Blue Warbler (mini)", meta:"2022"},
      {id:"mini-2023-ladywtanager", name:"Lady Western Tanager (mini)", meta:"2023"},
      {id:"mini-2024-stellersjay", name:"Steller's Jay (mini)", meta:"2024"},
      {id:"mini-2025-bunting", name:"Painted Bunting (mini)", meta:"2025"},
      {id:"mini-2026-grosbeak", name:"Pine Grosbeak (mini)", meta:"2026"}
    ]
  },
  special: {
    title: "Event Exclusives, Special & Anniversary",
    note: "Beauty of Birds pieces outside the annual run: club/event repaints, anniversary and special editions.",
    warn: false,
    birds: [
      {id:"spec-2011-scarlet", name:"Scarlet Tanager", meta:"2011 · KOC event exclusive"},
      {id:"spec-2013-indigo", name:"Indigo Bunting", meta:"2013 · KOC event exclusive"},
      {id:"spec-2015-hummingbird", name:"Hummingbird (repaint)", meta:"2015 · KOC event exclusive"},
      {id:"spec-2019-bluegray", name:"Blue-Gray Tanager", meta:"2019 · KOC event exclusive"},
      {id:"spec-2019-heron", name:"Great Blue Heron", meta:"2019 · 15th Anniversary"},
      {id:"spec-2024-allens", name:"Allen's Hummingbird", meta:"2024 · Special Edition"},
      {id:"spec-ghost-magpie", name:"Ghost Magpie", meta:"Limited Edition repaint"}
    ]
  }
};
const SECTION_ORDER = ["main","lady","mini","special"];
const BY_ID = {};
SECTION_ORDER.forEach(k=> DATA[k].birds.forEach(b=>{ BY_ID[b.id]=b; }));

/* ===================== STATE ===================== */
const KEY = "bob_public_v1";
let mem = null;
let state = null;

function blankState(){
  return { v:1, birds:{}, seed:0, purchases:[], listings:[], nextLid:1 };
}
function ensureBird(id){
  if(!state.birds[id]) state.birds[id] = { qty:0, acqQty:0, acqCost:0 };
  return state.birds[id];
}
function loadState(){
  // existing saved state for this browser, else start empty
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){ state = JSON.parse(raw); migrate(); return; }
  }catch(e){}
  state = blankState();
  saveState();
}
function migrate(){
  if(!state || typeof state!=="object") state = blankState();
  if(!state.birds) state.birds={};
  if(typeof state.seed!=="number") state.seed=0;
  if(!Array.isArray(state.purchases)) state.purchases=[];
  if(!Array.isArray(state.listings)) state.listings=[];
  if(typeof state.nextLid!=="number") state.nextLid=(state.listings.reduce((m,l)=>Math.max(m,l.lid||0),0)+1);
}
function saveState(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); mem=null; }
  catch(e){ mem = state; }
}
function qtyOf(id){ const b=state.birds[id]; return b? (b.qty||0):0; }
function setQty(id, q){
  q = Math.max(0, q);
  const b = ensureBird(id);
  b.qty = q;
  saveState();
}

/* ===================== MONEY ENGINE (pure-ish) ===================== */
function applyPurchase(ids, lotCost, shipping){
  const n = ids.length;
  if(n===0) return;
  const per = (lotCost + shipping) / n;
  ids.forEach(id=>{
    const b = ensureBird(id);
    b.acqCost = (b.acqCost*b.acqQty + per) / (b.acqQty + 1);
    b.acqQty += 1;
    b.qty += 1;
  });
  state.purchases.push({ date: todayISO(), ids: ids.slice(), lotCost: lotCost, shipping: shipping, per: per });
  saveState();
}
function createListing(id, ask){
  const l = { lid: state.nextLid++, id:id, ask:ask, status:"listed", dateListed: todayISO() };
  state.listings.push(l);
  saveState();
  return l;
}
function updateAsk(lid, ask){
  const l = state.listings.find(x=>x.lid===lid);
  if(l){ l.ask = ask; saveState(); }
}
function cancelListing(lid){
  state.listings = state.listings.filter(x=>x.lid!==lid);
  saveState();
}
function markSold(lid, sale, fee, ship){
  const l = state.listings.find(x=>x.lid===lid);
  if(!l) return;
  l.status = "sold";
  l.sale = sale; l.fee = fee; l.shipPaid = ship;
  l.net = sale - fee - ship;
  l.dateSold = todayISO();
  const b = ensureBird(l.id);
  b.qty = Math.max(0, b.qty - 1);
  saveState();
}
function computeWallet(){
  let spent=0, earned=0;
  state.purchases.forEach(p=> spent += (p.lotCost + p.shipping));
  state.listings.forEach(l=>{ if(l.status==="sold") earned += l.net; });
  return { balance: state.seed - spent + earned, spent: spent, earned: earned };
}
function computeStats(){
  let ownedUnique=0, total=0, doubles=0;
  SECTION_ORDER.forEach(k=> DATA[k].birds.forEach(b=>{
    total++; const q=qtyOf(b.id);
    if(q>0) ownedUnique++;
    if(q>1) doubles += (q-1);
  }));
  let listedCount=0, listedValue=0, feesPaid=0, shipPaid=0, birdsBought=0, birdsSold=0;
  state.listings.forEach(l=>{
    if(l.status==="listed"){ listedCount++; listedValue += l.ask; }
    if(l.status==="sold"){ birdsSold++; feesPaid += l.fee; }
  });
  state.purchases.forEach(p=>{ shipPaid += p.shipping; birdsBought += p.ids.length; });
  const w = computeWallet();
  const avgCost = birdsBought ? (w.spent / birdsBought) : 0;
  return { ownedUnique, total, needed: total-ownedUnique, doubles,
    listedCount, listedValue, feesPaid, shipPaid, birdsBought, birdsSold,
    spent: w.spent, earned: w.earned, wallet: w.balance, seed: state.seed, avgCost };
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function money(n){ const v=Math.round((n+Number.EPSILON)*100)/100; return "$"+v.toFixed(2); }
function searchTerms(b){
  const year = (b.meta.match(/\b(20\d{2})\b/) || [])[1] || "";
  const term = b.name.replace(/\(mini\)/i, "miniature");
  return { term: term, year: year };
}
function lookupURL(b){
  const t = searchTerms(b);
  const q = 'Hallmark "Beauty of Birds" ' + t.term + (t.year ? " " + t.year : "");
  return "https://www.google.com/search?q=" + encodeURIComponent(q);
}
function ebayURL(b){
  const t = searchTerms(b);
  const q = "Hallmark Beauty of Birds " + t.term + (t.year ? " " + t.year : "");
  // active listings (currently for sale) — what's available to buy
  return "https://www.ebay.com/sch/i.html?_nkw=" + encodeURIComponent(q);
}
function escAttr(s){ return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ===================== RENDER: COLLECTION ===================== */
const vCollection = document.getElementById("view-collection");
function renderCollection(){
  vCollection.innerHTML = "";
  SECTION_ORDER.forEach(key=>{
    const sec = DATA[key];
    const el = document.createElement("section");
    el.className = "section";
    const owned = sec.birds.filter(b=>qtyOf(b.id)>0).length;
    const head = document.createElement("button");
    head.className = "shead";
    head.innerHTML = '<span class="stitle">'+sec.title+'</span><span class="scount">'+owned+'/'+sec.birds.length+'</span><span class="chev">▼</span>';
    head.addEventListener("click", ()=> el.classList.toggle("collapsed"));
    el.appendChild(head);
    const note = document.createElement("div");
    note.className = "snote" + (sec.warn?" warn":"");
    note.textContent = sec.note;
    el.appendChild(note);
    const rows = document.createElement("div");
    rows.className = "rows";
    sec.birds.forEach(b=>{
      const q = qtyOf(b.id);
      const row = document.createElement("div");
      row.className = "row" + (q>0?" owned":"");
      const check = document.createElement("div");
      check.className = "check";
      check.innerHTML = q>0 ? "✓" : "";
      check.addEventListener("click", ()=>{ setQty(b.id, q>0?0:1); renderAll(); });
      const info = document.createElement("div");
      info.className = "rinfo";
      const dbl = q>1 ? ' <span class="dbl">'+(q-1)+' double'+(q-1>1?'s':'')+'</span>' : '';
      const bd = state.birds[b.id];
      const costLine = (bd && bd.acqQty>0) ? '<div class="rcost">paid avg '+money(bd.acqCost)+'</div>' : '';
      info.innerHTML = '<a class="rname" href="'+escAttr(lookupURL(b))+'" target="_blank" rel="noopener">'+escHtml(b.name)+'<span class="ext">↗</span></a>'+
        '<a class="ebaylink" href="'+escAttr(ebayURL(b))+'" target="_blank" rel="noopener">eBay ↗</a>'+
        dbl+'<div class="rmeta">'+escHtml(b.meta)+'</div>'+costLine;
      const step = document.createElement("div");
      step.className = "stepper";
      const minus = document.createElement("div");
      minus.className = "stepbtn" + (q<=0?" dim":"");
      minus.textContent = "−";
      minus.addEventListener("click", ()=>{ setQty(b.id, qtyOf(b.id)-1); renderAll(); });
      const num = document.createElement("div");
      num.className = "qty" + (q<=0?" zero":"");
      num.textContent = q;
      const plus = document.createElement("div");
      plus.className = "stepbtn"; plus.textContent = "+";
      plus.addEventListener("click", ()=>{ setQty(b.id, qtyOf(b.id)+1); renderAll(); });
      step.appendChild(minus); step.appendChild(num); step.appendChild(plus);
      row.appendChild(check); row.appendChild(info); row.appendChild(step);
      rows.appendChild(row);
    });
    el.appendChild(rows);
    vCollection.appendChild(el);
  });
}

/* ===================== RENDER: MONEY ===================== */
const vMoney = document.getElementById("view-money");
function renderMoney(){
  const s = computeStats();
  const selfFunding = s.earned >= s.spent;
  const afloat = s.wallet >= 0;
  let html = "";

  html += '<div class="wallet">';
  html += '<button class="wedit" id="editSeed">seed '+money(s.seed)+'</button>';
  html += '<div class="wlabel">Wallet</div>';
  html += '<div class="wbig">'+money(s.wallet)+'</div>';
  html += '<div class="wline">Earned '+money(s.earned)+' · spent '+money(s.spent)+'</div>';
  if(s.seed===0 && s.spent===0 && s.earned===0){
    html += '<div class="wstatus ok">Set your seed money to start</div>';
  } else if(afloat && selfFunding){
    html += '<div class="wstatus ok">Self-funding · sales cover buying</div>';
  } else if(afloat){
    html += '<div class="wstatus ok">Afloat · '+money(s.seed - s.wallet)+' of seed used</div>';
  } else {
    html += '<div class="wstatus low">Over budget by '+money(-s.wallet)+'</div>';
  }
  html += '</div>';

  html += '<div class="mbtns">';
  html += '<div class="mbtn" id="btnBuy"><div class="mi">🛒</div><div class="ml">Log a purchase</div></div>';
  html += '<div class="mbtn" id="btnList"><div class="mi">🏷️</div><div class="ml">List a double</div></div>';
  html += '</div>';

  html += '<div class="statgrid">';
  html += stat(s.ownedUnique+" / "+s.total, "Collection");
  html += stat(String(s.needed), "Still needed");
  html += stat(String(s.doubles), "Doubles on hand");
  html += stat(s.listedCount+" · "+money(s.listedValue), "Listed now");
  html += stat(money(s.shipPaid), "Shipping paid");
  html += stat(money(s.feesPaid), "eBay fees paid");
  html += stat(s.birdsBought+" / "+s.birdsSold, "Bought / sold");
  html += stat(money(s.avgCost), "Avg cost / bird");
  html += '</div>';

  // active listings
  const active = state.listings.filter(l=>l.status==="listed");
  html += '<div class="block"><div class="bhead">Listed on eBay <span class="bcount">'+active.length+'</span></div>';
  if(active.length===0){
    html += '<div class="empty">Nothing listed. Tap "List a double" when you post one.</div>';
  } else {
    active.forEach(l=>{
      const b = BY_ID[l.id] || {name:l.id, meta:""};
      html += '<div class="litem"><div class="ln"><div class="lname">'+escHtml(b.name)+'</div><div class="lmeta">listed '+l.dateListed+'</div></div>'+
        '<div class="lask">'+money(l.ask)+'</div>'+
        '<button class="pill edit" data-ask="'+l.lid+'">edit</button>'+
        '<button class="pill sell" data-sold="'+l.lid+'">sold</button></div>';
    });
  }
  html += '</div>';

  // recent activity
  const log = buildLog();
  html += '<div class="block"><div class="bhead">Recent activity <span class="bcount">'+log.length+'</span></div>';
  if(log.length===0){
    html += '<div class="empty">Purchases and sales show up here.</div>';
  } else {
    log.slice(0,20).forEach(e=>{
      html += '<div class="logrow"><div><div>'+escHtml(e.label)+'</div><div class="lgt">'+e.date+'</div></div><div class="'+(e.amt>=0?'amt-pos':'amt-neg')+'">'+(e.amt>=0?'+':'')+money(e.amt)+'</div></div>';
    });
  }
  html += '</div>';

  html += '<div class="mbtns"><div class="mbtn" id="btnBackup"><div class="mi">💾</div><div class="ml">Backup</div></div>'+
          '<div class="mbtn" id="btnShare"><div class="mi">📤</div><div class="ml">Share my list</div></div></div>';

  vMoney.innerHTML = html;

  // wire
  document.getElementById("editSeed").onclick = openSeed;
  document.getElementById("btnBuy").onclick = openBuy;
  document.getElementById("btnList").onclick = openList;
  document.getElementById("btnBackup").onclick = openBackup;
  document.getElementById("btnShare").onclick = openShare;
  vMoney.querySelectorAll("[data-sold]").forEach(btn=> btn.onclick=()=>openSold(parseInt(btn.getAttribute("data-sold"),10)));
  vMoney.querySelectorAll("[data-ask]").forEach(btn=> btn.onclick=()=>openEditAsk(parseInt(btn.getAttribute("data-ask"),10)));
}
function stat(v,l){ return '<div class="stat"><div class="sv">'+v+'</div><div class="sl">'+l+'</div></div>'; }
function buildLog(){
  const out=[];
  state.purchases.forEach(p=>{
    const names = p.ids.map(id=> (BY_ID[id]||{name:id}).name);
    const label = "Bought "+p.ids.length+" ("+names.slice(0,2).join(", ")+(names.length>2?"…":"")+")";
    out.push({ date:p.date, label:label, amt: -(p.lotCost+p.shipping) });
  });
  state.listings.forEach(l=>{ if(l.status==="sold"){
    const b=BY_ID[l.id]||{name:l.id};
    out.push({ date:l.dateSold, label:"Sold "+b.name, amt: l.net });
  }});
  out.sort((a,b)=> a.date<b.date?1:-1);
  return out;
}

/* ===================== PROGRESS HEADER ===================== */
function renderHeader(){
  const onMoney = document.getElementById("view-money").classList.contains("active");
  const s = computeStats();
  document.getElementById("hSub").textContent = onMoney
    ? "Log buys and sales. Wallet stays self-sustaining when sales cover your buying."
    : "Your Hallmark Beauty of Birds collection. Tap a bird's name to look it up.";
  document.getElementById("ownedCount").textContent = s.ownedUnique;
  document.getElementById("dblCount").textContent = s.doubles;
  document.getElementById("ofTotal").textContent = "of " + s.total;
  document.getElementById("barFill").style.width = s.total? (s.ownedUnique/s.total*100)+"%" : "0%";
}

function renderAll(){ renderCollection(); renderMoney(); renderHeader(); }

/* ===================== MODALS ===================== */
const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");
function openSheet(html){ sheet.innerHTML = html; modal.classList.add("open"); }
function closeSheet(){ modal.classList.remove("open"); }
modal.addEventListener("click", e=>{ if(e.target===modal) closeSheet(); });

function numVal(id){ const el=document.getElementById(id); const n=parseFloat(el.value); return isNaN(n)?0:n; }

function openSeed(){
  openSheet(
    '<h2>Seed money</h2><p>The cash you are putting in to start. Sales add to it, purchases pull from it.</p>'+
    '<label class="fl">Amount in the wallet</label>'+
    '<input class="fi money-in" id="seedIn" type="number" inputmode="decimal" step="0.01" value="'+(state.seed||"")+'" placeholder="0.00">'+
    '<div class="sheetbtns"><button class="btn primary" id="saveSeed">Save</button><button class="btn ghost" id="cancel">Cancel</button></div>'
  );
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("saveSeed").onclick=()=>{ state.seed = numVal("seedIn"); saveState(); closeSheet(); renderAll(); toast("Seed set to "+money(state.seed)); };
}

let buyPick = {};
function openBuy(){
  buyPick = {};
  let rows = "";
  SECTION_ORDER.forEach(k=> DATA[k].birds.forEach(b=>{
    rows += '<div class="pk" data-id="'+b.id+'"><div class="pkc"></div><div class="pkn">'+escHtml(b.name)+'</div><div class="pkt">'+escHtml(b.meta.split(" · ")[0])+'</div></div>';
  }));
  openSheet(
    '<h2>Log a purchase</h2><p>Pick every bird in the lot, then enter what you paid. The cost plus shipping splits evenly across them.</p>'+
    '<input class="fi" id="buySearch" placeholder="Search birds…" style="margin-bottom:8px">'+
    '<div class="picker" id="buyPicker">'+rows+'</div>'+
    '<label class="fl">Lot price ($)</label><input class="fi money-in" id="buyCost" type="number" inputmode="decimal" step="0.01" placeholder="0.00">'+
    '<label class="fl">Shipping you paid ($)</label><input class="fi money-in" id="buyShip" type="number" inputmode="decimal" step="0.01" placeholder="0.00">'+
    '<div class="calc" id="buyCalc">0 birds selected</div>'+
    '<div class="sheetbtns"><button class="btn primary" id="saveBuy">Add to collection</button><button class="btn ghost" id="cancel">Cancel</button></div>'
  );
  document.getElementById("cancel").onclick=closeSheet;
  const picker = document.getElementById("buyPicker");
  picker.querySelectorAll(".pk").forEach(pk=>{
    pk.onclick=()=>{ const id=pk.getAttribute("data-id"); if(buyPick[id]){delete buyPick[id]; pk.classList.remove("sel"); pk.querySelector(".pkc").textContent="";} else {buyPick[id]=1; pk.classList.add("sel"); pk.querySelector(".pkc").textContent="✓";} updateBuyCalc(); };
  });
  document.getElementById("buySearch").oninput=(e)=>{ const q=e.target.value.toLowerCase(); picker.querySelectorAll(".pk").forEach(pk=>{ pk.style.display = pk.querySelector(".pkn").textContent.toLowerCase().includes(q)?"":"none"; }); };
  document.getElementById("buyCost").oninput=updateBuyCalc;
  document.getElementById("buyShip").oninput=updateBuyCalc;
  document.getElementById("saveBuy").onclick=()=>{
    const ids = Object.keys(buyPick);
    if(ids.length===0){ toast("Pick at least one bird"); return; }
    applyPurchase(ids, numVal("buyCost"), numVal("buyShip"));
    closeSheet(); renderAll(); toast("Logged "+ids.length+" bird"+(ids.length>1?"s":""));
  };
}
function updateBuyCalc(){
  const n = Object.keys(buyPick).length;
  const total = numVal("buyCost")+numVal("buyShip");
  const per = n? total/n : 0;
  document.getElementById("buyCalc").textContent = n+" bird"+(n!==1?"s":"")+" · "+money(per)+" each";
}

function openList(){
  // only birds currently owned
  let rows="";
  SECTION_ORDER.forEach(k=> DATA[k].birds.forEach(b=>{
    const q=qtyOf(b.id); if(q>0){
      const extra = q>1 ? ' <span class="pkt">('+(q-1)+' spare)</span>' : '';
      rows += '<div class="pk" data-id="'+b.id+'"><div class="pkc"></div><div class="pkn">'+escHtml(b.name)+extra+'</div></div>';
    }
  }));
  let chosen=null;
  openSheet(
    '<h2>List a double</h2><p>Pick the bird you are posting and your asking price. It stays owned until you mark it sold.</p>'+
    '<input class="fi" id="listSearch" placeholder="Search your birds…" style="margin-bottom:8px">'+
    '<div class="picker" id="listPicker">'+rows+'</div>'+
    '<label class="fl">Asking price ($)</label><input class="fi money-in" id="listAsk" type="number" inputmode="decimal" step="0.01" placeholder="0.00">'+
    '<div class="sheetbtns"><button class="btn primary" id="saveList">List it</button><button class="btn ghost" id="cancel">Cancel</button></div>'
  );
  document.getElementById("cancel").onclick=closeSheet;
  const picker=document.getElementById("listPicker");
  picker.querySelectorAll(".pk").forEach(pk=>{
    pk.onclick=()=>{ picker.querySelectorAll(".pk").forEach(x=>{x.classList.remove("sel"); x.querySelector(".pkc").textContent="";}); pk.classList.add("sel"); pk.querySelector(".pkc").textContent="✓"; chosen=pk.getAttribute("data-id"); };
  });
  document.getElementById("listSearch").oninput=(e)=>{ const q=e.target.value.toLowerCase(); picker.querySelectorAll(".pk").forEach(pk=>{ pk.style.display=pk.querySelector(".pkn").textContent.toLowerCase().includes(q)?"":"none"; }); };
  document.getElementById("saveList").onclick=()=>{
    if(!chosen){ toast("Pick a bird"); return; }
    createListing(chosen, numVal("listAsk"));
    closeSheet(); renderAll(); toast("Listed");
  };
}

function openEditAsk(lid){
  const l = state.listings.find(x=>x.lid===lid); if(!l) return;
  const b = BY_ID[l.id]||{name:l.id};
  openSheet(
    '<h2>Adjust price</h2><p>'+escHtml(b.name)+'</p>'+
    '<label class="fl">New asking price ($)</label><input class="fi money-in" id="newAsk" type="number" inputmode="decimal" step="0.01" value="'+l.ask+'">'+
    '<div class="sheetbtns"><button class="btn primary" id="saveAsk">Save</button><button class="btn ghost" id="cancel">Cancel</button></div>'+
    '<div class="sheetbtns"><button class="btn danger" id="cancelList">Remove listing</button></div>'
  );
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("saveAsk").onclick=()=>{ updateAsk(lid, numVal("newAsk")); closeSheet(); renderAll(); toast("Price updated"); };
  document.getElementById("cancelList").onclick=()=>{ cancelListing(lid); closeSheet(); renderAll(); toast("Listing removed"); };
}

function openSold(lid){
  const l = state.listings.find(x=>x.lid===lid); if(!l) return;
  const b = BY_ID[l.id]||{name:l.id};
  openSheet(
    '<h2>Mark sold</h2><p>'+escHtml(b.name)+' — what actually happened. Net lands in your wallet.</p>'+
    '<label class="fl">Sold for ($)</label><input class="fi money-in" id="soldPrice" type="number" inputmode="decimal" step="0.01" value="'+l.ask+'">'+
    '<label class="fl">eBay fee ($)</label><input class="fi money-in" id="soldFee" type="number" inputmode="decimal" step="0.01" placeholder="0.00">'+
    '<label class="fl">Shipping you paid ($)</label><input class="fi money-in" id="soldShip" type="number" inputmode="decimal" step="0.01" placeholder="0.00">'+
    '<div class="calc" id="soldCalc">Net to wallet: '+money(l.ask)+'</div>'+
    '<div class="sheetbtns"><button class="btn primary" id="saveSold">Record sale</button><button class="btn ghost" id="cancel">Cancel</button></div>'
  );
  document.getElementById("cancel").onclick=closeSheet;
  const recalc=()=>{ const net=numVal("soldPrice")-numVal("soldFee")-numVal("soldShip"); document.getElementById("soldCalc").textContent="Net to wallet: "+money(net); };
  ["soldPrice","soldFee","soldShip"].forEach(id=> document.getElementById(id).oninput=recalc);
  document.getElementById("saveSold").onclick=()=>{ markSold(lid, numVal("soldPrice"), numVal("soldFee"), numVal("soldShip")); closeSheet(); renderAll(); toast("Sale recorded"); };
}

function openBackup(){
  let raw="{}"; try{ raw=JSON.stringify(state); }catch(e){}
  openSheet(
    '<h2>Backup &amp; restore</h2><p>Copy this and keep it safe. To restore on a new phone, paste it in and tap Restore.</p>'+
    '<textarea class="fi" id="backupText">'+escHtml(raw)+'</textarea>'+
    '<div class="sheetbtns"><button class="btn primary" id="copyBackup">Copy</button><button class="btn ghost" id="restoreBackup">Restore</button></div>'+
    '<div class="sheetbtns"><button class="btn ghost" id="cancel">Close</button></div>'
  );
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("copyBackup").onclick=()=>{ const t=document.getElementById("backupText"); t.select(); t.setSelectionRange(0,999999); let ok=false; try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value); ok=true;} }catch(e){} if(!ok){try{ok=document.execCommand("copy");}catch(e){}} toast(ok?"Copied":"Select and copy"); };
  document.getElementById("restoreBackup").onclick=()=>{
    try{ const obj=JSON.parse(document.getElementById("backupText").value); state=obj; migrate(); saveState(); closeSheet(); renderAll(); toast("Restored"); }
    catch(e){ toast("That text isn't valid backup data"); }
  };
}

function openShare(){
  // ownership snapshot only (checklist marks, no money)
  const own={}; SECTION_ORDER.forEach(k=>DATA[k].birds.forEach(b=>{ const q=qtyOf(b.id); if(q>0) own[b.id]=q; }));
  let link="";
  try{ link = location.href.split("#")[0] + "#c=" + encodeURIComponent(btoa(JSON.stringify(own))); }catch(e){ link=""; }
  const hosted = location.protocol==="https:" || location.protocol==="http:";
  openSheet(
    '<h2>Share my list</h2><p>'+(hosted
      ? 'Copy this link and send it to anyone. When they open it, their checklist updates to match yours (checkmarks only, no money).'
      : 'This makes a share link, but it only works once the app is on a web address. Opened as a downloaded file it will not. Use Backup instead.')+'</p>'+
    '<textarea class="fi" id="shareText">'+escHtml(link)+'</textarea>'+
    '<div class="sheetbtns"><button class="btn primary" id="copyShare">Copy link</button><button class="btn ghost" id="cancel">Close</button></div>'
  );
  document.getElementById("cancel").onclick=closeSheet;
  document.getElementById("copyShare").onclick=()=>{ const t=document.getElementById("shareText"); t.select(); t.setSelectionRange(0,999999); let ok=false; try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value); ok=true;} }catch(e){} if(!ok){try{ok=document.execCommand("copy");}catch(e){}} toast(ok?"Link copied":"Select and copy"); };
}

function applyIncomingSync(){
  if(!location.hash || location.hash.indexOf("#c=")!==0) return;
  try{
    const map = JSON.parse(atob(decodeURIComponent(location.hash.slice(3))));
    const n = Object.keys(map).length;
    openSheet(
      '<h2>Update your checklist?</h2><p>This link marks '+n+' birds as owned, matching the person who sent it. Your current marks will be replaced.</p>'+
      '<div class="sheetbtns"><button class="btn primary" id="applySync">Yes, update</button><button class="btn ghost" id="cancel">Keep mine</button></div>'
    );
    document.getElementById("cancel").onclick=()=>{ closeSheet(); history.replaceState(null,"",location.pathname+location.search); };
    document.getElementById("applySync").onclick=()=>{
      SECTION_ORDER.forEach(k=>DATA[k].birds.forEach(b=>{ ensureBird(b.id).qty = map[b.id]||0; }));
      saveState(); history.replaceState(null,"",location.pathname+location.search); closeSheet(); renderAll(); toast("Checklist updated");
    };
  }catch(e){}
}

/* ===================== NAV + BOOT ===================== */
function switchView(which){
  document.getElementById("view-collection").classList.toggle("active", which==="collection");
  document.getElementById("view-money").classList.toggle("active", which==="money");
  document.getElementById("nav-collection").classList.toggle("active", which==="collection");
  document.getElementById("nav-money").classList.toggle("active", which==="money");
  document.getElementById("hProg").style.display = which==="collection" ? "flex" : "none";
  document.getElementById("hBar").style.display = which==="collection" ? "block" : "none";
  renderHeader();
  window.scrollTo(0,0);
}
document.getElementById("nav-collection").onclick=()=>switchView("collection");
document.getElementById("nav-money").onclick=()=>switchView("money");

let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1700); }
document.getElementById("verBtn").onclick=()=>toast("Rookery v1.3 · Beauty of Birds tracker · Nov 8 2026");
