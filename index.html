<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Mot Buchanan</title>
<meta name="description" content="Mot Buchanan. Building something. Break some bricks while you wait.">
<style>
:root{--ink:#ebedef;--soft:#c7ccd4;--teal:#4cf0e0;--orange:#f59847;--line:#494d55}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{height:100%}
body{background:#0b0f14;color:var(--ink);font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;-webkit-font-smoothing:antialiased;
  min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom));overflow:hidden}

.top{width:100%;max-width:540px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px}
.brand{display:flex;flex-direction:column;gap:3px}
.brand .wm{width:128px;height:auto;display:block}
.brand .sub{color:var(--orange);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.hud{display:flex;align-items:center;gap:14px;font-size:11px;color:var(--soft)}
.hud .v{color:var(--teal);font-weight:700}
.hud .best .v{color:var(--orange)}
.hud .combo{color:var(--orange);font-weight:800;min-width:26px;text-align:right}
.mute{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--soft);border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}
.mute.on{color:var(--teal);border-color:rgba(76,240,224,.5)}

.stagewrap{position:relative;width:100%;max-width:540px;flex:1;min-height:0;display:flex}
.stage{position:relative;width:100%;border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.55)}
canvas{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(8,11,15,.66);backdrop-filter:blur(3px);text-align:center;padding:26px}
.overlay.hide{display:none}
.overlay h2{font-family:'Archivo',sans-serif;font-size:clamp(21px,6.5vw,32px);font-weight:800}
.overlay p{color:var(--soft);font-size:13px;line-height:1.55;max-width:32ch}
.overlay .big{color:var(--teal);font-size:15px}
.overlay .big b{font-size:26px}
.btn{margin-top:2px;border:1px solid rgba(76,240,224,.5);background:rgba(76,240,224,.12);color:var(--teal);
  font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:14px 30px;border-radius:12px;cursor:pointer}
.btn:active{background:rgba(76,240,224,.22)}

.foot{width:100%;max-width:540px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;color:var(--soft);font-size:10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;opacity:.85}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.foot a{color:var(--soft);text-decoration:none;border-bottom:1px solid rgba(76,240,224,.35)}
.fr{display:flex;align-items:center;gap:12px;flex-shrink:0}
.vb{border:1px solid rgba(76,240,224,.4);background:rgba(76,240,224,.08);color:var(--teal);font-family:inherit;font-size:10px;letter-spacing:.04em;padding:4px 8px;border-radius:7px;cursor:pointer}
.vb:active{background:rgba(76,240,224,.18)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:rgba(8,11,15,.92);border:1px solid rgba(76,240,224,.4);color:var(--teal);font-size:11px;letter-spacing:.03em;padding:8px 14px;border-radius:9px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script>
(function(){
var stage=document.getElementById('stage'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),bestEl=document.getElementById('best');
var ov=document.getElementById('ov'),ovTitle=document.getElementById('ovTitle'),ovMsg=document.getElementById('ovMsg'),ovScore=document.getElementById('ovScore'),ovBtn=document.getElementById('ovBtn'),muteBtn=document.getElementById('mute');
var BEST_KEY='mb_break_best_v2';
var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

var W=0,H=0,DPR=1,R=7;
var HUE={1:172,2:150,3:32}; // teal->green->orange by hardness
var bgCan=document.createElement('canvas'),bgx=bgCan.getContext('2d');
var brickSprite={}, ballGlow=document.createElement('canvas');

var pad,balls,bricks,parts,shards,drops,pops,flashes,bolts,score,lives,combo,comboTimer,shake,flashScreen,slowUntil,expandUntil,catchUntil,laserUntil,laserCd,state,best,LITE=false;
try{best=+localStorage.getItem(BEST_KEY)||0;}catch(e){}
bestEl.textContent=best||0;

/* ---------- sizing + pre-rendered sprites (drawn once, not per frame) ---------- */
function size(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  var r=stage.getBoundingClientRect(); W=Math.max(200,r.width); H=Math.max(260,r.height);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); ctx.setTransform(DPR,0,0,DPR,0,0);
  R=Math.max(6,W*0.016);
  renderBg(); renderBallGlow();
}
function rr(c,x,y,w,h,rad){rad=Math.min(rad,w/2,h/2);c.beginPath();c.moveTo(x+rad,y);c.arcTo(x+w,y,x+w,y+h,rad);c.arcTo(x+w,y+h,x,y+h,rad);c.arcTo(x,y+h,x,y,rad);c.arcTo(x,y,x+w,y,rad);c.closePath();}
function renderBg(){
  bgCan.width=Math.round(W*DPR); bgCan.height=Math.round(H*DPR); bgx.setTransform(DPR,0,0,DPR,0,0);
  var g=bgx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#16202c');g.addColorStop(.4,'#111a24');g.addColorStop(.75,'#0d151d');g.addColorStop(1,'#0a1017');
  bgx.fillStyle=g; bgx.fillRect(0,0,W,H);
  // your key+rim signature, warm top-left + teal rim
  var k=bgx.createRadialGradient(W*0.04,-H*0.05,10,W*0.04,-H*0.05,H*0.9);
  k.addColorStop(0,'rgba(255,228,196,.16)');k.addColorStop(1,'rgba(255,228,196,0)');
  bgx.fillStyle=k; bgx.fillRect(0,0,W,H);
  bgx.fillStyle='rgba(76,240,224,.05)'; bgx.fillRect(0,0,W*0.05,H);
  // faint grid
  bgx.strokeStyle='rgba(130,165,215,.05)';bgx.lineWidth=1;
  for(var gx=24;gx<W;gx+=30){bgx.beginPath();bgx.moveTo(gx,0);bgx.lineTo(gx,H);bgx.stroke();}
  for(var gy=24;gy<H;gy+=30){bgx.beginPath();bgx.moveTo(0,gy);bgx.lineTo(W,gy);bgx.stroke();}
  // starfield baked in
  for(var i=0;i<40;i++){bgx.globalAlpha=Math.random()*0.4+0.12;bgx.fillStyle='#cfe0f5';bgx.beginPath();bgx.arc(Math.random()*W,Math.random()*H*0.7,Math.random()*1.1+0.3,0,7);bgx.fill();}
  bgx.globalAlpha=1;
  // floor teal glow + vignette
  var fg=bgx.createLinearGradient(0,H-80,0,H);fg.addColorStop(0,'rgba(76,240,224,0)');fg.addColorStop(1,'rgba(76,240,224,.10)');
  bgx.fillStyle=fg;bgx.fillRect(0,H-80,W,80);
  var v=bgx.createRadialGradient(W/2,H*0.42,H*0.2,W/2,H*0.5,H*0.78);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.5)');
  bgx.fillStyle=v;bgx.fillRect(0,0,W,H);
}

var AC=null,muted=false;
function actx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function beep(freq,dur,type,vol){if(muted)return;var a=actx();if(!a)return;var o=a.createOscillator(),g=a.createGain();o.type=type||'square';o.frequency.value=freq;g.gain.value=0;o.connect(g);g.connect(a.destination);var t=a.currentTime;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime((vol||0.15),t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.start(t);o.stop(t+dur+0.02);}
function sfx(kind,arg){
  if(kind==='wall')beep(220,0.05,'square',0.05);
  else if(kind==='pad')beep(160,0.07,'triangle',0.12);
  else if(kind==='brick')beep(320+Math.min(arg||0,10)*40,0.06,'square',0.10);
  else if(kind==='break')beep(520+Math.min(arg||0,12)*45,0.10,'sawtooth',0.10);
  else if(kind==='power')beep(660,0.12,'sine',0.16),beep(990,0.14,'sine',0.10);
  else if(kind==='laser')beep(880,0.05,'sawtooth',0.08);
  else if(kind==='lose')beep(140,0.3,'sawtooth',0.16),beep(90,0.4,'square',0.12);
}
function buzz(ms){if(!reduce&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}}

/* ---------- game ---------- */
function layout(){pad={x:W/2-W*0.11,y:H-24,w:W*0.22,h:12,base:W*0.22};}
function makeBricks(){
  bricks=[];var cols=Math.max(6,Math.round(W/64)),rows=5,mx=W*0.045,gap=W*0.014;
  var bw=(W-mx*2-gap*(cols-1))/cols,bh=Math.max(14,H*0.03),top=H*0.10;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){var hp=r===0?3:r<2?2:1;bricks.push({x:mx+c*(bw+gap),y:top+r*(bh+gap),w:bw,h:bh,hp:hp,drop:Math.random()<0.15});}
}
function newBall(vx,vy){return {x:pad?pad.x+pad.w/2:W/2,y:H-40,vx:vx||0,vy:vy||0,stuck:vx===undefined,trail:[],sq:0};}
function reset(full){
  layout();makeBricks();balls=[newBall()];parts=[];shards=[];drops=[];pops=[];flashes=[];bolts=[];
  if(full){score=0;lives=3;}
  combo=0;comboTimer=0;shake=0;flashScreen=0;slowUntil=0;expandUntil=0;catchUntil=0;laserUntil=0;laserCd=0;hitstop=0;
  scoreEl.textContent=score;comboEl.textContent='';state='ready';
}
function start(){reset(true);state='ready';ov.classList.add('hide');launch();}
function launch(){if(state==='ready'){balls.forEach(function(b){if(b.stuck){b.stuck=false;var a=(-Math.PI/2)+(Math.random()*0.5-0.25),sp=Math.max(4,W*0.012);b.vx=Math.cos(a)*sp;b.vy=Math.sin(a)*sp;}});state='play';}}
function spawnParts(x,y,hue,n){for(var i=0;i<n;i++){if(parts.length>=(LITE?90:220))break;var a=Math.random()*6.28,s=1+Math.random()*3;parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:1,hue:hue,sz:1+Math.random()*2.4});}}
function spawnShards(x,y,hue){var n=LITE?4:7;for(var i=0;i<n;i++){if(shards.length>=(LITE?40:90))break;var a=Math.random()*6.28,s=1.5+Math.random()*3.5;shards.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.4,life:1,hue:hue,sz:3+Math.random()*4});}}
function pop(x,y,t){if(pops.length<22)pops.push({x:x,y:y,t:t,life:1});}
function flash(x,y,hue){if(flashes.length<24)flashes.push({x:x,y:y,r:5,life:1,hue:hue});}
function applyPower(type){
  sfx('power');buzz(20);flash(pad.x+pad.w/2,pad.y,180);
  if(type==='expand'){expandUntil=Date.now()+9000;pop(pad.x+pad.w/2,pad.y-12,'WIDE');}
  else if(type==='slow'){slowUntil=Date.now()+6000;pop(pad.x+pad.w/2,pad.y-12,'SLOW');}
  else if(type==='catch'){catchUntil=Date.now()+9000;pop(pad.x+pad.w/2,pad.y-12,'CATCH');}
  else if(type==='laser'){laserUntil=Date.now()+8000;pop(pad.x+pad.w/2,pad.y-12,'LASER');}
  else if(type==='life'){lives++;pop(pad.x+pad.w/2,pad.y-12,'+LIFE');}
  else if(type==='multi'){var add=[];for(var mi=0;mi<balls.length;mi++){if(balls.length+add.length<6){var mb=balls[mi],msp=Math.hypot(mb.vx,mb.vy)||4;var nb=newBall(-mb.vx||msp,-Math.abs(mb.vy)||-msp);nb.stuck=false;add.push(nb);}}balls=balls.concat(add);pop(W/2,H/2,'MULTIBALL');}
}
var PWR={expand:'#f59847',slow:'#8a6be0',catch:'#7CFC9A',laser:'#ff5a6e',life:'#ffd54a',multi:'#4cf0e0'};
var hitstop=0;

function hitBrick(ball,b,i){
  var ox=Math.min(ball.x+R-b.x,b.x+b.w-(ball.x-R)),oy=Math.min(ball.y+R-b.y,b.y+b.h-(ball.y-R));
  if(ox<oy)ball.vx=-ball.vx;else ball.vy=-ball.vy; ball.sq=1;
  b.hp--; var hue=HUE[Math.max(1,b.hp+1)]||32;
  if(b.hp<=0){
    spawnParts(b.x+b.w/2,b.y+b.h/2,hue,14);spawnShards(b.x+b.w/2,b.y+b.h/2,hue);flash(b.x+b.w/2,b.y+b.h/2,hue);
    combo++;comboTimer=90;var pts=10*Math.max(1,combo);score+=pts;scoreEl.textContent=score;
    if(combo>1){comboEl.textContent='x'+combo;if(combo>=3){flashScreen=0.5;}}
    pop(b.x+b.w/2,b.y,'+'+pts);
    if(b.drop){var types=['expand','multi','slow','catch','laser','life'];drops.push({x:b.x+b.w/2,y:b.y,type:types[Math.floor(Math.random()*types.length)]});}
    bricks.splice(i,1); shake=Math.min(9,5+combo*0.4); hitstop=combo>=3?3:2; sfx('break',combo); buzz(combo>=3?24:12);
    if(bricks.length===0){nextLevel();}
  } else { spawnParts(ball.x,ball.y,hue,5); shake=3; sfx('brick',combo); }
}
function nextLevel(){var keepScore=score,keepLives=lives;pop(W/2,H/2,'CLEARED');setTimeout(function(){},0);layout();makeBricks();balls=[newBall()];state='ready';score=keepScore;lives=keepLives;flashScreen=0.7;setTimeout(launch,250);}
function loseBall(){
  lives--;combo=0;comboEl.textContent='';shake=8;flashScreen=0.6;sfx('lose');buzz([40,40,60]);
  if(lives<=0){state='over';if(score>best){best=score;try{localStorage.setItem(BEST_KEY,best);}catch(e){}}bestEl.textContent=best;
    ovTitle.textContent=(score>=best&&score>0)?'New best':'Ball dropped';
    ovMsg.textContent='Public leaderboard drops with the site. Your best will hold a spot for the next visitor to chase.';
    ovScore.style.display='block';ovScore.innerHTML='you got <b>'+score+'</b> · best <b style="color:#f59847">'+best+'</b>';
    ovBtn.textContent='Play again';ov.classList.remove('hide');
  } else {balls=[newBall()];state='ready';setTimeout(launch,120);}
}

function step(k){
  var slow=Date.now()<slowUntil?0.6:1;
  pad.w=Date.now()<expandUntil?W*0.32:pad.base; pad.x=Math.max(0,Math.min(W-pad.w,pad.x));
  shake*=Math.pow(0.85,k); flashScreen*=Math.pow(0.86,k);
  if(comboTimer>0){comboTimer-=k;if(comboTimer<=0){combo=0;comboEl.textContent='';}}
  // particles
  for(var i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=0.14*k;p.vx*=Math.pow(0.99,k);p.life-=0.028*k;if(p.life<=0)parts.splice(i,1);}
  for(i=shards.length-1;i>=0;i--){var sh=shards[i];sh.x+=sh.vx*k;sh.y+=sh.vy*k;sh.vy+=0.22*k;sh.rot+=sh.vr*k;sh.life-=0.02*k;if(sh.life<=0)shards.splice(i,1);}
  for(i=flashes.length-1;i>=0;i--){var f=flashes[i];f.r+=3.4*k;f.life-=0.07*k;if(f.life<=0)flashes.splice(i,1);}
  for(i=pops.length-1;i>=0;i--){var q=pops[i];q.y-=0.6*k;q.life-=0.02*k;if(q.life<=0)pops.splice(i,1);}
  for(i=bolts.length-1;i>=0;i--){var bo=bolts[i];bo.y-=9*k;
    for(var bj=0;bj<bricks.length;bj++){var bb=bricks[bj];if(bo.x>bb.x&&bo.x<bb.x+bb.w&&bo.y<bb.y+bb.h&&bo.y>bb.y){hitBrick({x:bo.x,y:bb.y+bb.h,vx:0,vy:-1,sq:0},bb,bj);bolts.splice(i,1);break;}}
    if(bolts[i]&&bo.y<0)bolts.splice(i,1);
  }
  for(i=drops.length-1;i>=0;i--){var dp=drops[i];dp.y+=2.3*k;dp.spin=(dp.spin||0)+0.15*k;
    if(dp.y>pad.y-8&&dp.y<pad.y+pad.h+8&&dp.x>pad.x-8&&dp.x<pad.x+pad.w+8){applyPower(dp.type);drops.splice(i,1);continue;}
    if(dp.y>H+12)drops.splice(i,1);}
  // laser auto-fire
  if(Date.now()<laserUntil&&state==='play'){laserCd-=k;if(laserCd<=0){bolts.push({x:pad.x+8,y:pad.y});bolts.push({x:pad.x+pad.w-8,y:pad.y});laserCd=14;sfx('laser');}}
  if(hitstop>0){hitstop-=k;}
  if(state!=='play'){balls.forEach(function(b){if(b.stuck){b.x=pad.x+pad.w/2;b.y=pad.y-R-1;}});return;}
  if(hitstop>0)return; // freeze-frame punch

    for(var bi=balls.length-1;bi>=0;bi--){
      var ball=balls[bi]; if(ball.sq>0)ball.sq*=0.85;
      if(stp===0){ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>(LITE?5:9))ball.trail.shift();}
      ball.x+=ball.vx*ss;ball.y+=ball.vy*ss;
      if(ball.x-R<0){ball.x=R;ball.vx=-ball.vx;ball.sq=1;sfx('wall');} else if(ball.x+R>W){ball.x=W-R;ball.vx=-ball.vx;ball.sq=1;sfx('wall');}
      if(ball.y-R<0){ball.y=R;ball.vy=-ball.vy;ball.sq=1;sfx('wall');}

        if(Date.now()<catchUntil){ball.stuck=true;ball.catchDX=ball.x-pad.x;ball.vy=0;ball.vx=0;state='ready';}

    }
  }
}
function over_hint(){/* caught ball waits; tap relaunches */}

function draw(){
  var sx=(Math.random()-0.5)*shake,sy=(Math.random()-0.5)*shake;
  ctx.setTransform(DPR,0,0,DPR,sx,sy);
  ctx.drawImage(bgCan,0,0,W,H);
  // bricks (blit pre-rendered sprites)
  for(var i=0;i<bricks.length;i++){var b=bricks[i];var sp=makeBrickSprite(b.hp,b.w,b.h);ctx.drawImage(sp.cv,b.x-sp.ox,b.y-sp.oy,sp.cv.width/DPR,sp.cv.height/DPR);}
  // drops
  for(i=0;i<drops.length;i++){var dp=drops[i];ctx.save();ctx.translate(dp.x,dp.y);ctx.rotate(dp.spin||0);ctx.shadowColor=PWR[dp.type];ctx.shadowBlur=10;ctx.fillStyle=PWR[dp.type];rr(ctx,-7,-7,14,14,4);ctx.fill();ctx.restore();}
  // shards
  for(i=0;i<shards.length;i++){var sh=shards[i];ctx.save();ctx.globalAlpha=Math.max(0,sh.life);ctx.translate(sh.x,sh.y);ctx.rotate(sh.rot);ctx.fillStyle='hsl('+sh.hue+',70%,60%)';ctx.fillRect(-sh.sz/2,-sh.sz/2,sh.sz,sh.sz);ctx.restore();}

  // particles (additive)
  ctx.globalCompositeOperation='lighter';
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle='hsl('+p.hue+',90%,65%)';ctx.fillRect(p.x,p.y,p.sz,p.sz);}
  for(i=0;i<flashes.length;i++){var f=flashes[i];ctx.globalAlpha=Math.max(0,f.life)*0.5;var fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,f.r);fg.addColorStop(0,'hsla('+f.hue+',100%,75%,1)');fg.addColorStop(1,'hsla('+f.hue+',100%,75%,0)');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,7);ctx.fill();}
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // bolts
  for(i=0;i<bolts.length;i++){var bo=bolts[i];ctx.fillStyle='#ff5a6e';ctx.fillRect(bo.x-1.5,bo.y-10,3,12);}
  // balls
  for(i=0;i<balls.length;i++)drawBall(balls[i]);
  // paddle
  drawPaddle();
  // active power-up timers (blink white when about to expire)
  drawTimers();
  // pops
  ctx.textAlign='center';ctx.font='700 12px JetBrains Mono, monospace';
  for(i=0;i<pops.length;i++){var q=pops[i];ctx.globalAlpha=Math.max(0,q.life);ctx.fillStyle='#eafff9';ctx.fillText(q.t,q.x,q.y);}
  ctx.globalAlpha=1;
  // screen flash
  if(flashScreen>0.02){ctx.fillStyle='rgba(180,240,255,'+(flashScreen*0.25)+')';ctx.fillRect(-20,-20,W+40,H+40);}
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
function drawBall(ball){
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(var t=0;t<ball.trail.length;t++){var tr=ball.trail[t],a=(t/ball.trail.length)*0.32;ctx.globalAlpha=a;ctx.beginPath();ctx.arc(tr.x,tr.y,R*0.85,0,7);ctx.fillStyle='#4cf0e0';ctx.fill();}
  ctx.globalAlpha=1;ctx.drawImage(ballGlow,ball.x-ballGlow.width/DPR/2,ball.y-ballGlow.height/DPR/2,ballGlow.width/DPR,ballGlow.height/DPR);ctx.restore();
  var sq=ball.sq||0,rx=R*(1+sq*0.35),ry=R*(1-sq*0.3);
  var rg=ctx.createRadialGradient(ball.x-R*0.4,ball.y-R*0.42,R*0.15,ball.x,ball.y,R);
  rg.addColorStop(0,'#ffffff');rg.addColorStop(.45,'#c6faf4');rg.addColorStop(1,'#37b3a6');
  ctx.fillStyle=rg;ctx.beginPath();ctx.ellipse(ball.x,ball.y,rx,ry,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.9)';ctx.beginPath();ctx.arc(ball.x-R*0.34,ball.y-R*0.38,R*0.24,0,7);ctx.fill();
}
function drawPaddle(){
  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=9;ctx.shadowOffsetY=5;
  var pg=ctx.createLinearGradient(0,pad.y,0,pad.y+pad.h);
  pg.addColorStop(0,'#ffe6c9');pg.addColorStop(.42,'#f6b877');pg.addColorStop(.5,'#e79a4d');pg.addColorStop(1,'#b06f2e');
  ctx.fillStyle=pg;rr(ctx,pad.x,pad.y,pad.w,pad.h,6);ctx.fill();ctx.restore();
  // underglow
  var ug=ctx.createLinearGradient(0,pad.y+pad.h,0,pad.y+pad.h+10);ug.addColorStop(0,'rgba(245,152,71,.4)');ug.addColorStop(1,'rgba(245,152,71,0)');
  ctx.fillStyle=ug;ctx.fillRect(pad.x,pad.y+pad.h,pad.w,10);
  if(Date.now()<laserUntil){ctx.fillStyle='#ff5a6e';ctx.fillRect(pad.x+6,pad.y-4,3,5);ctx.fillRect(pad.x+pad.w-9,pad.y-4,3,5);}
  if(powExpiring()){var pp=Math.abs(Math.sin(Date.now()/90));ctx.globalAlpha=pp*0.85;ctx.fillStyle='#fff';rr(ctx,pad.x,pad.y,pad.w,pad.h,6);ctx.fill();ctx.globalAlpha=1;}
}
function powExpiring(){var n=Date.now();return (n<expandUntil&&expandUntil-n<1500)||(n<catchUntil&&catchUntil-n<1500)||(n<laserUntil&&laserUntil-n<1500);}
function drawTimers(){
  var n=Date.now(),act=[];
  if(n<expandUntil)act.push(['expand',PWR.expand,expandUntil-n,9000]);
  if(n<slowUntil)act.push(['slow',PWR.slow,slowUntil-n,6000]);
  if(n<catchUntil)act.push(['catch',PWR.catch,catchUntil-n,9000]);
  if(n<laserUntil)act.push(['laser',PWR.laser,laserUntil-n,8000]);
  if(!act.length)return;
  var w=44,h=6,gap=7,x=10,y=9;
  for(var i=0;i<act.length;i++){var a=act[i],rem=a[2],dur=a[3],expiring=rem<1500;
    ctx.globalAlpha=expiring?(0.3+0.7*Math.abs(Math.sin(n/90))):0.9;
    ctx.fillStyle='rgba(255,255,255,0.12)';rr(ctx,x,y,w,h,3);ctx.fill();
    var fw=Math.max(2,w*Math.max(0,rem/dur));
    ctx.fillStyle=expiring?'#ffffff':a[1];rr(ctx,x,y,fw,h,3);ctx.fill();
    ctx.globalAlpha=1;x+=w+gap;if(x+w>W-10){x=10;y+=h+gap;}
  }
}

// perf auto-lite (latches on; never flickers back)
var ft=[],lastT=performance.now();
function loop(now){
  now=now||performance.now();var dt=now-lastT;lastT=now;
  if(dt>100)dt=100; // ignore huge gaps (tab switch) so nothing teleports
  ft.push(dt);if(ft.length>50)ft.shift();
  if(!LITE&&ft.length===50){var s2=ft.slice().sort(function(a,b){return a-b;});if(s2[25]>30)LITE=true;}
  var k=Math.max(0.2,Math.min(3,dt/16.6667));
  step(k);draw();requestAnimationFrame(loop);
}

// input
function movePad(clientX){var r=stage.getBoundingClientRect();pad.x=Math.max(0,Math.min(W-pad.w,(clientX-r.left)-pad.w/2));}
stage.addEventListener('pointermove',function(e){if(state==='play'||state==='ready')movePad(e.clientX);},{passive:true});
stage.addEventListener('pointerdown',function(e){actx();if(state==='play'||state==='ready'){movePad(e.clientX);launch();balls.forEach(function(b){if(b.stuck){b.stuck=false;var sp=Math.max(4,W*0.012);b.vx=(b.catchDX!==undefined?((b.catchDX-pad.w/2)/(pad.w/2)):0.4)*sp;b.vy=-Math.abs(sp);}});state='play';}},{passive:true});
ovBtn.addEventListener('click',function(e){e.stopPropagation();actx();start();});
muteBtn.addEventListener('click',function(){muted=!muted;muteBtn.classList.toggle('on',!muted);muteBtn.textContent=muted?'♪̸':'♪';if(!muted)actx();});
window.addEventListener('resize',function(){size();layout();makeBricks();if(state==='play')balls.forEach(function(b){b.x=Math.min(b.x,W-R);});});

size();reset(true);requestAnimationFrame(loop);
})();
</script>

<div class="toast" id="toast"></div>
<script>
(function(){
  var VERSION='v1.0 · Aug 13';  // bump this one line on every change
  var vb=document.getElementById('vb'),toast=document.getElementById('toast'),t;
  if(vb){
    vb.textContent=VERSION;
    vb.addEventListener('click',function(e){
      e.stopPropagation();
      toast.textContent=VERSION+' · loaded';
      toast.classList.add('show');
      clearTimeout(t);t=setTimeout(function(){toast.classList.remove('show');},1600);
    });
  }
})();
</script>
