<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mot Buchanan</title>
<meta name="description" content="Mot Buchanan. I'm building something. Play while the real site comes together.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#ebedef;--soft:#c2c9d1;--teal:#4cf0e0;--orange:#f59847;--sys:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0a0d11;font-family:'Archivo',system-ui,sans-serif;color:var(--ink);min-height:100svh;
  display:flex;align-items:center;justify-content:center}

/* ---- the studio (his dialed-in key + rim light) ---- */
.roomlight{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  conic-gradient(from 118deg at 1.3% -6.9%, transparent 0deg, rgba(254,228,196,.13) 9deg, rgba(254,228,196,.43) 26deg, rgba(254,228,196,.16) 44deg, transparent 52deg),
  radial-gradient(60vmax 60vmax at 1.3% -6.9%, rgba(255,234,208,.29), transparent 60%),
  linear-gradient(to left, rgba(76,240,224,.26) 0%, rgba(76,240,224,.09) 3.8%, transparent 9%),
  radial-gradient(46vmax 82vmax at 110% 55%, rgba(76,240,224,.13), transparent 60%),
  radial-gradient(150vmax 130vmax at 22% -12%, rgba(70,80,98,.38), transparent 60%),#12151a}
.grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.08;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27140%27%20height%3D%27140%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.8%27%20numOctaves%3D%272%27%2F%3E%3CfeColorMatrix%20type%3D%27saturate%27%20values%3D%270%27%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%2523n%29%27%2F%3E%3C%2Fsvg%3E")}
.vgn{position:fixed;inset:0;z-index:0;pointer-events:none;box-shadow:inset 0 0 150px 34px rgba(0,0,0,.42)}

/* ---- the device ---- */
.device{position:relative;z-index:1;width:100%;min-height:100svh;overflow:hidden}
.island{display:none}
@media(min-width:620px){.island{display:block;position:absolute;top:11px;left:50%;transform:translateX(-50%);width:116px;height:31px;background:#000;border-radius:17px;z-index:4;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}}
@media(min-width:620px){
  body{padding:36px 0}
  .device{width:392px;min-height:768px;border-radius:44px;border:9px solid #171a1f;
    box-shadow:0 40px 90px rgba(0,0,0,.65), 0 0 0 1.5px #2b3138, -18px 22px 60px rgba(0,0,0,.45)}
}
/* wallpaper inside the phone = the same studio, closer */
.wall{position:absolute;inset:0;z-index:0;background:
  conic-gradient(from 118deg at 1.3% -6.9%, transparent 0deg, rgba(254,228,196,.13) 9deg, rgba(254,228,196,.4) 26deg, rgba(254,228,196,.15) 44deg, transparent 52deg),
  radial-gradient(60vmax 60vmax at 1.3% -6.9%, rgba(255,234,208,.24), transparent 60%),
  linear-gradient(to left, rgba(76,240,224,.22) 0%, rgba(76,240,224,.08) 4%, transparent 9%),
  radial-gradient(46vmax 82vmax at 110% 55%, rgba(76,240,224,.12), transparent 60%),
  radial-gradient(150vmax 130vmax at 22% -12%, rgba(70,80,98,.38), transparent 60%),#10141a}
.wall::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px 16px rgba(0,0,0,.35)}

.screen{position:relative;z-index:1;display:flex;flex-direction:column;min-height:100svh;padding:0 16px calc(14px + env(safe-area-inset-bottom))}
@media(min-width:620px){.screen{min-height:750px}}

.status{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px;
  font:700 15px var(--sys);color:var(--ink)}
.status .right{display:flex;align-items:center;gap:7px}
.sig{display:flex;gap:2px;align-items:flex-end}
.sig i{width:3px;background:var(--ink);border-radius:1px}
.wifi{width:17px;height:13px;display:block}
.batt{width:24px;height:12px;border:1.5px solid var(--ink);border-radius:3.5px;position:relative}
.batt::before{content:"";position:absolute;left:1.5px;top:1.5px;bottom:1.5px;width:72%;background:var(--ink);border-radius:1.5px}
.batt::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:var(--ink);border-radius:1px}

/* the widget */
.widget{margin-top:16px;background:rgba(16,20,26,.55);border:0;
  border-radius:26px;padding:20px 16px 17px;backdrop-filter:blur(12px);text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.07)}
.wm{width:min(66vw,280px);height:auto;display:inline-block}
.w1{margin-top:11px;font-weight:800;font-size:16.5px}
.w2{margin-top:3px;color:var(--soft);font-size:12.5px}

/* app grid */
.grid{margin-top:24px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px;justify-items:center}
.app{background:none;border:0;font:inherit;color:inherit;cursor:pointer;width:100%;max-width:80px;text-align:center;position:relative}
.icon{display:block;position:relative;width:100%;aspect-ratio:1/1;border-radius:24%;overflow:hidden;
  clip-path:url(#sqrc);filter:drop-shadow(0 9px 14px rgba(0,0,0,.42))}
.icon::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(135deg,rgba(255,255,255,.26),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 68%,rgba(255,255,255,.1));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.icon svg{position:absolute;inset:0;width:100%;height:100%}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.app .nm{display:block;margin-top:7px;font:500 11px var(--sys);color:var(--ink);text-shadow:0 1px 3px rgba(0,0,0,.75);letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.app:active .icon{transform:scale(.93)}
.app.installing{cursor:default}
.app.installing .icon{filter:saturate(.35) brightness(.6)}
.ring{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.ring::before{content:"";width:44%;aspect-ratio:1/1;border-radius:50%;
  background:conic-gradient(rgba(255,255,255,.95) 0 var(--pr,68%), rgba(255,255,255,.22) var(--pr,68%) 100%);
  -webkit-mask:radial-gradient(farthest-side, transparent 60%, #000 63%);mask:radial-gradient(farthest-side, transparent 60%, #000 63%)}
.app.installing .nm{opacity:.75}

.spill{margin-top:auto;margin-bottom:12px;align-self:center;display:flex;align-items:center;gap:8px;
  background:rgba(14,18,23,.55);border-radius:22px;padding:10px 16px;backdrop-filter:blur(14px);width:min(60%,220px)}
.spill svg{width:15px;height:15px;flex:none}
.spill input{background:none;border:0;outline:none;color:var(--ink);font:400 14px var(--sys);width:100%;min-width:0}
.spill input::placeholder{color:var(--soft)}
.dock{background:rgba(14,18,23,.5);border:1px solid rgba(255,255,255,.13);
  border-radius:28px;padding:13px 14px;backdrop-filter:blur(14px);display:flex;justify-content:center;gap:26px}
.dk{background:none;border:0;cursor:pointer;text-align:center;color:var(--ink);font:inherit;width:60px}
.dk .icon{width:56px;max-width:56px;margin:0 auto}

.tagline{margin-top:11px;text-align:center;font:400 10px 'JetBrains Mono',monospace;color:rgba(199,204,212,.55)}

/* player */
#player{position:fixed;inset:0;z-index:50;background:#000;display:none}
#player.on{display:block;animation:appopen .22s ease-out}
@keyframes appopen{from{transform:scale(.84);opacity:.4;border-radius:38px}to{transform:scale(1);opacity:1;border-radius:0}}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#back{position:absolute;top:calc(10px + env(safe-area-inset-top));left:10px;z-index:2;background:rgba(10,13,17,.86);
  color:var(--teal);border:1px solid rgba(76,240,224,.4);border-radius:9px;font:600 12px 'JetBrains Mono',monospace;padding:9px 13px;cursor:pointer;backdrop-filter:blur(4px)}
#back:active{background:rgba(76,240,224,.15)}
@media (prefers-reduced-motion:reduce){#player.on{animation:none}}
</style>
</head>

<div id="player"><button id="back">&larr; home</button><div id="pw"></div></div>

<script>
(function(){
function tick(){var d=new Date(),h=d.getHours()%12||12,m=('0'+d.getMinutes()).slice(-2);
  document.getElementById('clock').textContent=h+':'+m;}
tick();setInterval(tick,15000);

var pl=document.getElementById('player'),pw=document.getElementById('pw');
function openG(f,selfback){document.getElementById('back').style.display=selfback?'none':'block';var fr=document.createElement('iframe');fr.id='gf';fr.src=f;
  fr.setAttribute('allow','autoplay; fullscreen; gamepad');
  pw.appendChild(fr);pl.classList.add('on');
  try{history.pushState({g:f},'',location.pathname);}catch(e){}}
function closeG(){var fr=document.getElementById('gf');if(fr){fr.src='about:blank';fr.remove();}pl.classList.remove('on');}
document.querySelectorAll('.app[data-game]').forEach(function(a){a.addEventListener('click',function(){openG(a.dataset.game,a.dataset.selfback==='1');});});
document.getElementById('mail').addEventListener('click',function(){location.href='mailto:motbuchanan@gmail.com';});
var sq=document.getElementById('sq');
if(sq){sq.addEventListener('input',function(){var q=sq.value.trim().toLowerCase();
  document.querySelectorAll('.grid .app').forEach(function(a){
    var nm=a.querySelector('.nm').textContent.toLowerCase();
    a.style.display=(!q||nm.indexOf(q)>-1)?'':'none';
  });});}
document.getElementById('back').addEventListener('click',function(){if(history.state&&history.state.g){history.back();}else{closeG();}});
window.addEventListener('popstate',function(){if(pl.classList.contains('on'))closeG();});
})();
</script>
