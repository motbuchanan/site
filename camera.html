<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Camera</title>
<style>
  :root{--ink:#ebedef;--dim:#8b93a0;--teal:#4cf0e0;--sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--ink);font-family:var(--sys);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;flex-direction:column}
  video,#shot{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
  #shot{display:none}
  .grid3{position:absolute;inset:0;pointer-events:none;opacity:.25}
  .grid3::before,.grid3::after{content:"";position:absolute;background:#fff}
  .grid3::before{left:33.33%;right:33.33%;top:0;bottom:0;border-left:1px solid #fff;border-right:1px solid #fff}
  .grid3::after{top:33.33%;bottom:33.33%;left:0;right:0;border-top:1px solid #fff;border-bottom:1px solid #fff}
  .topbar{position:absolute;top:0;left:0;right:0;padding:16px;display:flex;justify-content:space-between;align-items:center;z-index:5;
    background:linear-gradient(#000a,transparent)}
  .topbar .mode{font:600 13px var(--sys);color:var(--teal);letter-spacing:.08em}
  .chip{background:#0008;border:1px solid #ffffff30;color:#fff;border-radius:20px;padding:7px 12px;font:600 12px var(--sys);cursor:pointer}
  .controls{position:absolute;left:0;right:0;bottom:0;padding:22px 0 34px;display:flex;align-items:center;justify-content:space-around;z-index:5;
    background:linear-gradient(transparent,#000a)}
  .shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid #ffffff70;cursor:pointer;transition:transform .1s}
  .shutter:active{transform:scale(.9)}
  .side{width:50px;height:50px;border-radius:14px;background:#ffffff18;border:1px solid #ffffff25;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .side svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:9}
  .flash.go{animation:fl .4s ease}
  @keyframes fl{0%{opacity:.9}100%{opacity:0}}
  /* fallback */
  #fallback{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px;z-index:8;background:#0b0e12}
  #fallback svg{width:72px;height:72px;margin-bottom:20px}
  #fallback h2{font:800 20px var(--sys);margin-bottom:10px}
  #fallback p{color:var(--dim);font-size:14px;line-height:1.6;max-width:280px;margin-bottom:20px}
  #fallback .retry{background:var(--teal);color:#06251f;border:0;border-radius:12px;padding:12px 22px;font:700 14px var(--sys);cursor:pointer}
  .hint{position:absolute;bottom:120px;left:0;right:0;text-align:center;color:#fff9;font-size:12px;z-index:5;pointer-events:none}
</style>
</head>
<body>

<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="shot"></canvas>
  <div class="grid3" id="grid3"></div>
  <div class="flash" id="flash"></div>

  <div class="topbar">
    <span class="mode">MOT-1 CAM</span>
    <button class="chip" id="flip">flip</button>
  </div>

  <div class="hint" id="hint">every photo gets the aperture mark</div>

  <div class="controls" id="controls">
    <div class="side" id="gridBtn" title="grid"><svg viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></div>
    <div class="shutter" id="shutter" title="capture"></div>
    <div class="side" id="saveBtn" title="save" style="opacity:.4;pointer-events:none"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></div>
  </div>

  <div id="fallback">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" aria-hidden="true"><use href="#apmark" xlink:href="#apmark" x="6" y="6" width="88" height="88"/></svg>
    <h2>No camera? No problem.</h2>
    <p id="fbmsg">This app borrows your device camera to prove the phone is real. If you'd rather not, that's completely fine. Nothing is recorded, sent, or saved anywhere.</p>
    <button class="retry" id="retry">Try the camera</button>
  </div>
</div>

<script>
(function(){
  var video=document.getElementById('video'),shot=document.getElementById('shot'),
      fb=document.getElementById('fallback'),fbmsg=document.getElementById('fbmsg'),
      flash=document.getElementById('flash'),saveBtn=document.getElementById('saveBtn'),
      controls=document.getElementById('controls'),hint=document.getElementById('hint'),
      grid=document.getElementById('grid3');
  var stream=null,facing='environment',lastShot=null,gridOn=true;

  function showFallback(msg){ if(msg)fbmsg.textContent=msg; fb.style.display='flex'; }
  function hideFallback(){ fb.style.display='none'; }

  function stop(){ if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null;} }

  function start(){
    hideFallback();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      showFallback("This browser won't share a camera here. On the live site over https it works; some in-app browsers block it."); return;
    }
    stop();
    navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false})
      .then(function(s){ stream=s; video.srcObject=s; video.style.display='block'; shot.style.display='none'; })
      .catch(function(err){
        var m="Camera access was blocked. No worries. You can allow it in your browser and tap Try again, or just head back.";
        if(location.protocol!=='https:') m="The camera only opens over https. On the live motbuchanan.com it works; opened as a file it can't.";
        showFallback(m);
      });
  }

  document.getElementById('retry').addEventListener('click',start);
  document.getElementById('flip').addEventListener('click',function(){ facing=(facing==='environment')?'user':'environment'; start(); });
  document.getElementById('gridBtn').addEventListener('click',function(){ gridOn=!gridOn; grid.style.display=gridOn?'block':'none'; });

  document.getElementById('shutter').addEventListener('click',function(){
    if(!stream){ start(); return; }
    var vw=video.videoWidth,vh=video.videoHeight;
    if(!vw){ return; }
    shot.width=vw; shot.height=vh;
    var ctx=shot.getContext('2d');
    if(facing==='user'){ ctx.translate(vw,0); ctx.scale(-1,1); }
    ctx.drawImage(video,0,0,vw,vh);
    ctx.setTransform(1,0,0,1,0,0);
    // aperture watermark bottom-right
    drawMark(ctx,vw,vh);
    lastShot=shot.toDataURL('image/png');
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    video.style.display='none'; shot.style.display='block';
    saveBtn.style.opacity='1'; saveBtn.style.pointerEvents='auto';
    hint.textContent='tap the shutter for another';
  });

  // real aperture mark, stamped from SVG
  var MARK_SVG='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="940 -200 720 880"><g transform="translate(844.9,-213.7) scale(9.2129)"><path d="M27.6,5.0 L26.5,6.7 L24.6,9.4 L23.0,11.8 L20.7,15.0 L20.4,15.6 L19.4,15.7 L13.5,15.8 L12.3,16.0 L12.3,19.9 L12.7,20.1 L18.6,20.2 L22.7,20.2 L23.8,18.8 L25.5,16.4 L26.6,14.7 L28.5,12.0 L29.9,9.9 L31.0,8.2 L32.3,6.3 L32.5,6.1 L63.5,6.1 L63.8,6.8 L65.4,9.1 L66.8,11.1 L68.6,13.7 L69.6,15.1 L71.1,17.4 L72.8,19.6 L73.5,20.4 L86.2,20.4 L86.3,20.2 L86.3,15.8 L86.2,15.7 L75.9,15.6 L73.9,13.0 L73.0,11.5 L71.8,9.9 L70.1,7.5 L68.6,5.3 L68.5,5.0 Z M48.5,33.3 L45.9,33.6 L42.7,34.2 L39.4,35.1 L38.0,35.7 L38.0,36.3 L40.8,38.0 L44.4,40.1 L46.6,41.3 L50.3,43.6 L52.5,45.0 L54.5,46.1 L58.5,48.5 L61.4,50.4 L62.1,50.9 L62.5,50.8 L62.3,49.5 L60.8,43.9 L59.0,36.7 L58.6,34.7 L58.0,34.3 L55.4,33.7 L53.7,33.5 L52.0,33.3 Z M61.4,35.6 L61.3,36.3 L61.5,37.1 L62.1,39.9 L63.8,46.7 L65.4,52.6 L66.1,55.1 L67.2,59.1 L68.0,62.2 L68.2,63.3 L68.7,63.5 L70.4,60.4 L71.7,58.2 L73.7,54.7 L75.1,52.3 L75.9,50.8 L76.8,49.4 L76.6,48.7 L75.6,47.3 L75.1,46.3 L73.4,44.0 L73.1,44.0 L72.8,43.5 L70.1,40.8 L67.3,38.7 L64.8,37.1 L62.5,36.0 L61.7,35.6 Z M34.6,37.3 L33.1,38.2 L31.4,39.5 L29.9,40.8 L28.2,42.3 L26.5,44.2 L26.5,44.4 L26.2,44.4 L24.8,46.4 L23.8,48.0 L22.5,49.9 L21.7,51.8 L21.3,53.2 L23.0,52.9 L26.2,52.0 L28.0,51.5 L33.5,49.9 L35.2,49.4 L36.3,49.1 L40.3,48.0 L43.5,47.0 L47.0,46.0 L48.3,45.6 L48.3,45.1 L46.8,44.3 L44.1,42.7 L43.1,42.2 L39.2,39.8 L36.9,38.5 L34.8,37.3 Z M35.2,51.8 L33.7,52.3 L31.3,53.0 L28.5,54.0 L24.9,55.0 L22.1,55.8 L20.3,56.5 L20.1,57.1 L20.4,57.1 L20.4,57.5 L19.9,57.4 L19.4,60.6 L19.4,61.9 L19.7,61.8 L19.9,60.5 L19.9,62.3 L20.0,63.5 L19.7,63.5 L19.7,62.3 L19.6,62.3 L19.4,65.0 L19.4,68.1 L19.7,70.4 L20.3,72.5 L20.8,74.6 L21.4,76.3 L21.8,76.3 L23.2,73.9 L24.6,71.6 L26.6,68.2 L27.3,67.0 L29.2,63.9 L31.5,59.8 L33.5,56.4 L34.8,54.2 L35.9,52.0 L35.9,51.8 Z M77.9,51.9 L77.0,53.2 L76.2,54.7 L74.5,57.7 L72.5,61.1 L71.7,62.6 L69.6,66.3 L68.2,68.7 L66.3,71.9 L65.2,73.9 L64.1,75.7 L63.5,76.7 L63.7,77.3 L64.2,77.1 L68.2,76.0 L69.7,75.4 L71.7,74.9 L74.9,73.9 L78.9,72.7 L79.7,72.3 L80.1,70.5 L80.6,67.4 L80.7,66.0 L80.7,61.9 L80.3,58.5 L79.9,56.4 L79.2,54.2 L78.5,52.2 Z M31.0,65.6 L29.3,68.4 L28.3,70.4 L26.9,72.7 L26.1,74.2 L25.2,75.7 L23.7,78.4 L23.0,79.8 L23.9,81.3 L25.2,83.0 L26.5,84.6 L28.0,86.3 L30.1,88.2 L31.8,89.5 L33.7,90.8 L35.5,91.9 L37.7,92.9 L38.2,92.7 L37.9,91.3 L36.9,87.5 L35.6,82.2 L34.5,77.8 L33.9,75.8 L33.2,72.9 L31.5,66.7 L31.3,65.6 Z M78.2,75.1 L73.8,76.5 L70.4,77.5 L67.3,78.4 L63.7,79.5 L60.7,80.4 L56.5,81.6 L53.0,82.6 L51.3,83.0 L51.1,83.6 L53.9,85.3 L56.9,87.1 L60.8,89.5 L63.5,91.2 L64.4,91.6 L65.2,91.5 L66.6,90.5 L67.5,89.9 L69.4,88.4 L70.1,87.8 L70.1,87.5 L70.7,87.3 L73.0,85.0 L74.5,83.0 L76.1,80.9 L77.0,79.4 L78.3,76.7 L78.7,75.8 L78.7,75.1 Z M37.2,78.1 L37.0,78.5 L37.6,80.5 L38.5,83.9 L39.2,87.0 L40.3,91.6 L41.0,93.9 L41.1,94.2 L43.4,94.7 L44.8,95.0 L45.1,95.1 L54.5,95.1 L55.6,94.9 L58.0,94.3 L60.6,93.5 L61.7,93.0 L61.5,92.6 L59.9,91.6 L57.3,90.1 L54.6,88.4 L51.5,86.5 L49.6,85.3 L46.9,83.7 L44.9,82.5 L42.0,80.8 L41.0,80.1 L39.4,79.2 L38.5,78.5 L37.6,78.1 Z" fill="#4cf0e0" fill-rule="evenodd"/></g></svg>');
  var markImg=new Image(); var markReady=false;
  markImg.onload=function(){markReady=true;}; markImg.src=MARK_SVG;

  function drawMark(ctx,w,h){
    var s=Math.max(70,Math.round(w*0.16)), pad=Math.round(w*0.045);
    if(markReady){ ctx.save(); ctx.globalAlpha=0.95; ctx.drawImage(markImg, w-pad-s, h-pad-s, s, s); ctx.restore(); }
    ctx.save();
    ctx.font='700 '+Math.round(s*0.22)+"px -apple-system,sans-serif"; ctx.fillStyle='#4cf0e0'; ctx.globalAlpha=0.85;
    ctx.textAlign='right'; ctx.fillText('motbuchanan.com', w-pad-s-pad, h-pad-s*0.4);
    ctx.restore();
  }

  saveBtn.addEventListener('click',function(){
    if(!lastShot) return;
    var a=document.createElement('a'); a.href=lastShot; a.download='mot-cam-'+Date.now()+'.png'; a.click();
  });

  window.addEventListener('pagehide',stop);
  window.addEventListener('beforeunload',stop);
  start();
})();
</script>
</body>
</html>
