<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Dominoes — 2 Players</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--accent:#b0d235;--accentSh:#7e9a1f;--text:#e8f0e4;}
  html,body{height:100%;}
  body{font-family:system-ui,sans-serif;color:var(--text);display:flex;flex-direction:column;overflow:hidden;
    background:radial-gradient(110% 80% at 50% 20%,#1f3327 0%,#0c1410 80%);}
  #bar{display:flex;align-items:center;gap:10px;padding:10px 14px 4px;}
  #bar a{color:#cfe6d8;text-decoration:none;font-size:13px;border:1px solid #3a5a47;background:#15241b;border-radius:999px;padding:6px 12px;}
  #title{font-weight:800;font-size:17px;}
  #turn{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;}
  #dot{width:14px;height:14px;border-radius:50%;animation:dp 1.8s ease-in-out infinite;}
  @keyframes dp{0%,100%{transform:scale(1);}50%{transform:scale(1.2);}}
  .handRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px 8px;min-height:74px;align-content:center;}
  .handRow .who{width:100%;text-align:center;font-size:12px;color:#9fbdac;font-weight:700;letter-spacing:.5px;}
  #lineWrap{flex:1;overflow-x:auto;overflow-y:hidden;display:flex;align-items:center;background:rgba(0,0,0,.25);
    border-top:1px solid #28402f;border-bottom:1px solid #28402f;}
  #line{display:flex;align-items:center;gap:4px;padding:14px 24px;margin:0 auto;}
  .bone{position:relative;background:linear-gradient(168deg,#fffdf6 0%,#f3eddf 55%,#e4dccb 100%);border:1px solid #c7bfac;border-radius:8px;
    display:flex;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),inset 0 -2px 3px rgba(120,100,70,.18),0 3px 7px rgba(0,0,0,.45);flex:0 0 auto;}
  .bone.v{flex-direction:column;}
  .bone .half{width:34px;height:34px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:5px;}
  .bone.h .half:first-child{box-shadow:1px 0 0 rgba(255,255,255,.7);border-right:1.5px solid #b3a98f;}
  .bone.v .half:first-child{box-shadow:0 1px 0 rgba(255,255,255,.7);border-bottom:1.5px solid #b3a98f;}
  .half i{border-radius:50%;background:radial-gradient(circle at 38% 32%,#454d55,#14181c 72%);visibility:hidden;margin:1px;
    box-shadow:inset 0 1.5px 2px rgba(0,0,0,.65),0 1px 0 rgba(255,255,255,.55);}
  .hand .bone{cursor:pointer;}
  .hand .bone.playable{box-shadow:0 0 0 2px #f7f3da,0 0 14px rgba(247,243,218,.7),0 3px 7px rgba(0,0,0,.4);}
  .hand .bone.idle{opacity:.78;}
  #msg{min-height:20px;font-size:14px;color:#cfe6d8;text-align:center;padding:3px 12px;}
  #foot{padding:4px 0 12px;display:flex;gap:12px;align-items:center;justify-content:center;;flex-wrap:wrap;justify-content:center;row-gap:8px}
  button.act{font-family:inherit;font-size:14px;font-weight:bold;padding:8px 14px;border-radius:10px;border:none;color:#1c2b16;background:var(--accent);cursor:pointer;box-shadow:0 4px 0 var(--accentSh),0 5px 10px rgba(0,0,0,.4);}
  button.ghost{background:#15241b;color:#cfe6d8;box-shadow:0 4px 0 #0b160f;border:1px solid #3a5a47;}
  #score{font-size:13px;color:#9fbdac;}
  .ov{position:fixed;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:30px;text-align:center;background:rgba(7,12,9,.9);}
  .ov.show{display:flex;}
  .ov h1{font-size:32px;}
  #endChoice{display:flex;gap:14px;}
  #confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .cfp{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;opacity:.95;animation-name:cfall;animation-timing-function:linear;animation-fill-mode:forwards;}
  @keyframes cfall{0%{transform:translateY(-20px) rotate(0deg);}100%{transform:translateY(108vh) rotate(680deg);}}
  #ovTrophy{font-size:58px;line-height:1;}
  .ov.show #ovTrophy,.ov.show h1{animation:winpop .65s cubic-bezier(.2,1.5,.4,1) both;}
  @keyframes winpop{0%{transform:scale(.25);opacity:0;}100%{transform:scale(1);opacity:1;}}
  .boneback{width:58px;height:30px;border-radius:5px;display:inline-block;margin:3px;
    background:linear-gradient(135deg,#1d3a29,#0f231a);border:1px solid #355d45;box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);}
</style>
</head>

<div id="bar"><a href="index.html">&#8962; Shelf</a><div id="title">Dominoes</div><div id="turn"><div id="dot"></div><span id="turnName"></span></div></div>

<script>
/* Standalone shim replacing the Game Shelf framework for the public showcase (board games v2: mode picker + cube die).
   No cloud, no accounts: solo + pass-and-play only. Records stay on this device. */
(function(){
var GN={
 g:{addSentHome:function(){},addDice:function(){}},
 friendly:false,
 whoBadge:function(el,name){if(el)el.textContent=name||'';},
 soloStart:function(cb){if(typeof cb==='function')cb('You');},
 matchStart:function(cb,opts){opts=opts||{};
   var P1={name:'Player 1',color:'#d8312b',light:'#f06a60',dark:'#8d1d19'},P2={name:'Player 2',color:'#2f6fd0',light:'#6fa0ec',dark:'#194182'};
   function go(mode){
     var m;
     if(mode==='solo'){var you={name:'You',color:P1.color,light:P1.light,dark:P1.dark};m={a:you,b:null,first:you,solo:true,friendly:false,vsComputer:false};}
     else if(mode==='cpu'){var y={name:'Player 1',color:P1.color,light:P1.light,dark:P1.dark},c={name:'Computer',color:P2.color,light:P2.light,dark:P2.dark};m={a:y,b:c,first:Math.random()<.5?y:c,friendly:false,vsComputer:true,bot:'medium'};}
     else{m={a:P1,b:P2,first:Math.random()<.5?P1:P2,friendly:false,vsComputer:false};}
     if(typeof cb==='function')cb(m);
   }
   var alt=opts.bot?['cpu','Play the computer']:(opts.solo?['solo','Play solo']:null);
   if(!alt){go('pnp');return;}
   var ov=document.createElement('div');
   ov.style.cssText='position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(5,7,10,.82);padding:20px;font-family:inherit';
   var bs='display:block;width:100%;margin:10px 0 0;padding:14px 16px;border-radius:12px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;';
   ov.innerHTML='<div style="width:100%;max-width:320px;background:#141a21;border:1px solid #2b323b;border-radius:16px;padding:20px 18px 18px;color:#ebedef;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5)">'+
     '<div style="font-size:18px;font-weight:800">Who is playing?</div>'+
     '<button data-m="'+alt[0]+'" style="'+bs+'border:1px solid #2c8c80;background:rgba(76,240,224,.14);color:#4cf0e0">'+alt[1]+'</button>'+
     '<button data-m="pnp" style="'+bs+'border:1px solid #3a434e;background:rgba(255,255,255,.05);color:#ebedef">Pass and play</button>'+
     '<div style="margin-top:12px;font-size:12px;opacity:.6">Two players, one phone.</div></div>';
   ov.addEventListener('click',function(e){var t=e.target.closest('[data-m]');if(!t)return;ov.remove();go(t.getAttribute('data-m'));});
   document.body.appendChild(ov);
 }, sync:function(){}, statsButton:function(){},
 players:function(){return [];},
 recordGame:function(key,rec){try{var k='gnl_'+key,a=JSON.parse(localStorage.getItem(k)||'[]');a.push(rec);if(a.length>200)a=a.slice(-200);localStorage.setItem(k,JSON.stringify(a));}catch(e){}},
 readGames:function(key){try{return JSON.parse(localStorage.getItem('gnl_'+key)||'[]');}catch(e){return [];}},
 confirmEnd:function(msg,onYes,onNo){var ok=window.confirm(msg);if(ok){if(typeof onYes==='function')onYes();}else if(typeof onNo==='function'){onNo();}},
 rulesButton:function(el,spec){
   if(!el)return;var b=document.createElement('button');b.textContent='Rules';
   b.style.cssText='margin:6px;padding:9px 16px;border-radius:10px;border:1px solid #556;background:rgba(255,255,255,.06);color:inherit;font:inherit;cursor:pointer';
   b.addEventListener('click',function(){
     var ov=document.createElement('div');
     ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(5,7,10,.93);overflow:auto;padding:26px 18px 40px;color:#e8e8ea;line-height:1.55;font-family:inherit';
     var h='<div style="max-width:560px;margin:0 auto">';
     h+='<h2 style="font-size:22px;margin:0 0 14px">'+((spec&&spec.title)||'Rules')+'</h2>';
     ((spec&&spec.sections)||[]).forEach(function(s){
       if(typeof s==='string'){h+='<p style="margin:0 0 12px">'+s+'</p>';return;}
       if(s.h)h+='<h3 style="font-size:15px;margin:16px 0 6px;color:#9fe8dd">'+s.h+'</h3>';
       if(s.svg)h+='<div style="margin:8px 0">'+s.svg+'</div>';
       if(s.t)h+='<p style="margin:0 0 8px;font-size:14px">'+s.t+'</p>';
       if(s.ex)h+='<p style="margin:0 0 8px;font-size:13px;font-style:italic;opacity:.8">'+s.ex+'</p>';
     });
     h+='<div><button id="gnRulesClose" style="margin-top:16px;padding:11px 22px;border-radius:10px;border:1px solid #2c8c80;background:rgba(76,240,224,.12);color:#4cf0e0;font:inherit;cursor:pointer">Close</button></div></div>';
     ov.innerHTML=h;document.body.appendChild(ov);
     ov.querySelector('#gnRulesClose').addEventListener('click',function(){ov.remove();});
   });
   el.appendChild(b);
 }
};
(function(){
// ---- shared 3D cube die ----
const CUBE_RING={1:[2,3],2:[1,4],3:[1,2],4:[1,5],5:[1,3],6:[2,4]};
const CUBE_PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
let _cubeCSS=false;
function cubeCSSOnce(){if(_cubeCSS)return;_cubeCSS=true;
  const st=document.createElement("style");
  st.textContent=
   ".gnCubeWrap{position:relative;perspective:520px;will-change:transform;display:inline-block;}"+
   ".gnCube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;transform:rotateX(-9deg) rotateY(11deg);}"+
   ".gnCf{position:absolute;inset:0;border-radius:11%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11%;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(120,100,60,.25);}"+
   ".gnCfF{background:linear-gradient(150deg,#fbf8ef 0%,#efe9da 65%,#ded6c2 100%);transform:translateZ(var(--dh));}"+
   ".gnCfT{background:linear-gradient(150deg,#ffffff 0%,#f8f4ea 70%,#ece5d4 100%);transform:rotateX(90deg) translateZ(var(--dh));}"+
   ".gnCfR{background:linear-gradient(150deg,#e2dac6 0%,#d2c8b0 70%,#bfb499 100%);transform:rotateY(90deg) translateZ(var(--dh));}"+
   ".gnCf i{border-radius:50%;background:radial-gradient(circle at 38% 32%,#3a4458,#10151f 70%);visibility:hidden;box-shadow:inset 0 1.5px 2px rgba(0,0,0,.55),0 .5px 0 rgba(255,255,255,.35);}"+
   ".gnCubeBust .gnCfF{background:linear-gradient(150deg,#f3b3ac 0%,#e2887e 65%,#cb6a60 100%);}"+
   ".gnCubeBust .gnCfT{background:linear-gradient(150deg,#f8c5bf 0%,#eda49b 70%,#dd9088 100%);}"+
   ".gnCubeBust .gnCf i{background:radial-gradient(circle at 38% 32%,#fff,#f3e0dd 70%);}"+
   ".gnCubeShadow{position:absolute;left:8%;right:8%;bottom:-12%;height:18%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);}";
  document.head.appendChild(st);}
GN.cubeDie=function(size){cubeCSSOnce();
  const wrap=document.createElement("div");wrap.className="gnCubeWrap";
  wrap.style.width=size+"px";wrap.style.height=size+"px";
  wrap.style.setProperty("--dh",(size/2)+"px");
  const shadow=document.createElement("div");shadow.className="gnCubeShadow";wrap.appendChild(shadow);
  const cube=document.createElement("div");cube.className="gnCube";wrap.appendChild(cube);
  const faces={};
  for(const[cls,key]of[["gnCfF","F"],["gnCfT","T"],["gnCfR","R"]]){
    const f=document.createElement("div");f.className="gnCf "+cls;
    for(let i=0;i<9;i++)f.appendChild(document.createElement("i"));
    cube.appendChild(f);faces[key]=f;}
  function faceSet(f,v){const on=CUBE_PIPS[v]||[];
    [...f.children].forEach((p,i)=>{p.style.visibility=on.includes(i)?"visible":"hidden";});}
  function show(v){faceSet(faces.F,v);faceSet(faces.T,CUBE_RING[v][0]);faceSet(faces.R,CUBE_RING[v][1]);}
  let busyT=false;
  function tumble(finalV,opts,done){if(typeof opts==="function"){done=opts;opts={};}opts=opts||{};
    if(busyT)return;busyT=true;
    const dur=opts.duration||640,hop=opts.hop!==undefined?opts.hop:size*0.55;
    const sgn=()=>Math.random()<0.5?-1:1;
    const RX=sgn()*(360+Math.floor(Math.random()*2)*360),RY=sgn()*(360+Math.floor(Math.random()*2)*360);
    const drift=(Math.random()*2-1)*size*0.2;
    if(wrap.animate)wrap.animate([
      {transform:"translate(0,0) scale(1,1)"},
      {transform:"translate(0,"+(size*0.12)+"px) scale(1.1,0.74)",offset:0.12},
      {transform:"translate("+drift+"px,"+(-hop)+"px) scale(0.97,1.03)",offset:0.44,easing:"cubic-bezier(.2,.9,.4,1)"},
      {transform:"translate("+(drift*0.35)+"px,0) scale(1.08,0.88)",offset:0.7,easing:"cubic-bezier(.5,0,.8,.4)"},
      {transform:"translate(0,"+(-hop*0.15)+"px) scale(1,1)",offset:0.85},
      {transform:"translate(0,0) scale(1,1)"}],{duration:dur,easing:"linear"});
    if(cube.animate)cube.animate([
      {transform:"rotateX(-9deg) rotateY(11deg)"},
      {transform:"rotateX("+(-9+RX*0.55)+"deg) rotateY("+(11+RY*0.55)+"deg)",offset:0.45,easing:"cubic-bezier(.25,.8,.5,1)"},
      {transform:"rotateX("+(-9+RX)+"deg) rotateY("+(11+RY)+"deg)",offset:0.86,easing:"cubic-bezier(.3,.7,.4,1)"},
      {transform:"rotateX("+(-9+RX)+"deg) rotateY("+(11+RY)+"deg)"}],{duration:dur,easing:"linear"});
    let n=0;const steps=Math.max(6,Math.floor(dur/64));
    const iv=setInterval(()=>{show(1+Math.floor(Math.random()*6));
      if(++n>=steps){clearInterval(iv);show(finalV);busyT=false;if(done)done();}},Math.floor(dur/(steps+1)));}
  show(1);
  return{el:wrap,show,tumble,setBust:function(b){wrap.classList.toggle("gnCubeBust",!!b);}};};
})();
window.GN=GN;
document.addEventListener('click',function(e){
  var a=e.target&&e.target.closest?e.target.closest('a[href="index.html"]'):null;
  if(a){e.preventDefault();try{if(window.parent!==window){parent.history.back();return;}}catch(err){}try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return;}}catch(err){}window.location.href='index.html';}
},true);
})();
</script>
<script src="sfx.js?v=5"></script>
<script>
let P={top:{name:"Player 1",main:"#d8312b",light:"#f06a60",dark:"#8d1d19"},bot:{name:"Player 2",main:"#2f6fd0",light:"#6fa0ec",dark:"#194182"}};
let hands={top:[],bot:[]},line=[],yard=[],turn="bot",phase="play",passes=0,GS=null,pendingBone=null;
const KEY="dom_games";let _mem=[];
function S(n,o){window.GNS&&GNS.play(n,0,o);}
const Store={load(){try{return JSON.parse(localStorage.getItem(KEY))||[];}catch(e){return _mem.slice();}},
  save(l){try{localStorage.setItem(KEY,JSON.stringify(l));}catch(e){_mem=l.slice();}}};
function allBones(){const a=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)a.push([i,j]);return a;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function ends(){if(!line.length)return null;return{L:line[0].l,R:line[line.length-1].r};}
function fits(b){const e=ends();if(!e)return{L:true,R:true};
  return{L:b[0]===e.L||b[1]===e.L,R:b[0]===e.R||b[1]===e.R};}
function playable(b){const f=fits(b);return f.L||f.R;}
function pip(side){return hands[side].reduce((s,b)=>s+b[0]+b[1],0);}
function seatFrom(p){return{name:p.name,main:p.color,light:p.light,dark:p.dark};}
function newGame(){yard=shuffle(allBones());hands={top:yard.splice(0,7),bot:yard.splice(0,7)};line=[];passes=0;pendingBone=null;
  phase="over";
  GN.matchStart(function(m){P={top:seatFrom(m.a),bot:seatFrom(m.b)};
  turn=(m.first===m.a)?"top":"bot";phase="play";
  GS={start:Date.now(),flipWinner:m.first.name,draws:{},plays:{}};
  GS.draws[m.a.name]=0;GS.draws[m.b.name]=0;GS.plays[m.a.name]=0;GS.plays[m.b.name]=0;
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("endOv").classList.remove("show");
  document.getElementById("confetti").innerHTML="";
  updateBar();setMessage(P[turn].name+" won the flip \u2014 opens with any bone");renderAll();});}
function setMessage(t){document.getElementById("msg").textContent=t;}
function updateBar(){const pc=P[turn];document.getElementById("turnName").textContent=pc.name+"'s turn";
  const d=document.getElementById("dot");
  d.style.background="radial-gradient(circle at 35% 30%,"+pc.light+","+pc.main+" 70%,"+pc.dark+")";
  d.style.boxShadow="0 0 0 3px rgba(255,255,255,.15),0 0 14px "+pc.main;
  const g=Store.load();let m=0,k=0;for(const r of g){if(r.winner===P.top.name)m++;else if(r.winner===P.bot.name)k++;}
  document.getElementById("score").textContent=P.top.name+" "+m+" \u00b7 "+k+" "+P.bot.name+" \u00b7 boneyard "+yard.length;}
function boneEl(b,vert){const d=document.createElement("div");d.className="bone "+(vert?"v":"h");
  for(const v of b){const h=document.createElement("div");h.className="half";
    const ON={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]}[v];
    for(let i=0;i<9;i++){const p=document.createElement("i");if(ON.includes(i))p.style.visibility="visible";h.appendChild(p);}
    d.appendChild(h);}
  return d;}
function renderAll(){
  // line
  const ln=document.getElementById("line");ln.innerHTML="";
  for(const t of line){const el=boneEl([t.l,t.r],t.l===t.r);ln.appendChild(el);}
  if(!line.length){const ph=document.createElement("div");ph.style.cssText="color:#5f7d6b;font-size:13px;";ph.textContent="first bone lands here";ln.appendChild(ph);}
  // hands
  for(const s of["top","bot"]){const el=document.getElementById(s==="top"?"handTop":"handBot");el.innerHTML="";
    const who=document.createElement("div");who.className="who";
    who.textContent=P[s].name.toUpperCase()+" \u00b7 "+hands[s].length+" bones"+((s===turn&&phase==="play")||phase==="over"?" \u00b7 "+pip(s)+" pips":"");
    who.style.color=P[s].light;el.appendChild(who);
    hands[s].forEach((b,idx)=>{const mine=(s===turn&&phase==="play");
      const reveal=mine||phase==="over";
      if(!reveal){const bk=document.createElement("div");bk.className="boneback";el.appendChild(bk);return;}
      const be=boneEl(b,false);
      if(mine&&playable(b))be.classList.add("playable");else if(mine)be.classList.add("idle");
      if(mine)be.addEventListener("click",()=>tryPlay(idx));
      el.appendChild(be);});}
  document.getElementById("drawBtn").style.visibility=(phase==="play"&&!hands[turn].some(playable)&&yard.length)?"visible":"hidden";
  const wrap=document.getElementById("lineWrap");wrap.scrollLeft=wrap.scrollWidth;}
function orient(b,end){ // returns {l,r} tile oriented for that end
  const e=ends();
  if(!e)return{l:b[0],r:b[1]};
  if(end==="L"){const v=e.L;return(b[1]===v)?{l:b[0],r:b[1]}:{l:b[1],r:b[0]};}
  const v=e.R;return(b[0]===v)?{l:b[0],r:b[1]}:{l:b[1],r:b[0]};}
function tryPlay(idx){const b=hands[turn][idx];if(!playable(b))return;
  const f=fits(b),e=ends();
  if(!e){commit(idx,"R");return;}
  if(f.L&&f.R&&e.L!==e.R){ // genuine choice
    pendingBone=idx;const ov=document.getElementById("endOv"),ch=document.getElementById("endChoice");ch.innerHTML="";
    for(const end of["L","R"]){const btn=document.createElement("button");btn.className="act";
      btn.textContent=(end==="L"?"Left end ("+e.L+")":"Right end ("+e.R+")");
      btn.addEventListener("click",()=>{ov.classList.remove("show");commit(pendingBone,end);});ch.appendChild(btn);}
    ov.classList.add("show");return;}
  commit(idx,f.L?"L":"R");}
function commit(idx,end){const b=hands[turn].splice(idx,1)[0],t=orient(b,end);
  if(end==="L")line.unshift(t);else line.push(t);
  GS.plays[P[turn].name]++;passes=0;
  if(!hands[turn].length){gameOver(turn,"Domino! Empty hand");return;}
  nextTurn();}
function nextTurn(){turn=turn==="top"?"bot":"top";checkStuck();}
function checkStuck(){updateBar();
  if(hands[turn].some(playable)){setMessage(P[turn].name+" \u2014 tap a glowing bone");renderAll();return;}
  if(yard.length){setMessage(P[turn].name+" can't play \u2014 draw from the boneyard");renderAll();return;}
  passes++;setMessage(P[turn].name+" passes (nothing fits)");renderAll();
  if(passes>=2){blockedEnd();return;}
  setTimeout(nextTurn,900);}
function drawBone(){if(phase!=="play"||!yard.length||hands[turn].some(playable))return;
  hands[turn].push(yard.pop());GS.draws[P[turn].name]++;
  setMessage(P[turn].name+" draws...");checkStuck();}
function blockedEnd(){const m=pip("top"),k=pip("bot");
  const winSide=m<k?"top":k<m?"bot":null;
  finish(winSide,"Blocked \u2014 "+P.top.name+" "+m+" pips, "+P.bot.name+" "+k,true);}
function gameOver(winSide,why){finish(winSide,why);}
function finish(winSide,why,wasBlocked){phase="over";
  const rec={start:GS.start,end:Date.now(),durationMs:Date.now()-GS.start,
    winner:winSide?P[winSide].name:null,loser:winSide?P[winSide==="top"?"bot":"top"].name:null,
    draw:!winSide,flipWinner:GS.flipWinner,blocked:wasBlocked,pips:(function(){const s={};s[P.top.name]=pip("top");s[P.bot.name]=pip("bot");return s;})(),plays:GS.plays,draws:GS.draws};
  GN.recordGame(KEY,rec);
  document.getElementById("ovTitle").textContent=winSide?P[winSide].name+" wins!":"Dead tie!";
  document.getElementById("ovTitle").style.color=winSide?P[winSide].main:"#e8f0e4";
  document.getElementById("ovTrophy").textContent=winSide?"\uD83C\uDFC6":"\uD83E\uDD1D";
  document.getElementById("ovText").textContent=why;
  if(winSide)spawnConfetti(winSide);updateBar();
  setTimeout(()=>{S("fanfare");document.getElementById("overlay").classList.add("show");},500);}
function spawnConfetti(side){const box=document.getElementById("confetti");box.innerHTML="";const pc=P[side];
  const cols=[pc.main,pc.light,"#f4c542","#ffffff"];
  for(let i=0;i<90;i++){const d=document.createElement("div");d.className="cfp";
    d.style.left=(Math.random()*100)+"%";d.style.background=cols[i%cols.length];
    d.style.animationDuration=(2.4+Math.random()*1.8)+"s";d.style.animationDelay=(Math.random()*0.9)+"s";
    d.style.transform="rotate("+Math.floor(Math.random()*360)+"deg)";box.appendChild(d);}}
document.getElementById("newBtn").addEventListener("click",newGame);
GN.rulesButton(document.getElementById("foot"),{title:"Dominoes",sections:[
 {h:"Goal",t:"Be first to play every tile in your hand \u2014 or be caught holding the fewest pips when the game blocks."},
 {h:"Setup & the line",t:"Each player draws 7 tiles. Tiles join end-to-end: a tile may be played only where its number MATCHES the open end of the line. Doubles sit crosswise.",
  ex:"The line's open ends show 3 and 5. Your 5-2 plays on the 5 end \u2014 now the ends are 3 and 2."},
 {h:"Can't play?",t:"Draw from the boneyard until you CAN play. If the boneyard is empty and you still can't move, you pass."},
 {h:"Going out & blocking",t:"Play your last tile \u2014 \u201cdomino!\u201d \u2014 and you win the hand. If NOBODY can play and the boneyard's dry, the hand is blocked: lowest pip total in hand wins it."},
 {h:"Reading the bones",t:"There are seven of each number in the set. Count what's on the table: if five 6s are down and you hold the sixth, only one 6 remains anywhere \u2014 steering the line toward numbers you control is how sharks play.",
  ex:"You hold 6-4 and 6-1, and four 6s are already on the table. Force a 6 end and odds are they'll be drawing."}]});
GN.statsButton(document.getElementById("foot"),{title:"Dominoes",key:KEY,specials:[
  {label:"Blocked-game wins",of:(r,n)=>r.filter(x=>x.winner===n&&x.blocked).length},
  {label:"Bones drawn",of:(r,n)=>r.reduce((a,x)=>a+((x.draws&&x.draws[n])||0),0)},
  {label:"Coin flips won",of:(r,n)=>r.filter(x=>x.flipWinner===n).length}]});
if(window.GNS)GNS.button(document.getElementById("foot"));
document.getElementById("ovBtn").addEventListener("click",newGame);
document.getElementById("drawBtn").addEventListener("click",drawBone);
newGame();
</script>
