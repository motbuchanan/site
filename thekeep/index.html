*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#030203;color:#e9dcc8;font-family:cinzel,Georgia,serif;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;overflow:hidden;background:#050304}
#bg{position:absolute;inset:0;pointer-events:none}
#bg svg{width:100%;height:100%;display:block}
.ash{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ash i{position:absolute;top:-10px;width:3px;height:3px;border-radius:50%;background:#e8c7b0;opacity:.45;animation:fall linear infinite}
@keyframes fall{to{transform:translate(30px,105vh)}}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
@keyframes pulse{0%,100%{opacity:.85}50%{opacity:1}}
.fogdrift{animation:drift 14s ease-in-out infinite alternate}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
/* title */
#title{align-items:center;justify-content:flex-end;padding:0 24px calc(60px + env(safe-area-inset-bottom));text-align:center}
.logo{font-family:cinzeldec;font-size:clamp(34px,10vw,46px);letter-spacing:2px;color:#f1e6d2;text-shadow:0 0 18px #b3182a,0 0 40px rgba(179,24,42,.5),0 3px 3px #000;line-height:1}
.tagline{font-family:fell;font-style:italic;font-size:16px;color:#c9b7a2;margin:10px 0 34px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border:1px solid #8a6f4a;background:linear-gradient(#2a1418,#120608);color:#f1e6d2;font-size:14px;letter-spacing:2px;text-transform:uppercase;box-shadow:0 0 0 2px #000,inset 0 0 14px rgba(0,0,0,.8)}
.btn:active{transform:translateY(1px);filter:brightness(1.2)}
.btn.blood{border-color:#d9a441;background:linear-gradient(#7a0c1a,#3a050c);box-shadow:0 0 0 2px #000,0 0 18px rgba(179,24,42,.45)}
.btn.small{min-height:38px;padding:0 14px;font-size:11px;letter-spacing:1px}
.btn[disabled]{opacity:.4;filter:grayscale(.6);pointer-events:none}
.btn.wide{width:100%}
.ghost{background:none;border:none;color:#a99;font-family:fell;font-style:italic;font-size:14px;margin-top:14px;min-height:40px}
/* hub */
#hub .topbar{position:relative;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px;background:linear-gradient(#000c,#0000)}
.cur{display:flex;align-items:center;gap:5px;font-size:12px;letter-spacing:.5px;color:#e9dcc8;padding:5px 9px;border:1px solid #3a2a20;background:rgba(0,0,0,.55)}
.cur svg{width:15px;height:15px}
.gear{margin-left:auto;flex:none;width:40px;height:40px;border:1px solid #3a2a20;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;position:relative}
.gear svg{width:20px;height:20px}
.dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#e0334a;box-shadow:0 0 6px #e0334a}
.panel{flex:1;overflow-y:auto;padding:4px 14px 18px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;border-top:1px solid #3a2a20;background:linear-gradient(#0d0709,#050304);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;min-height:60px;background:none;border:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9.5px;letter-spacing:1.5px;color:#8a7a68;position:relative}
.tab .r{font-family:serif;font-size:22px;line-height:22px;color:#6b5a44}
.tab.on{color:#f1e6d2}.tab.on .r{color:#e0334a;text-shadow:0 0 10px #b3182a}
.tab.on:before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:#e0334a;box-shadow:0 0 8px #e0334a}
.tab .dot{top:8px;right:28%}
h2{font-family:cinzeldec;font-weight:700;font-size:20px;letter-spacing:1.5px;margin:6px 0 2px;color:#f1e6d2;text-shadow:0 0 10px rgba(179,24,42,.6)}
.sub{font-family:fell;font-style:italic;font-size:14px;color:#a99;margin:0 0 12px}
.box{border:1px solid #4a3a2c;background:linear-gradient(rgba(26,16,20,.88),rgba(10,6,8,.92));box-shadow:inset 0 0 18px #000;padding:12px;margin-bottom:12px;position:relative}
.box.locked{opacity:.55}
/* saga */
.realm .rname{font-family:cinzeldec;font-size:16px;letter-spacing:1px}
.realm .rsub{font-family:fell;font-style:italic;font-size:13px;color:#a99;margin:2px 0 10px}
.path{display:flex;align-items:center;gap:0}
.node{flex:none;width:52px;height:52px;border:1px solid #6b5a44;background:radial-gradient(circle at 50% 40%,#2a1418,#0a0608);display:flex;align-items:center;justify-content:center;font-size:20px;font-family:serif;color:#8a7a68;transform:rotate(45deg)}
.node span{transform:rotate(-45deg)}
.node.done{border-color:#6aa36f;color:#9fd8a0}
.node.next{border-color:#d9a441;color:#f0c060;box-shadow:0 0 14px rgba(217,164,65,.5);animation:pulse 1.6s infinite}
.node.boss{width:60px;height:60px;border-color:#b3182a;color:#e0334a}
.node.boss.next{border-color:#e0334a;box-shadow:0 0 18px rgba(224,51,74,.6)}
.node.lock{opacity:.35}
.link{flex:1;height:2px;background:repeating-linear-gradient(90deg,#4a3a2c 0 6px,transparent 6px 10px);min-width:6px}
.lockmsg{font-family:fell;font-style:italic;font-size:13px;color:#8a7a68}
/* warriors */
.squad{display:flex;gap:8px;margin-bottom:12px}
.slot{flex:1;aspect-ratio:110/128;border:1px dashed #6b5a44;background:rgba(0,0,0,.4);position:relative;overflow:hidden}
.slot.filled{border-style:solid;border-color:#d9a441}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.wcard{border:1px solid #4a3a2c;background:linear-gradient(#1a1014,#0a0608);position:relative;aspect-ratio:110/150;overflow:hidden;padding:0;text-align:center}
.wcard svg.art,.slot svg.art{position:absolute;left:0;right:0;top:0;width:100%;height:78%}
.wcard .nm,.slot .nm{position:absolute;left:0;right:0;bottom:20px;font-size:11px;letter-spacing:1px;text-shadow:0 1px 2px #000}
.wcard .lv,.slot .lv{position:absolute;left:0;right:0;bottom:6px;font-size:9px;color:#c9b38f;letter-spacing:1px}
.wcard.locked .art{opacity:.25;filter:grayscale(1)}
.wcard .tagx{position:absolute;top:5px;left:5px;font-size:8px;letter-spacing:1px;padding:2px 5px;background:#7a0c1a;color:#fff}
.wcard .tagx.gold{background:#8a6a20}
/* village */
.pips{display:flex;gap:4px;margin:6px 0}
.pip{width:14px;height:14px;transform:rotate(45deg);border:1px solid #6b5a44;background:#120608}
.pip.on{background:#d9a441;border-color:#f0c060;box-shadow:0 0 6px rgba(217,164,65,.6)}
.brow{display:flex;gap:10px;align-items:flex-start}

.shake{animation:scrshake .4s}

#ultflash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:40;background:radial-gradient(circle,rgba(179,24,42,.45),rgba(0,0,0,.75))}

textarea{-webkit-user-select:text;user-select:text;width:100%;min-height:80px;background:#0a0608;border:1px solid #4a3a2c;color:#e9dcc8;font-family:monospace;font-size:12px;padding:8px}

/* v1.2 game feel */
.card.windup{transform:translateY(-16px) scale(1.06);border-color:#f0c060;box-shadow:0 0 22px rgba(240,192,96,.7),inset 0 0 18px #000;transition:transform .18s ease-out}
.foe .fart{transition:transform .25s ease-out,filter .25s}
.foe.windup .fart{transform:scale(1.08) translateY(6px);filter:drop-shadow(0 0 10px #ff2a3a) drop-shadow(0 0 22px #b3182a)}
.foe.hit .fart{animation:hitf2 .42s ease-out}
@keyframes hitf2{0%{filter:brightness(4) saturate(0);transform:translate(0,0) scale(1)}25%{transform:translate(0,-14px) scale(.94) rotate(-2deg)}60%{transform:translate(0,4px) scale(1.02) rotate(1deg)}100%{filter:none;transform:none}}
.card.hit{animation:chit .42s ease-out}

.card.lunge{animation:hlunge2 .32s ease-out}

.foe.lunge .fart{animation:flunge2 .36s ease-in}
@keyframes flunge2{0%{transform:scale(1.08) translateY(6px)}50%{transform:scale(1.16) translateY(30px)}100%{transform:none}}
.slash{position:absolute;width:150px;height:6px;margin:-3px 0 0 -75px;pointer-events:none;z-index:31;border-radius:3px;background:linear-gradient(90deg,transparent,var(--c),#fff,var(--c),transparent);box-shadow:0 0 14px var(--c),0 0 30px var(--c);transform:rotate(var(--rot)) scaleX(0);animation:slashin .5s ease-out forwards}

@keyframes slashin{0%{transform:rotate(var(--rot)) scaleX(0);opacity:1}35%{transform:rotate(var(--rot)) scaleX(1.05);opacity:1}100%{transform:rotate(var(--rot)) scaleX(1.1);opacity:0}}
.spark{position:absolute;width:5px;height:5px;margin:-2px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);pointer-events:none;z-index:31;animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
#hurtflash{position:absolute;inset:0;pointer-events:none;z-index:29;opacity:0;background:radial-gradient(ellipse at 50% 80%,transparent 35%,rgba(200,10,30,.55))}

.shakebig{animation:scrshake2 .5s}
@keyframes scrshake2{10%{transform:translate(-10px,5px) rotate(-.6deg)}25%{transform:translate(10px,-6px) rotate(.6deg)}40%{transform:translate(-8px,3px)}55%{transform:translate(6px,-3px)}70%{transform:translate(-3px,2px)}85%{transform:translate(2px,-1px)}}

@media (prefers-reduced-motion:reduce){.slash,.spark{display:none}.shakebig,.shake{animation:none}.card.windup,.foe.windup .fart{transform:none}.card.hit,.card.lunge,.foe.hit .fart,.foe.lunge .fart{animation:none}.floatn.rune{animation:floatup .9s ease-out forwards}#hurtflash.on{animation-duration:.25s;opacity:.4}}

const STAGES = 4; // 3 fights + boss

function realmFactor(r, s){ return Math.pow(1 + 0.9 * r, 1.45) * (1 + 0.13 * s); }

function makeFoe(r, s, def, boss, mult){
 const f = realmFactor(r, s) * (mult||1);
 const u = boss ? {hp:860*f, atk:31*f, def:10+7*r, spd:8} : {hp:235*f, atk:26*f, def:6+6*r, spd:6+Math.floor(rnd()*8)};
 return {uid:'e'+Math.random().toString(36).slice(2,8), side:'foe', name:def.n, title:def.t||'', shape:def.shape, boss:!!boss,
  sig:def.sig, sigDesc:def.sigDesc, realm:r,
  max:Math.round(u.hp), hp:Math.round(u.hp), atk:Math.round(u.atk), def:Math.round(u.def), spd:u.spd,
  rage:0, cds:{}, buffs:[], alive:true, turns:0, trick:boss ? null : (TRICKS[def.shape] || null), affix:null};
}
function makeElite(f, id){
 if (f.affix || f.boss) return f;
 const a = AFFIXES.find(x => x.id === id) || pick(AFFIXES);
 f.affix = a.id; f.name = a.n + ' ' + f.name;
 if (a.id === 'armored') f.def *= 2;
 if (a.id === 'frenzied'){ f.spd += 4; f.atk = Math.round(f.atk * 1.2); }
 if (a.id === 'vampiric') f.leech = .3;
 if (a.id === 'hulking'){ f.max = Math.round(f.max * 1.6); f.hp = f.max; }
 return f;
}
function sprinkleElites(list, r, chance){ list.forEach(f => { if (!f.boss && r >= 1 && rnd() < chance) makeElite(f); }); return list; }

function encounter(r, s){
 const R = REALMS[r];
 if (s === STAGES - 1){
  const list = [makeFoe(r, s, R.boss, true)];
  if (r >= 2) list.push(makeFoe(r, s, pick(R.foes), false, 0.8));
  return sprinkleElites(list, r, 0.3);
 }
 const n = s === 0 ? 2 : 3;
 const list = [];
 for (let i = 0; i < n; i++) list.push(makeFoe(r, s, R.foes[(s + i) % R.foes.length], false));
 return sprinkleElites(list, r, 0.25);
}

function makeItem(slot, tier, rng, bias, forceR){

  const allies = this.alliesOf(u), foes = this.enemiesOf(u);
  const [b, sp, ul] = u.skills;
  if (!foes.length) return {sid:b, tuid:null};
  const minPct = Math.min(...allies.map(a => a.hp / a.max));
  const anyDead = this.side(u.side).some(h => !h.alive && !h.troop);
  if (!sp) return {sid:b, tuid:foes.slice().sort((a, c) => a.hp - c.hp)[0].uid};
  const bossUp = foes.some(f => f.boss);
  let sid = b;
  const ultOk = this.canUse(u, ul) && !hasBuff(u, 'blind') && !((ul === 'norns' && minPct > 0.75) || (ul === 'ballad' && !anyDead && minPct > 0.7));
  const spOk = this.canUse(u, sp) && !(sp === 'mend' && minPct > 0.7) && !(sp === 'shieldwall' && minPct > 0.8 && !bossUp) && !(sp === 'boneward' && minPct > 0.75 && !bossUp);
  if (ultOk) sid = ul; else if (spOk) sid = sp;
  // focus the lowest-health foe
  const tgt = foes.slice().sort((a, c) => a.hp - c.hp)[0];
  return {sid, tuid:tgt.uid};
 }
 foeAct(f){
  const ev = [];
  if (f.boss && !hasBuff(f, 'enrage') && f.hp < f.max * 0.5){ addBuff(f, 'enrage', 1, 999); ev.push({t:'enrage', u:f.uid}); }
  const al = this.alive('hero'); if (!al.length) return ev;
  if (f.boss && f.turns % 3 === 0){
   ev.push({t:'act', u:f.uid, sid:'sig', name:f.sig, kind:'sig'});
   al.forEach(h => this.dmg(f, h, 0.75, ev, {big:true}));
   if (f.sig === 'Half-Death') this.heal(f, f, f.max * 0.04, ev);
  } else if (f.trick && !this.noTricks && f.turns % 3 === 2 && rnd() < 0.75){
   const T = f.trick;
   ev.push({t:'act', u:f.uid, sid:'trick', name:T.n, kind:'trick'});
   if (T.aoe) al.forEach(h => this.dmg(f, h, T.aoe, ev));
   else {
    const h = this.foeTarget(f); const d = this.dmg(f, h, T.mult || 1, ev);

   }
  } else {
   ev.push({t:'act', u:f.uid, sid:'atk', name:'Attack', kind:'basic'});
   this.dmg(f, this.foeTarget(f), f.boss ? 1.15 : 1, ev);
  }
  return ev;
 }

function loot(r, s, raid){
 const boss = s === STAGES - 1;
 const base = 70 * Math.pow(1.8, r) * (1 + 0.2 * s);
 const o = {silver:Math.round(base * (boss ? 3 : 1)), iron:Math.round((8 + 8 * r) * (boss ? 4 : 1)), runes: boss ? 12 + 6 * r : 2 + r, xp:0};
 if (raid){ o.silver *= 2; o.iron *= 2; o.runes = Math.round(o.runes * 1.5); }
 return o;
}

}

  {t:'The Village', p:`<div class="mrow"><svg viewBox="-50 -55 100 90" width="110" height="96">${ART.building('hall', 3)}</svg></div>`, l:['Tap any <b>building</b> on the map.', 'The <b>Jarl\'s Hall</b> caps every other level.', 'Collect what it <b>earns</b> while you are away.']},
  {t:'Troops', p:`<div class="mrow"><span class="mcard" style="width:90px">${ART.band('spear')}</span><span class="mcard" style="width:90px">${ART.band('bow')}</span></div>`, l:['Train troops in the <b>War Camp</b>.', '<b>Skirmish Band</b> fights beside your squad.', '<b>Garrison</b> stays home and defends.']},
  {t:'Night Raids', p:`<div class="mrow"><svg viewBox="-50 -55 100 90" width="90" height="80">${ART.building('tower', 3)}</svg><svg viewBox="-50 -40 100 70" width="90" height="70">${ART.building('pits', 3)}</svg></div>`, l:['Every <b>8 hours</b> the dead come. Tap <b>Defend</b>.', '<b>Walls, towers, pits</b> and Garrison fight back.', 'Lose and they <b>empty your coffers</b>.']},
  {t:'Warband & Arena', p:`<div class="mrow"><span class="mb gold">&#5835;<small>BOSS</small></span><span class="mb">&#5854;<small>ARENA</small></span></div>`, l:['<b>Boss</b>: 8 rounds, hit as hard as you can.', '<b>Arena</b>: raid a friend\'s village.', '<b>Join</b> with your group\'s code in War.']},
  {t:'Raids', p:`<div class="mrow">${[1, 2, 3, 4].map(() => '<span class="mpip on"></span>').join('')}<span class="mpip boss"></span></div>`, l:['<b>Five waves</b> in a row.', 'Wounds carry over. <b>Double silver and iron</b>.', 'Keep everything you earned.']},
  {t:'Every Day', p:`<div class="mrow"><span class="mb gold">&#5835;<small>BLESSING</small></span><span class="mb">${ART.ICON.book}<small>JOURNAL</small></span></div>`, l:['Your <b>first win</b> each day pays extra.', 'The <b>Journal</b> holds lore, relics, deeds.', 'Missing a day costs nothing.']},
  {t:'Stuck?', p:`<div class="mrow"><span class="mb">&#8635;<small>REPLAY</small></span><span class="mb">&#8679;<small>LEVEL</small></span><span class="mb">&#5839;<small>FORGE</small></span></div>`, l:['Replay old fights for <b>silver</b>.', 'Level your <b>weakest</b> warrior.', 'Bring a <b>healer</b> to bosses.']},
 ];
}
function howSheet(start){
 const C = mini(); let i = (typeof start === 'number' && start >= 0 && start < C.length) ? start : 0;
 const draw = () => {
  const c = C[i];
  const html = `<button class="btn small close" id="xs">Close</button><div class="how" id="howCard">
   <div class="hpic">${c.p}</div><h3>${c.t}</h3><ul>${c.l.map(x => `<li>${x}</li>`).join('')}</ul>
   <div class="hdots">${C.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('')}</div>
   <div class="row" style="justify-content:space-between"><button class="btn small" id="hPrev" ${i ? '' : 'disabled'}>Back</button><span class="lockmsg">${i + 1} of ${C.length}</span><button class="btn small blood" id="hNext">${i < C.length - 1 ? 'Next' : 'Done'}</button></div></div>`;
  const open = $('#veil').classList.contains('on') && $('#veil .howsheet');
  if (open){ open.innerHTML = html; } else { sheet(html, 'howsheet'); if (!i) Whisper.seerLie(); }
  $('#xs').onclick = closeSheet;
  $('#hPrev').onclick = () => { if (i){ i--; sfx('tap'); draw(); } };
  $('#hNext').onclick = () => { sfx('tap'); if (i < C.length - 1){ i++; draw(); } else closeSheet(); };
  const card = $('#howCard'); let x0 = null;
  let y0 = 0;
  card.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  card.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null; if (Math.abs(dx) < Math.abs(dy) * 1.3) return; if (dx < -45 && i < C.length - 1){ i++; sfx('tap'); draw(); } else if (dx > 45 && i){ i--; sfx('tap'); draw(); } });
 };
 draw();
}
function copyBackup(){
 const code = 'RVM1.' + btoa(unescape(encodeURIComponent(JSON.stringify(S))));
 const done = () => toast('Backup code copied. Paste it somewhere safe, like a note.');
 if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, () => showCode(code)); else showCode(code);
}
function showCode(code){ sheet(`<button class="btn small close" id="xs">Close</button><h3>Backup code</h3><p>Press and hold to copy all of it.</p><textarea readonly>${code}</textarea>`); $('#xs').onclick = closeSheet; }
function restoreSheet(){
 sheet(`<button class="btn small close" id="xs">Close</button><h3>Restore</h3><p>Paste a backup code. This replaces your current progress.</p><textarea id="rsTxt" placeholder="RVM1..."></textarea><button class="btn blood wide" id="rsGo" style="margin-top:10px">Restore</button>`);
 $('#xs').onclick = closeSheet;
 $('#rsGo').onclick = () => {
  try { const t = $('#rsTxt').value.trim(); if (!t.startsWith('RVM1.')) throw 0; const o = JSON.parse(decodeURIComponent(escape(atob(t.slice(5))))); S = migrate(o); ensureLayout(S); save(); closeSheet(); toast('Saga restored.'); toHub('saga'); }
  catch (e) { toast('That code did not work. Check that all of it was pasted.'); }
 };
}
function whatsNew(force){
 const seen = S.seenVer;
 const list = force ? CHANGELOG : CHANGELOG.filter(c => vNum(c.v) > vNum(seen));
 S.seenVer = VERSION; save();
 if (!list.length) return false;
 sheet(`<button class="btn small close" id="xs">Close</button><h3>${force ? 'Chronicle of changes' : 'A new chapter'}</h3>${list.map(c => `<h4 style="font-family:cinzeldec;color:#f0c060;margin:12px 0 2px">Version ${c.v} · ${c.d}</h4><ul style="margin:0;padding-left:18px">${c.notes.map(n => `<li>${n}</li>`).join('')}</ul>`).join('')}`);
 $('#xs').onclick = closeSheet; return true;
}
function vNum(v){ const p = String(v).split('.').map(Number); return (p[0] || 0) * 10000 + (p[1] || 0) * 100 + (p[2] || 0); }

// ---------- INSTALL ----------
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; renderTopSafe(); });
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function installable(){ return !isStandalone() && (!!deferredPrompt || isIOS()); }
function installFlow(){
 if (deferredPrompt){ deferredPrompt.prompt(); deferredPrompt.userChoice.finally(() => { deferredPrompt = null; closeSheet(); }); return; }
 sheet(`<button class="btn small close" id="xs">Close</button><h3>Install Ravenmarrow</h3><p>On iPhone, in Safari:</p><ol><li>Tap the <b>Share</b> button (the square with an arrow pointing up).</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b>.</li></ol><p>Ravenmarrow then opens full screen from its own icon, works without signal, and updates itself when a new chapter is ready.</p><p class="lockmsg">On Android, in Chrome: tap the three dots, then <b>Install app</b> or <b>Add to Home screen</b>.</p>`);
 $('#xs').onclick = closeSheet;
}
function maybeInstallNudge(){ if (installable() && !S.set.nudged){ S.set.nudged = true; save(); const b = $('#banner'); b.querySelector('.t').textContent = 'Put Ravenmarrow on your home screen. It plays offline and updates itself.'; b.querySelector('.go').textContent = 'Install'; b.querySelector('.go').onclick = () => { b.classList.remove('on'); installFlow(); }; b.classList.add('on'); setTimeout(() => b.classList.remove('on'), 12000); } }
function renderTopSafe(){ if ($('#hub').classList.contains('on')) renderTop(); }

// ---------- UPDATES ----------
const UPD = {reg:null, ready:false};
function updateBanner(){
 UPD.ready = true; renderTopSafe();
 const b = $('#banner'); b.querySelector('.t').textContent = 'A new chapter of Ravenmarrow has arrived.'; b.querySelector('.go').textContent = 'Update';
 b.querySelector('.go').onclick = applyUpdate; b.classList.add('on');
}
function applyUpdate(){
 save();
 const w = UPD.reg && UPD.reg.waiting;
 if (w){ w.postMessage('skipWaiting'); setTimeout(() => location.reload(), 1500); }
 else location.reload();
}
async function checkUpdate(manual){
 // 1) ask the service worker to look for a new version
 if (UPD.reg){ try { await UPD.reg.update(); } catch (e) {} if (UPD.reg.waiting){ updateBanner(); if (manual) toast('A new chapter is ready.'); return; } }
 // 2) compare the live page's build number with this one
 try {
  const r = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'}); const t = await r.text();
  const m = t.match(/<meta name="build" content="([^"]+)"/);
  if (m && m[1] !== VERSION){ if (vNum(m[1]) > vNum(VERSION)){ updateBanner(); if (manual) toast('Version ' + m[1] + ' is ready.'); return; } }
  if (manual) toast('You have the newest chapter (' + VERSION + ').');
 } catch (e) { if (manual) toast('Could not reach the update server. Try again with signal.'); }
}
function initSW(){
 if (!('serviceWorker' in navigator) || location.protocol !== 'https:') return;
 const hadCtrl = !!navigator.serviceWorker.controller;
 navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(reg => {
  UPD.reg = reg;
  if (reg.waiting && navigator.serviceWorker.controller) updateBanner();
  reg.addEventListener('updatefound', () => { const nw = reg.installing; if (!nw) return; nw.addEventListener('statechange', () => { if (nw.state === 'installed' && navigator.serviceWorker.controller) updateBanner(); }); });
 }).catch(() => {});
 let reloaded = false;
 navigator.serviceWorker.addEventListener('controllerchange', () => { if (reloaded || !hadCtrl) return; reloaded = true; location.reload(); });
 setInterval(() => checkUpdate(false), 30 * 60 * 1000);
 document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible'){ checkUpdate(false); renderTopSafe(); } });
 setTimeout(() => checkUpdate(false), 4000);
}

// ---------- BOOT ----------
function boot(){
 // ash
 $('#ash').innerHTML = Array.from({length:26}, () => `<i style="left:${Math.random() * 100}%;animation-duration:${8 + Math.random() * 10}s;animation-delay:${-Math.random() * 18}s;opacity:${.2 + Math.random() * .4}"></i>`).join('');
 $('#ravenMark').innerHTML = ART.raven();
 $('#gearBtn').innerHTML = ART.ICON.gear + '<span class="dot" id="gearDot"></span>';
 ATMO.init();
 Whisper.init();
 Help.init();
 setBG(0);
 if (!S.set.introSeen) Intro.play(); else titleReveal();
 $('#startBtn').textContent = S.tut.done || S.stats.wins ? 'Continue the saga' : 'Begin the saga';
 $('#startBtn').onclick = () => { ac(); sfx('boss'); Whisper.onOpen(); setTimeout(() => Vision.pending(), 2500); if (S.set.music) musicOn(); showScreen('hub'); go('saga'); setTimeout(() => { if (!S.tut.done) Coach.intro(); else whatsNew(false); }, 350); setTimeout(checkDeeds, 600); };
 $('#howTitle').onclick = () => { ac(); howSheet(); };
 $('#introTitle').onclick = () => { ac(); Intro.play(); };
 $$('.tab').forEach(t => t.onclick = () => { sfx('tap'); go(t.dataset.tab); });
 $('#gearBtn').onclick = () => { sfx('tap'); settingsSheet(); };
 $('#bookBtn').innerHTML = ART.ICON.book; $('#bookBtn').onclick = () => { sfx('tap'); journalSheet(); };

 $('#fleeB').onclick = () => { FLEE = true; if (PICK){ const r = PICK; PICK = null; r({sid:'strike'}); } };
 $$('#autoT button').forEach(b => b.onclick = () => setAuto(b.dataset.m === 'auto'));
 $('#speedB').onclick = () => { S.set.speed = S.set.speed >= 3 ? 1 : S.set.speed + 1; save(); syncToggles(); sfx('tap'); };
 $('#banner .x').onclick = () => $('#banner').classList.remove('on');
 if (!storageOK) toast('This browser is not saving progress. Install the game or use a backup code.', 5000);
 initSW();
 setInterval(renderTopSafe, 60000);
}
boot();
