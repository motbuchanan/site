<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Sudoku</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;color:#e6ddd0;overflow:hidden;
    background:#1b120b;background-image:radial-gradient(ellipse at 50% -10%,#2a1c10,#1b120b 70%)}
  #app{display:flex;flex-direction:column;height:100svh;max-width:520px;margin:0 auto;
    padding:0 10px calc(8px + env(safe-area-inset-bottom))}
  #bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 9px) 2px 8px;flex:0 0 auto}
  #bar a.home{color:#e6ddd0;text-decoration:none;font-size:13px;border:1px solid #6e5f50;background:#2a241e;border-radius:999px;padding:6px 12px;font-weight:700}
  #title{font-weight:800;font-size:17px}
  #stats{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px;color:#c9ab85;font-weight:700}
  #timer{font-variant-numeric:tabular-nums}
  #ver{font-size:11px;color:#8a745a;border:1px solid #4a3c2c;border-radius:999px;padding:3px 8px;background:transparent;font-family:inherit;font-weight:700;cursor:pointer}
  #modes{display:flex;gap:6px;flex:0 0 auto;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
  #modes::-webkit-scrollbar{display:none}
  .mode{flex:0 0 auto;font-family:inherit;cursor:pointer;border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;
    border-radius:999px;padding:8px 14px;font-size:14px;font-weight:800;white-space:nowrap}
  .mode.on{background:#f4c542;color:#2a1c0c;border-color:#b8860b}
  .mode.daily.on{background:#5bb98a;border-color:#2f7d55;color:#0c2014}
  #boardWrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0}
  #board{display:grid;grid-template-columns:repeat(9,1fr);background:#3a2a18;border:3px solid #6b4f2c;
    border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.45);touch-action:manipulation;user-select:none;
    width:min(94vw,calc(100svh - 340px),460px);height:min(94vw,calc(100svh - 340px),460px)}
  .cell{position:relative;display:flex;align-items:center;justify-content:center;
    background:#f3e6c7;color:#2a1c0c;font-weight:700;cursor:pointer;
    font-size:min(6.2vw,26px);border-right:1px solid #cbb78d;border-bottom:1px solid #cbb78d;transition:background .08s}
  .cell.thr{border-right:2.5px solid #6b4f2c}
  .cell.thb{border-bottom:2.5px solid #6b4f2c}
  .cell.given{color:#23160a;font-weight:800;background:#ecdcb8}
  .cell.hint{color:#1f6b3a}
  .cell.user{color:#1d5fb0}
  .cell.wrong{color:#c62828;background:#f7d9d2}
  .cell.hl{background:#f6e7a8}
  .cell.hl.given{background:#eedd9f}
  .cell.same{background:#f3d674}
  .cell.peer{background:#efe0b6}
  .cell.sel{background:#f4c542;box-shadow:inset 0 0 0 3px #b8860b}
  .cell.sel.wrong{background:#f1b0a4}
  .cell.pop{animation:pop .18s ease}
  .cell.shake{animation:shake .3s}
  @keyframes pop{0%{transform:scale(.6);opacity:.4}100%{transform:scale(1);opacity:1}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .marks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    font-size:min(2.6vw,11px);color:#6b5a3c;font-weight:700;line-height:1;padding:1px}
  .marks span{display:flex;align-items:center;justify-content:center}
  .marks span.mk{color:#9a6a2a}
  #pad{margin:10px auto 0;display:grid;grid-template-columns:repeat(9,1fr);gap:5px;width:min(94vw,460px);flex:0 0 auto}
  #pad button{position:relative;font-family:inherit;font-weight:800;font-size:min(5.2vw,22px);padding:11px 0 13px;border-radius:10px;
    border:1px solid #6e5f50;background:#efe2c4;color:#2a1c0c;cursor:pointer}
  #pad button:active{transform:translateY(1px)}
  #pad button.spent{opacity:.3}
  #pad button em{position:absolute;bottom:2px;left:0;right:0;font-size:9px;font-style:normal;color:#9a6a2a;font-weight:700}
  #tools{margin:8px auto 0;display:flex;gap:6px;width:min(94vw,460px);flex:0 0 auto}
  #tools button{flex:1;font-family:inherit;font-weight:700;font-size:13px;padding:11px 0;border-radius:10px;
    border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;cursor:pointer}
  #tools button:active{transform:translateY(1px)}
  #tools button.on{background:#f4c542;color:#2a1c0c;border-color:#b8860b}
  #tools .sub{display:block;font-size:10px;color:#c9ab85;font-weight:700}
  #tools button.on .sub{color:#7a5c14}
  #msg{text-align:center;color:#cfc4b4;font-size:13px;min-height:18px;margin:9px 4px 2px;flex:0 0 auto}
  #toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);
    background:#2a241e;border:1px solid #6e5f50;color:#f4e9d6;padding:9px 16px;border-radius:999px;font-size:13px;
    font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80}
  #toast.show{opacity:1}
  .ov{position:fixed;inset:0;background:rgba(16,12,8,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:60;text-align:center;padding:22px}
  .ov.show{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .ov h1{font-size:27px;margin:0}
  .ov p{color:#cfc4b4;max-width:330px;font-size:15px;margin:0}
  .ov .big{font-size:46px}
  .act{font-family:inherit;font-size:15px;font-weight:800;padding:12px 22px;border-radius:11px;border:none;
    background:#46b06a;color:#0c2014;box-shadow:0 4px 0 #1e6038;cursor:pointer}
  .ghost{font-size:14px;padding:9px 16px;border-radius:10px;border:1px solid #6e5f50;background:#2a241e;color:#e6ddd0;text-decoration:none;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <a class="home" href="index.html">&#8962; Home</a>
    <div id="title">Sudoku</div>
    <div id="stats"><span id="timer">0:00</span><button id="ver">v2.0</button></div>
  </div>
  <div id="modes">
    <button class="mode daily" data-diff="daily">&#9733; Daily</button>
    <button class="mode" data-diff="gentle">Gentle</button>
    <button class="mode" data-diff="medium">Medium</button>
    <button class="mode" data-diff="hard">Hard</button>
    <button class="mode" data-diff="expert">Expert</button>
  </div>
  <div id="boardWrap"><div id="board"></div></div>
  <div id="pad"></div>
  <div id="tools">
    <button id="pencil">&#9998; Pencil<span class="sub" id="penState">off</span></button>
    <button id="erase">&#9003; Erase<span class="sub">clear cell</span></button>
    <button id="undo">&#8630; Undo<span class="sub" id="undoN">0</span></button>
    <button id="hint">&#128161; Hint<span class="sub" id="hintN">0 used</span></button>
    <button id="newp">&#10227; New<span class="sub">puzzle</span></button>
  </div>
  <div id="msg">Tap a square, then a number.</div>
</div>

<div id="toast"></div>

<div class="ov" id="overlay">
  <div class="big">&#127881;</div>
  <h1 id="ovTitle">Solved!</h1>
  <p id="ovText"></p>
  <button class="act" id="ovBtn">New puzzle</button>
  <button class="ghost" id="ovHome">Back home</button>
</div>

<script>
/* self-back home for the site iframe (no framework, no cloud) */
document.addEventListener('click',function(e){
  var a=e.target&&e.target.closest?e.target.closest('.home,#ovHome'):null;
  if(a){e.preventDefault();try{if(window.parent!==window){parent.history.back();return;}}catch(err){}window.location.href='index.html';}
},true);

/* ---------- tiny sound ---------- */
var AC=null;
function beep(type){
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    var f={place:660,tap:420,err:180,win:880}[type]||440;
    o.frequency.value=f;o.type=type==='err'?'sawtooth':'sine';
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+(type==='win'?.5:.16));
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+(type==='win'?.5:.18));
    if(type==='win'){[1100,1320].forEach(function(ff,k){var o2=AC.createOscillator(),g2=AC.createGain(),tt=t+.12+k*.12;o2.frequency.value=ff;g2.gain.setValueAtTime(.0001,tt);g2.gain.exponentialRampToValueAtTime(.1,tt+.01);g2.gain.exponentialRampToValueAtTime(.0001,tt+.3);o2.connect(g2);g2.connect(AC.destination);o2.start(tt);o2.stop(tt+.32);});}
  }catch(e){}
}

/* ---------- engine ---------- */
function rowOf(i){return (i/9)|0;} function colOf(i){return i%9;}
function ok(g,i,d){
  var r=rowOf(i),c=colOf(i),br=((r/3)|0)*3,bc=((c/3)|0)*3;
  for(var k=0;k<9;k++){if(g[r*9+k]===d)return false;if(g[k*9+c]===d)return false;}
  for(var a=0;a<3;a++)for(var b=0;b<3;b++)if(g[(br+a)*9+bc+b]===d)return false;
  return true;
}
function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,rng){for(var i=a.length-1;i>0;i--){var j=(rng()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;}return a;}

function solveCount(grid,limit){
  var g=grid.slice(),count=0;
  function bt(){
    if(count>=limit)return;
    var best=-1,bestC=10,bestCand=null;
    for(var i=0;i<81;i++){
      if(g[i]===0){
        var cand=[];
        for(var d=1;d<=9;d++)if(ok(g,i,d))cand.push(d);
        if(cand.length<bestC){bestC=cand.length;best=i;bestCand=cand;if(bestC<=1)break;}
      }
    }
    if(best<0){count++;return;}
    if(bestC===0)return;
    for(var k=0;k<bestCand.length;k++){g[best]=bestCand[k];bt();g[best]=0;if(count>=limit)return;}
  }
  bt();return count;
}
function genFull(rng){
  var g=new Array(81).fill(0);
  function fill(pos){
    if(pos>=81)return true;
    if(g[pos]!==0)return fill(pos+1);
    var ds=shuffle([1,2,3,4,5,6,7,8,9],rng);
    for(var k=0;k<9;k++){var d=ds[k];if(ok(g,pos,d)){g[pos]=d;if(fill(pos+1))return true;g[pos]=0;}}
    return false;
  }
  fill(0);return g;
}
var TARGET={gentle:40,medium:34,hard:30,expert:26};
function makePuzzle(diff,rng){
  var full=genFull(rng);
  var target=TARGET[diff]||34;
  var puzzle=full.slice(),clues=81;
  var order=shuffle(Array.from({length:81},function(_,i){return i;}),rng);
  for(var k=0;k<order.length&&clues>target;k++){
    var pos=order[k];if(puzzle[pos]===0)continue;
    var backup=puzzle[pos];puzzle[pos]=0;
    if(solveCount(puzzle,2)!==1)puzzle[pos]=backup; else clues--;
  }
  return {givens:puzzle,solution:full,clues:clues,diff:diff};
}

/* ---------- state ---------- */
var KEY="sudoku_v2";
var DIFFS={gentle:"Gentle",medium:"Medium",hard:"Hard",expert:"Expert",daily:"Daily"};
var given=[],sol=[],val=[],marks=[],hintCells=new Set(),hintsUsed=0,mistakes=0;
var sel=-1,pen=false,mode="gentle",dailyDate=null,undoStack=[];
var startTime=0,elapsed=0,timerInt=null,solved=false;

function $(id){return document.getElementById(id);}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return{};}}
function store(o){try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){}}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function dayRamp(){return ["expert","gentle","gentle","medium","medium","hard","hard"][new Date().getDay()];}

function saveGame(){
  var all=load();
  var e={},m={};
  for(var i=0;i<81;i++){if(!given[i]&&val[i])e[i]=val[i];if(marks[i]&&marks[i].length)m[i]=marks[i].slice();}
  all.cur={mode:mode,dailyDate:dailyDate,givens:given.join(""),solution:sol.join(""),
    e:e,m:m,h:[].concat(Array.from(hintCells)),used:hintsUsed,mistakes:mistakes,elapsed:elapsed,solved:solved};
  store(all);
}
function fmt(s){var m=(s/60)|0,ss=s%60;return m+":"+(ss<10?"0":"")+ss;}
function tick(){elapsed=((Date.now()-startTime)/1000)|0;$("timer").textContent=fmt(elapsed);}
function startTimer(){stopTimer();startTime=Date.now()-elapsed*1000;timerInt=setInterval(tick,1000);tick();}
function stopTimer(){if(timerInt){clearInterval(timerInt);timerInt=null;}}

function setBoards(g,s){
  given=g.slice();sol=s.slice();val=g.slice();
  marks=Array.from({length:81},function(){return[];});
  hintCells=new Set();hintsUsed=0;mistakes=0;sel=-1;undoStack=[];solved=false;elapsed=0;
}

function newPuzzle(diff){
  $("overlay").classList.remove("show");
  $("msg").textContent="Making a "+(DIFFS[diff]||diff).toLowerCase()+" puzzle...";
  // let the message paint before the (brief) generation blocks
  setTimeout(function(){
    var rng, actualDiff=diff, dd=null;
    if(diff==="daily"){
      dd=todayStr();var d=new Date();
      var seed=(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate())>>>0;
      rng=mulberry32(seed);actualDiff=dayRamp();
    }else{rng=mulberry32((Math.random()*2147483647)|0);}
    var p=makePuzzle(actualDiff,rng);
    mode=diff;dailyDate=dd;
    setBoards(p.givens,p.solution);
    // stash the "shown" difficulty label for daily
    p._label=diff==="daily"?"Daily · "+DIFFS[actualDiff]:DIFFS[actualDiff];
    lastLabel=p._label;
    setMode(diff);saveGame();render();startTimer();
  },30);
}
var lastLabel="Gentle";

function resume(saved){
  setBoards(saved.givens.split("").map(Number),saved.solution.split("").map(Number));
  if(saved.e)for(var k in saved.e){var i=+k;if(!given[i])val[i]=saved.e[k];}
  if(saved.m)for(var k2 in saved.m){var i2=+k2;if(!given[i2])marks[i2]=saved.m[k2].slice();}
  if(saved.h)saved.h.forEach(function(i3){hintCells.add(i3);val[i3]=sol[i3];});
  hintsUsed=saved.used||0;mistakes=saved.mistakes||0;elapsed=saved.elapsed||0;
  mode=saved.mode||"gentle";dailyDate=saved.dailyDate||null;solved=!!saved.solved;
  lastLabel=(mode==="daily"?"Daily":DIFFS[mode])||"Gentle";
  setMode(mode);render();if(!solved)startTimer();else stopTimer();
}

function setMode(m){
  var btns=document.querySelectorAll(".mode");
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle("on",btns[i].dataset.diff===m);
}

/* ---------- rendering ---------- */
function isSolved(){for(var i=0;i<81;i++)if(val[i]!==sol[i])return false;return true;}
function remaining(d){var n=0;for(var i=0;i<81;i++)if(val[i]===d&&val[i]===sol[i])n++;return 9-n;}
function boardEl(){return $("board");}

function render(){
  var b=boardEl();b.innerHTML="";
  var selVal=(sel>=0)?val[sel]:0;
  var sr=sel>=0?rowOf(sel):-1,sc=sel>=0?colOf(sel):-1,sb=sel>=0?((sr/3)|0)*3+((sc/3)|0):-1;
  for(var i=0;i<81;i++){
    var r=rowOf(i),c=colOf(i),bx=((r/3)|0)*3+((c/3)|0);
    var cell=document.createElement("div");cell.className="cell";
    if(c===2||c===5)cell.classList.add("thr");
    if(r===2||r===5)cell.classList.add("thb");
    if(given[i])cell.classList.add("given");
    else if(hintCells.has(i))cell.classList.add("hint");
    else if(val[i])cell.classList.add("user");
    if(!given[i]&&val[i]&&val[i]!==sol[i])cell.classList.add("wrong");
    if(i===sel)cell.classList.add("sel");
    else if(selVal&&val[i]===selVal)cell.classList.add("same");
    else if(sel>=0&&(r===sr||c===sc))cell.classList.add("hl");
    else if(sel>=0&&bx===sb)cell.classList.add("peer");
    if(val[i]){cell.textContent=val[i];}
    else if(marks[i]&&marks[i].length){
      var mk=document.createElement("div");mk.className="marks";
      for(var d=1;d<=9;d++){var sp=document.createElement("span");if(marks[i].indexOf(d)>=0){sp.textContent=d;sp.className="mk";}mk.appendChild(sp);}
      cell.appendChild(mk);
    }
    (function(ix){cell.addEventListener("click",function(){sel=ix;render();});})(i);
    b.appendChild(cell);
  }
  var pad=$("pad");pad.innerHTML="";
  for(var d2=1;d2<=9;d2++){
    var bt=document.createElement("button");bt.textContent=d2;
    var rem=remaining(d2);
    var em=document.createElement("em");em.textContent=rem>0?rem:"";bt.appendChild(em);
    if(rem<=0)bt.classList.add("spent");
    (function(dd){bt.addEventListener("click",function(){place(dd);});})(d2);
    pad.appendChild(bt);
  }
  $("penState").textContent=pen?"on":"off";
  $("pencil").classList.toggle("on",pen);
  $("undoN").textContent=undoStack.length;
  $("hintN").textContent=hintsUsed+" used";
  var filled=0;for(var f=0;f<81;f++)if(val[f])filled++;
  $("msg").textContent=solved?"Solved. Nice work.":
    (pen?"Pencil on: jot small notes.":(mistakes?(mistakes+" mistake"+(mistakes>1?"s":"")+" so far · "+filled+"/81"):filled+"/81 filled"));
}

function pushUndo(i){undoStack.push({i:i,v:val[i],m:marks[i].slice()});if(undoStack.length>60)undoStack.shift();}

function clearPeerMarks(i,d){
  var r=rowOf(i),c=colOf(i),br=((r/3)|0)*3,bc=((c/3)|0)*3;
  function drop(j){var k=marks[j].indexOf(d);if(k>=0)marks[j].splice(k,1);}
  for(var k=0;k<9;k++){drop(r*9+k);drop(k*9+c);}
  for(var a=0;a<3;a++)for(var b=0;b<3;b++)drop((br+a)*9+bc+b);
}

function place(d){
  if(sel<0){$("msg").textContent="Tap a square first.";return;}
  if(given[sel]||hintCells.has(sel)){beep("err");flash(sel,"shake");return;}
  if(solved)return;
  if(pen){
    if(val[sel])return;
    pushUndo(sel);
    var a=marks[sel],k=a.indexOf(d);if(k>=0)a.splice(k,1);else a.push(d);
    beep("tap");saveGame();render();return;
  }
  pushUndo(sel);
  val[sel]=d;marks[sel]=[];
  if(d===sol[sel]){beep("place");clearPeerMarks(sel,d);flash(sel,"pop");}
  else{beep("err");mistakes++;flash(sel,"shake");}
  saveGame();render();
  if(isSolved())win();
}
function flash(i,cls){
  var cells=boardEl().children;if(cells[i]){cells[i].classList.add(cls);setTimeout(function(){if(cells[i])cells[i].classList.remove(cls);},300);}
}
function eraseCell(){
  if(sel<0)return;
  if(given[sel]||hintCells.has(sel)){beep("err");return;}
  if(!val[sel]&&!(marks[sel]&&marks[sel].length))return;
  pushUndo(sel);val[sel]=0;marks[sel]=[];beep("tap");saveGame();render();
}
function undo(){
  if(!undoStack.length)return;
  var u=undoStack.pop();val[u.i]=u.v;marks[u.i]=u.m;sel=u.i;beep("tap");saveGame();render();
}
function doHint(){
  if(solved)return;
  var t=-1;
  if(sel>=0&&!given[sel]&&!hintCells.has(sel)&&val[sel]!==sol[sel])t=sel;
  if(t<0){var empties=[];for(var i=0;i<81;i++)if(!given[i]&&val[i]!==sol[i])empties.push(i);if(!empties.length)return;t=empties[(Math.random()*empties.length)|0];}
  pushUndo(t);val[t]=sol[t];marks[t]=[];hintCells.add(t);hintsUsed++;sel=t;clearPeerMarks(t,sol[t]);
  beep("place");flash(t,"pop");saveGame();render();
  if(isSolved())win();
}

function win(){
  solved=true;stopTimer();beep("win");saveGame();
  var isDaily=mode==="daily",streakLine="";
  if(isDaily){
    var all=load(),ds=all.daily||{streak:0,last:""},t=todayStr();
    if(ds.last!==t){
      var y=new Date(Date.now()-86400000),ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
      ds.streak=(ds.last===ys)?ds.streak+1:1;ds.last=t;all.daily=ds;store(all);
    }
    streakLine=" Daily streak: "+(load().daily.streak||1)+".";
  }
  $("ovTitle").textContent=isDaily?"Daily solved!":"Solved!";
  $("ovText").textContent=lastLabel.replace("Daily · ","")+" · "+fmt(elapsed)+" · "+
    (hintsUsed?(hintsUsed+" hint"+(hintsUsed>1?"s":"")):"no hints")+
    (mistakes?(" · "+mistakes+" mistake"+(mistakes>1?"s":"")):"")+"."+streakLine;
  $("ovBtn").textContent=isDaily?"Free play":"New puzzle";
  $("overlay").classList.add("show");
}
function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show");},1400);}

/* ---------- input wiring ---------- */
document.querySelectorAll(".mode").forEach(function(btn){
  btn.addEventListener("click",function(){newPuzzle(btn.dataset.diff);});
});
$("pencil").addEventListener("click",function(){pen=!pen;render();});
$("erase").addEventListener("click",eraseCell);
$("undo").addEventListener("click",undo);
$("hint").addEventListener("click",doHint);
$("newp").addEventListener("click",function(){newPuzzle(mode==="daily"?dayRamp():mode);});
$("ver").addEventListener("click",function(){toast("Sudoku v2.0 loaded");});
$("ovBtn").addEventListener("click",function(){$("overlay").classList.remove("show");newPuzzle(mode==="daily"?"medium":mode);});

document.addEventListener("keydown",function(e){
  if(e.key>="1"&&e.key<="9"){place(+e.key);e.preventDefault();return;}
  if(e.key==="Backspace"||e.key==="Delete"||e.key==="0"){eraseCell();e.preventDefault();return;}
  if(e.key.toLowerCase()==="p"){pen=!pen;render();return;}
  if(e.key.toLowerCase()==="u"){undo();return;}
  if(sel<0)sel=0;
  var r=rowOf(sel),c=colOf(sel);
  if(e.key==="ArrowUp"){sel=((r+8)%9)*9+c;render();e.preventDefault();}
  else if(e.key==="ArrowDown"){sel=((r+1)%9)*9+c;render();e.preventDefault();}
  else if(e.key==="ArrowLeft"){sel=r*9+((c+8)%9);render();e.preventDefault();}
  else if(e.key==="ArrowRight"){sel=r*9+((c+1)%9);render();e.preventDefault();}
});

/* ---------- boot ---------- */
(function(){
  var all=load(),c=all.cur;
  if(c&&c.givens&&c.solution){
    // if it's a daily from a previous day, start today's instead
    if(c.mode==="daily"&&c.dailyDate&&c.dailyDate!==todayStr()){newPuzzle("gentle");}
    else resume(c);
  }else{newPuzzle("gentle");}
})();
</script>
