<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Code Breaker</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:system-ui,sans-serif;color:#e8f0e4;overflow:hidden;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 50% 20%,#1f3327 0%,#0c1410 70%);}
  #bar{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  #bar a{color:#cfe6d8;text-decoration:none;font-size:14px;border:1px solid #3a5a47;border-radius:999px;padding:6px 12px;}
  #title{font-weight:800;font-size:19px;}
  #roundTag{margin-left:auto;font-weight:700;font-size:14px;color:#bcd6c7;}
  #history{flex:1;overflow-y:auto;padding:4px 14px;display:flex;flex-direction:column;gap:6px;}
  .row{display:flex;align-items:center;gap:10px;justify-content:center;}
  .row .gnum{width:22px;text-align:right;font-size:12px;color:#7d9a88;font-variant-numeric:tabular-nums;}
  .pegs{display:flex;gap:7px;}
  .peg{width:30px;height:30px;border-radius:50%;box-shadow:inset 0 -3px 5px rgba(0,0,0,.4),inset 0 2px 3px rgba(255,255,255,.45),0 2px 4px rgba(0,0,0,.4);}
  .peg.empty{background:#0e1813;box-shadow:inset 0 2px 5px rgba(0,0,0,.6);}
  .fb{display:grid;grid-template-columns:repeat(2,12px);gap:3px;width:30px;}
  .fbp{width:11px;height:11px;border-radius:50%;background:#0e1813;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);}
  .fbp.b{background:radial-gradient(circle at 35% 30%,#666,#111);}
  .fbp.w{background:radial-gradient(circle at 35% 30%,#fff,#bbb);}
  #entry{padding:6px 14px 2px;display:flex;flex-direction:column;gap:8px;align-items:center;}
  #slots{display:flex;gap:9px;}
  .slot{width:40px;height:40px;border-radius:50%;background:#0e1813;border:2px dashed #3a5a47;cursor:pointer;
    box-shadow:inset 0 2px 5px rgba(0,0,0,.6);}
  .slot.filled{border-style:solid;border-color:rgba(255,255,255,.3);
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.45),0 2px 5px rgba(0,0,0,.4);}
  .slot.cursor{border-color:#b0d235;box-shadow:0 0 10px rgba(176,210,53,.5),inset 0 2px 5px rgba(0,0,0,.6);}
  #palette{display:flex;gap:9px;}
  .pal{width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
    box-shadow:inset 0 -4px 6px rgba(0,0,0,.4),inset 0 2px 4px rgba(255,255,255,.5),0 3px 6px rgba(0,0,0,.45);}
  #msg{min-height:22px;text-align:center;font-size:14px;color:#d8e8dd;padding:0 16px;}
  #foot{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 14px 16px;}
  .act{font-family:inherit;font-size:15px;font-weight:bold;padding:10px 20px;border-radius:10px;border:none;
    color:#1c2b16;background:#b0d235;cursor:pointer;box-shadow:0 4px 0 #7e9a1f,0 5px 10px rgba(0,0,0,.4);}
  .act:disabled{opacity:.4;}
  .act.ghost{background:#15241b;color:#cfe6d8;box-shadow:0 4px 0 #0b160f;border:1px solid #3a5a47;}
  #score{font-size:14px;color:#bcd6c7;}
  .ov{position:fixed;inset:0;background:rgba(7,12,9,.96);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50;text-align:center;padding:24px;}
  .ov.show{display:flex;}
  .ov h1{font-size:26px;}
  .ov p{color:#bcd6c7;max-width:300px;line-height:1.45;}
  #confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .cf{position:absolute;width:10px;height:14px;top:-20px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
</style>

<script>
/* Standalone shim replacing the Game Shelf framework for the public showcase (board games v2: mode picker + cube die).
   No cloud, no accounts: solo + pass-and-play only. Records stay on this device. */
(function(){
var GN={
 g:{addSentHome:function(){},addDice:function(){}},
 friendly:false,
 whoBadge:function(el,name){if(el)el.textContent=name||'';},
 soloStart:function(cb){if(typeof cb==='function')cb('You');},
 matchStart:function(cb,opts){opts=opts||{};
   var P1={name:'Player 1',color:'#d8312b',light:'#f06a60',dark:'#8d1d19'},P2={name:'Player 2',color:'#2f6fd0',light:'#6fa0ec',dark:'#194182'};
   function go(mode){
     var m;
     if(mode==='solo'){var you={name:'You',color:P1.color,light:P1.light,dark:P1.dark};m={a:you,b:null,first:you,solo:true,friendly:false,vsComputer:false};}
     else if(mode==='cpu'){var y={name:'Player 1',color:P1.color,light:P1.light,dark:P1.dark},c={name:'Computer',color:P2.color,light:P2.light,dark:P2.dark};m={a:y,b:c,first:Math.random()<.5?y:c,friendly:false,vsComputer:true,bot:'medium'};}
     else{m={a:P1,b:P2,first:Math.random()<.5?P1:P2,friendly:false,vsComputer:false};}
     if(typeof cb==='function')cb(m);
   }
   var alt=opts.bot?['cpu','Play the computer']:(opts.solo?['solo','Play solo']:null);
   if(!alt){go('pnp');return;}
   var ov=document.createElement('div');
   ov.style.cssText='position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(5,7,10,.82);padding:20px;font-family:inherit';
   var bs='display:block;width:100%;margin:10px 0 0;padding:14px 16px;border-radius:12px;font:inherit;font-size:16px;font-weight:700;cursor:pointer;';
   ov.innerHTML='<div style="width:100%;max-width:320px;background:#141a21;border:1px solid #2b323b;border-radius:16px;padding:20px 18px 18px;color:#ebedef;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.5)">'+
     '<div style="font-size:18px;font-weight:800">Who is playing?</div>'+
     '<button data-m="'+alt[0]+'" style="'+bs+'border:1px solid #2c8c80;background:rgba(76,240,224,.14);color:#4cf0e0">'+alt[1]+'</button>'+
     '<button data-m="pnp" style="'+bs+'border:1px solid #3a434e;background:rgba(255,255,255,.05);color:#ebedef">Pass and play</button>'+
     '<div style="margin-top:12px;font-size:12px;opacity:.6">Two players, one phone.</div></div>';
   ov.addEventListener('click',function(e){var t=e.target.closest('[data-m]');if(!t)return;ov.remove();go(t.getAttribute('data-m'));});
   document.body.appendChild(ov);
 }, sync:function(){}, statsButton:function(){},
 players:function(){return [];},
 recordGame:function(key,rec){try{var k='gnl_'+key,a=JSON.parse(localStorage.getItem(k)||'[]');a.push(rec);if(a.length>200)a=a.slice(-200);localStorage.setItem(k,JSON.stringify(a));}catch(e){}},
 readGames:function(key){try{return JSON.parse(localStorage.getItem('gnl_'+key)||'[]');}catch(e){return [];}},
 confirmEnd:function(msg,onYes,onNo){var ok=window.confirm(msg);if(ok){if(typeof onYes==='function')onYes();}else if(typeof onNo==='function'){onNo();}},
 rulesButton:function(el,spec){
   if(!el)return;var b=document.createElement('button');b.textContent='Rules';
   b.style.cssText='margin:6px;padding:9px 16px;border-radius:10px;border:1px solid #556;background:rgba(255,255,255,.06);color:inherit;font:inherit;cursor:pointer';
   b.addEventListener('click',function(){
     var ov=document.createElement('div');
     ov.style.cssText='position:fixed;inset:0;z-index:99;background:rgba(5,7,10,.93);overflow:auto;padding:26px 18px 40px;color:#e8e8ea;line-height:1.55;font-family:inherit';
     var h='<div style="max-width:560px;margin:0 auto">';
     h+='<h2 style="font-size:22px;margin:0 0 14px">'+((spec&&spec.title)||'Rules')+'</h2>';
     ((spec&&spec.sections)||[]).forEach(function(s){
       if(typeof s==='string'){h+='<p style="margin:0 0 12px">'+s+'</p>';return;}
       if(s.h)h+='<h3 style="font-size:15px;margin:16px 0 6px;color:#9fe8dd">'+s.h+'</h3>';
       if(s.svg)h+='<div style="margin:8px 0">'+s.svg+'</div>';
       if(s.t)h+='<p style="margin:0 0 8px;font-size:14px">'+s.t+'</p>';
       if(s.ex)h+='<p style="margin:0 0 8px;font-size:13px;font-style:italic;opacity:.8">'+s.ex+'</p>';
     });
     h+='<div><button id="gnRulesClose" style="margin-top:16px;padding:11px 22px;border-radius:10px;border:1px solid #2c8c80;background:rgba(76,240,224,.12);color:#4cf0e0;font:inherit;cursor:pointer">Close</button></div></div>';
     ov.innerHTML=h;document.body.appendChild(ov);
     ov.querySelector('#gnRulesClose').addEventListener('click',function(){ov.remove();});
   });
   el.appendChild(b);
 }
};
(function(){
// ---- shared 3D cube die ----
const CUBE_RING={1:[2,3],2:[1,4],3:[1,2],4:[1,5],5:[1,3],6:[2,4]};
const CUBE_PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
let _cubeCSS=false;
function cubeCSSOnce(){if(_cubeCSS)return;_cubeCSS=true;
  const st=document.createElement("style");
  st.textContent=
   ".gnCubeWrap{position:relative;perspective:520px;will-change:transform;display:inline-block;}"+
   ".gnCube{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform;transform:rotateX(-9deg) rotateY(11deg);}"+
   ".gnCf{position:absolute;inset:0;border-radius:11%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11%;backface-visibility:hidden;box-shadow:inset 0 0 0 1px rgba(120,100,60,.25);}"+
   ".gnCfF{background:linear-gradient(150deg,#fbf8ef 0%,#efe9da 65%,#ded6c2 100%);transform:translateZ(var(--dh));}"+
   ".gnCfT{background:linear-gradient(150deg,#ffffff 0%,#f8f4ea 70%,#ece5d4 100%);transform:rotateX(90deg) translateZ(var(--dh));}"+
   ".gnCfR{background:linear-gradient(150deg,#e2dac6 0%,#d2c8b0 70%,#bfb499 100%);transform:rotateY(90deg) translateZ(var(--dh));}"+
   ".gnCf i{border-radius:50%;background:radial-gradient(circle at 38% 32%,#3a4458,#10151f 70%);visibility:hidden;box-shadow:inset 0 1.5px 2px rgba(0,0,0,.55),0 .5px 0 rgba(255,255,255,.35);}"+
   ".gnCubeBust .gnCfF{background:linear-gradient(150deg,#f3b3ac 0%,#e2887e 65%,#cb6a60 100%);}"+
   ".gnCubeBust .gnCfT{background:linear-gradient(150deg,#f8c5bf 0%,#eda49b 70%,#dd9088 100%);}"+
   ".gnCubeBust .gnCf i{background:radial-gradient(circle at 38% 32%,#fff,#f3e0dd 70%);}"+
   ".gnCubeShadow{position:absolute;left:8%;right:8%;bottom:-12%;height:18%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(0,0,0,.4),rgba(0,0,0,0) 70%);}";
  document.head.appendChild(st);}
GN.cubeDie=function(size){cubeCSSOnce();
  const wrap=document.createElement("div");wrap.className="gnCubeWrap";
  wrap.style.width=size+"px";wrap.style.height=size+"px";
  wrap.style.setProperty("--dh",(size/2)+"px");
  const shadow=document.createElement("div");shadow.className="gnCubeShadow";wrap.appendChild(shadow);
  const cube=document.createElement("div");cube.className="gnCube";wrap.appendChild(cube);
  const faces={};
  for(const[cls,key]of[["gnCfF","F"],["gnCfT","T"],["gnCfR","R"]]){
    const f=document.createElement("div");f.className="gnCf "+cls;
    for(let i=0;i<9;i++)f.appendChild(document.createElement("i"));
    cube.appendChild(f);faces[key]=f;}
  function faceSet(f,v){const on=CUBE_PIPS[v]||[];
    [...f.children].forEach((p,i)=>{p.style.visibility=on.includes(i)?"visible":"hidden";});}
  function show(v){faceSet(faces.F,v);faceSet(faces.T,CUBE_RING[v][0]);faceSet(faces.R,CUBE_RING[v][1]);}
  let busyT=false;
  function tumble(finalV,opts,done){if(typeof opts==="function"){done=opts;opts={};}opts=opts||{};
    if(busyT)return;busyT=true;
    const dur=opts.duration||640,hop=opts.hop!==undefined?opts.hop:size*0.55;
    const sgn=()=>Math.random()<0.5?-1:1;
    const RX=sgn()*(360+Math.floor(Math.random()*2)*360),RY=sgn()*(360+Math.floor(Math.random()*2)*360);
    const drift=(Math.random()*2-1)*size*0.2;
    if(wrap.animate)wrap.animate([
      {transform:"translate(0,0) scale(1,1)"},
      {transform:"translate(0,"+(size*0.12)+"px) scale(1.1,0.74)",offset:0.12},
      {transform:"translate("+drift+"px,"+(-hop)+"px) scale(0.97,1.03)",offset:0.44,easing:"cubic-bezier(.2,.9,.4,1)"},
      {transform:"translate("+(drift*0.35)+"px,0) scale(1.08,0.88)",offset:0.7,easing:"cubic-bezier(.5,0,.8,.4)"},
      {transform:"translate(0,"+(-hop*0.15)+"px) scale(1,1)",offset:0.85},
      {transform:"translate(0,0) scale(1,1)"}],{duration:dur,easing:"linear"});
    if(cube.animate)cube.animate([
      {transform:"rotateX(-9deg) rotateY(11deg)"},
      {transform:"rotateX("+(-9+RX*0.55)+"deg) rotateY("+(11+RY*0.55)+"deg)",offset:0.45,easing:"cubic-bezier(.25,.8,.5,1)"},
      {transform:"rotateX("+(-9+RX)+"deg) rotateY("+(11+RY)+"deg)",offset:0.86,easing:"cubic-bezier(.3,.7,.4,1)"},
      {transform:"rotateX("+(-9+RX)+"deg) rotateY("+(11+RY)+"deg)"}],{duration:dur,easing:"linear"});
    let n=0;const steps=Math.max(6,Math.floor(dur/64));
    const iv=setInterval(()=>{show(1+Math.floor(Math.random()*6));
      if(++n>=steps){clearInterval(iv);show(finalV);busyT=false;if(done)done();}},Math.floor(dur/(steps+1)));}
  show(1);
  return{el:wrap,show,tumble,setBust:function(b){wrap.classList.toggle("gnCubeBust",!!b);}};};
})();
window.GN=GN;
document.addEventListener('click',function(e){
  var a=e.target&&e.target.closest?e.target.closest('a[href="index.html"]'):null;
  if(a){e.preventDefault();try{if(window.parent!==window){parent.history.back();return;}}catch(err){}try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back();return;}}catch(err){}window.location.href='index.html';}
},true);
})();
</script>

<script>
const KEY="cb_games",SLOTS=4,MAXG=10;
function S(n,o){window.GNS&&GNS.play(n,0,o);}
const COLORS=["#d8312b","#f4c542","#46b06a","#2f6fd0","#b06ad0","#e8e4da"];
function gloss(col){return "radial-gradient(circle at 32% 26%,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 22%),radial-gradient(circle at 35% 30%,"+col+"f0,"+col+" 55%,"+col+"88)";}
let P={A:{name:"Player 1",main:"#d8312b",light:"#f06a60",dark:"#8d1d19"},B:{name:"Player 2",main:"#2f6fd0",light:"#6fa0ec",dark:"#194182"}};
function seatFrom(p){return{name:p.name,main:p.color,light:p.light,dark:p.dark};}
// round 1: A sets, B guesses. round 2: swap. lower total guesses wins (fail = MAXG+1)
let phase="over",round=1,setter="A",code=null,cur=[],cursor=0,guesses=[],used={A:null,B:null},GS=null,mode="set",solo=false;
function feedback(code,guess){let black=0;
  const cc={},gc={};
  for(let i=0;i<SLOTS;i++){
    if(code[i]===guess[i])black++;
    else{cc[code[i]]=(cc[code[i]]||0)+1;gc[guess[i]]=(gc[guess[i]]||0)+1;}}
  let white=0;
  for(const k in gc)white+=Math.min(gc[k],cc[k]||0);
  return{black,white};}
function guesserOf(){return setter==="A"?"B":"A";}
function newGame(){phase="over";
  document.getElementById("overlay").classList.remove("show");
  document.getElementById("confetti").innerHTML="";
  GN.matchStart(function(m){solo=!!m.solo;P=solo?{A:seatFrom(m.a)}:{A:seatFrom(m.a),B:seatFrom(m.b)};
    round=1;used={A:null,B:null};
    setter=solo?"B":((m.first===m.a)?"A":"B"); // solo: guesserOf()->A; else flip winner SETS first (guessing second = knowing the target)
    GS={start:Date.now(),flipWinner:(m.first||m.a).name,friendly:m.friendly};
    startRound();},{solo:true});}
function startRound(){code=null;cur=[];cursor=0;guesses=[];mode="set";phase="play";
  document.getElementById("history").innerHTML="";
  if(solo){
    code=Array.from({length:SLOTS},()=>Math.floor(Math.random()*COLORS.length));
    cur=[];cursor=0;mode="guess";
    curtain("Crack the code",
      "The computer picked a secret "+SLOTS+"-peg code \u2014 colors may repeat. You have "+MAXG+" guesses. Black peg = right color & spot, white = right color, wrong spot.",
      ()=>{buildEntry();setMessage(P.A.name+": build a guess and fire.");render();});
    return;}
  curtain(P[setter].name+" sets the code",
    "Pass the phone to "+P[setter].name+". Pick a secret 4-peg code \u2014 colors may repeat. "+P[guesserOf()].name+", look away!",
    ()=>{buildEntry();setMessage(P[setter].name+": tap colors to build your secret code.");render();});}
function curtain(title,text,then){const c=document.getElementById("curtain");
  document.getElementById("cTitle").textContent=title;
  document.getElementById("cText").textContent=text;
  c.classList.add("show");
  document.getElementById("cBtn").onclick=()=>{c.classList.remove("show");then();};}
function buildEntry(){const s=document.getElementById("slots");s.innerHTML="";
  for(let i=0;i<SLOTS;i++){const d=document.createElement("div");d.className="slot";d.id="slot"+i;
    d.addEventListener("click",()=>{cursor=i;render();});
    s.appendChild(d);}
  const p=document.getElementById("palette");p.innerHTML="";
  COLORS.forEach((col,ci)=>{const b=document.createElement("button");b.className="pal";
    b.style.background=gloss(col);
    b.style.backgroundColor=col;
    b.addEventListener("click",()=>{cur[cursor]=ci;cursor=Math.min(SLOTS-1,cursor+1);render();});
    p.appendChild(b);});}
function render(){for(let i=0;i<SLOTS;i++){const d=document.getElementById("slot"+i);if(!d)continue;
    d.classList.toggle("cursor",i===cursor&&phase==="play");
    if(cur[i]!==undefined){d.classList.add("filled");d.style.background=gloss(COLORS[cur[i]]);}
    else{d.classList.remove("filled");d.style.background="#0e1813";}}
  document.getElementById("roundTag").textContent=solo?"Crack the code":("Round "+round+" of 2 \u00b7 "+(mode==="set"?P[setter].name+" sets":P[guesserOf()].name+" cracks"));
  document.getElementById("goBtn").textContent=mode==="set"?"Lock it in":"Guess";
  document.getElementById("goBtn").disabled=phase!=="play"||cur.filter(x=>x!==undefined).length<SLOTS;
  const recs=GN.readGames(KEY);let a=0,b=0;
  for(const r of recs){if(r.winner===P.A.name)a++;else if(r.winner===P.B.name)b++;}
  document.getElementById("score").textContent=P.A.name+" "+a+" \u00b7 "+b+" "+P.B.name+((GS&&GS.friendly)?" \u00b7 friendly":"");}
function setMessage(t){document.getElementById("msg").textContent=t;}
function addRow(guess,fb){const h=document.getElementById("history");
  const row=document.createElement("div");row.className="row";
  row.innerHTML='<div class="gnum">'+guesses.length+'</div>';
  const pegs=document.createElement("div");pegs.className="pegs";
  for(const g of guess){const p=document.createElement("div");p.className="peg";
    p.style.background=gloss(COLORS[g]);
    p.style.backgroundColor=COLORS[g];pegs.appendChild(p);}
  row.appendChild(pegs);
  const f=document.createElement("div");f.className="fb";
  for(let i=0;i<4;i++){const fp=document.createElement("div");fp.className="fbp";
    if(i<fb.black)fp.classList.add("b");else if(i<fb.black+fb.white)fp.classList.add("w");
    f.appendChild(fp);}
  row.appendChild(f);h.appendChild(row);h.scrollTop=h.scrollHeight;}
function go(){if(phase!=="play"||cur.filter(x=>x!==undefined).length<SLOTS)return;
  if(mode==="set"){code=cur.slice();cur=[];cursor=0;mode="guess";
    curtain(P[guesserOf()].name+" cracks it",
      "Pass to "+P[guesserOf()].name+". You have "+MAXG+" guesses. Black peg = right color, right spot. White peg = right color, wrong spot.",
      ()=>{setMessage(P[guesserOf()].name+": build a guess and fire.");render();});
    render();return;}
  const guess=cur.slice();cur=[];cursor=0;
  guesses.push(guess);
  const fb=feedback(code,guess);
  addRow(guess,fb);
  if(fb.black===SLOTS){used[guesserOf()]=guesses.length;
    setMessage("CRACKED in "+guesses.length+"!");
    endRound(true);return;}
  if(guesses.length>=MAXG){used[guesserOf()]=MAXG+1;
    setMessage("Out of guesses \u2014 the code held.");
    endRound(false);return;}
  setMessage((MAXG-guesses.length)+" guesses left.");render();}
function endRound(cracked){phase="over";render();
  setTimeout(()=>{
    if(solo){finishGame();return;}
    if(round===1){round=2;setter=guesserOf();startRound();}
    else finishGame();},1400);}
function finishGame(){
  if(solo){const u=used.A,cracked=u<=MAXG;
    document.getElementById("ovTitle").textContent=cracked?("Cracked in "+u+"!"):"The code held!";
    document.getElementById("ovText").textContent=cracked?(P.A.name+" broke it in "+u+" guess"+(u>1?"es":"")+"."):("Out of guesses \u2014 the secret code wins this time.");
    if(cracked){const box=document.getElementById("confetti"),cols=[P.A.main,P.A.light,"#f4c542","#fff"];
      for(let i=0;i<60;i++){const d=document.createElement("div");d.className="cf";d.style.left=Math.random()*100+"%";
        d.style.background=cols[i%cols.length];d.style.animationDuration=(2.2+Math.random()*1.8)+"s";
        d.style.animationDelay=(Math.random()*0.8)+"s";box.appendChild(d);}}
    S("fanfare");document.getElementById("overlay").classList.add("show");phase="over";render();return;}
  const w=used.A===used.B?null:(used.A<used.B?"A":"B");
  const rec={start:GS.start,end:Date.now(),durationMs:Date.now()-GS.start,
    winner:w?P[w].name:null,loser:w?P[w==="A"?"B":"A"].name:null,draw:!w,
    flipWinner:GS.flipWinner,
    guesses:(function(){const s={};s[P.A.name]=used.A;s[P.B.name]=used.B;return s;})(),
    cracked:(function(){const s={};s[P.A.name]=used.A<=MAXG?1:0;s[P.B.name]=used.B<=MAXG?1:0;return s;})()};
  GN.recordGame(KEY,rec);
  const fmt=u=>u>MAXG?"failed":u+" guess"+(u>1?"es":"");
  document.getElementById("ovTitle").textContent=w?P[w].name+" out-cracks!":"Locked even!";
  document.getElementById("ovText").textContent=P.A.name+" "+fmt(used.A)+" \u00b7 "+P.B.name+" "+fmt(used.B);
  if(w){const box=document.getElementById("confetti"),cols=[P[w].main,P[w].light,"#f4c542","#fff"];
    for(let i=0;i<60;i++){const d=document.createElement("div");d.className="cf";d.style.left=Math.random()*100+"%";
      d.style.background=cols[i%cols.length];d.style.animationDuration=(2.2+Math.random()*1.8)+"s";
      d.style.animationDelay=(Math.random()*0.8)+"s";box.appendChild(d);}}
  S("fanfare");document.getElementById("overlay").classList.add("show");phase="over";render();}
document.getElementById("goBtn").addEventListener("click",go);
document.getElementById("newBtn").addEventListener("click",newGame);
document.getElementById("ovBtn").addEventListener("click",newGame);
GN.rulesButton(document.getElementById("foot"),{title:"Codebreaker",sections:[
 {h:"Goal",t:"One player sets a secret 4-peg color code; the other has 10 guesses to crack it. Then you swap \u2014 fewer guesses wins."},
 {h:"Setting the code",t:"The setter secretly picks 4 pegs from 6 colors \u2014 repeats ARE allowed, and doubles make wickedly harder codes. The pass curtain keeps it hidden."},
 {h:"The clues",svg:'<svg viewBox="0 0 280 60"><g><circle cx="40" cy="30" r="12" fill="#d8312b"/><circle cx="72" cy="30" r="12" fill="#f4c542"/><circle cx="104" cy="30" r="12" fill="#46b06a"/><circle cx="136" cy="30" r="12" fill="#2f6fd0"/><rect x="168" y="12" width="100" height="36" rx="8" fill="#1c2b22"/><circle cx="186" cy="24" r="6" fill="#111"/><circle cx="204" cy="24" r="6" fill="#111"/><circle cx="222" cy="24" r="6" fill="#fff"/><text x="218" y="46" font-size="9.5" fill="#cfe6d8" font-family="system-ui" text-anchor="middle">2 black \u00b7 1 white</text></g></svg>',
  t:"After each guess: a BLACK clue peg for every guess peg that's the right color in the right spot, a WHITE peg for right color, wrong spot. The clue pegs are NOT in order \u2014 they describe the guess as a whole.",
  ex:"Code R-Y-G-B, guess R-G-Y-Y: the R earns a black; G and Y are present but misplaced \u2014 two whites. The second Y earns nothing: clues never count a code peg twice."},
 {h:"Cracking it",t:"Early guesses should SPREAD colors to learn what's in the code; later guesses rearrange what you know. Every clue rules out thousands of codes \u2014 write nothing down, argue everything out loud."},
 {h:"The duel",t:"Both players set and both players guess \u2014 the cracker who needed fewer guesses takes the game. A code unbroken in 10 scores as 11 against you, so setters: be cruel."}]});
GN.statsButton(document.getElementById("foot"),{title:"Code Breaker",key:KEY,specials:[
 {label:"Codes cracked",of:(r,n)=>r.reduce((a,x)=>a+((x.cracked&&x.cracked[n])||0),0)},
 {label:"Best crack (guesses)",of:(r,n)=>{const w=r.filter(x=>x.guesses&&x.guesses[n]&&x.guesses[n]<=10);return w.length?Math.min(...w.map(x=>x.guesses[n])):0;}},
 {label:"Coin flips won",of:(r,n)=>r.filter(x=>x.flipWinner===n).length}]});
if(window.GNS)GNS.button(document.getElementById("foot"));
newGame();
