<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>RoughCut moved</title>
<meta http-equiv="refresh" content="0;url=https://motbuchanan.github.io/roughcut/">
<link rel="canonical" href="https://motbuchanan.github.io/roughcut/">
<style>
html,body{margin:0;background:#0e1217;color:#ebedef;font:500 16px/1.5 Archivo,system-ui,-apple-system,sans-serif}
main{min-height:100svh;display:grid;place-items:center;padding:24px;text-align:center}
a{color:#4cf0e0}
</style>
</head>
<body>
<main>
  <div>
    <p>RoughCut lives at its own address now.</p>
    <p><a href="https://motbuchanan.github.io/roughcut/">Open RoughCut</a></p>
  </div>
</main>
<script>
/* This folder is the old copy. The real app is the standalone repo. Clear any old cache for this path, then go there. */
(function(){
  var go=function(){location.replace('https://motbuchanan.github.io/roughcut/');};
  if(navigator.serviceWorker&&navigator.serviceWorker.getRegistrations){
    navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister();}));}).then(go,go);
  }else{go();}
})();
</script>
</body>
</html>
